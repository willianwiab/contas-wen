<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12060a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工廠">
<meta name="description" content="中國表情符號工廠 — a Fábrica de Emojis da China: zodíaco, dragões, lanternas e os festivais chineses. 800 emojis, 120 raridades e 4 modos de jogo.">
<title>中國表情符號工廠</title>
<style>
  :root {
    --bg:#12060a; --painel:#26101a; --painel2:#33141f; --linha:#5c2733;
    --ink:#fff2ef; --dim:#c99a9a;
    --ouro:#ffcf5c; --verde:#6ee7a0; --rosa:#ff5f6d; --azul:#7ac9ff; --cristal:#6ef0c8;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --r: 16px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; padding:16px 12px 26px; color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 460px at 50% -10%, #8c1220 0%, transparent 62%),
      radial-gradient(640px 420px at 92% 105%, #7a3b06 0%, transparent 58%),
      radial-gradient(520px 360px at 5% 60%, #3a0a12 0%, transparent 62%), var(--bg);
    background-attachment: fixed;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }

  /* ---------- topo ---------- */
  header { text-align:center; width:min(1080px,100%); }
  .marca { font-family:var(--mono); font-size:.64rem; letter-spacing:.4em; color:var(--dim); text-transform:uppercase; }
  .marca b { color:var(--ouro); }
  /* o nome chinês é o nome do jogo; o português vem embaixo, miudinho */
  .marca.cn {
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;
    font-size:clamp(1.05rem,3.6vw,1.5rem); letter-spacing:.22em; color:var(--ouro);
    text-transform:none; font-weight:700; text-shadow:0 0 18px #ff3b3b55;
  }
  .marca.cn b { color:#ff6b5f; }
  .marca.br { font-size:.56rem; letter-spacing:.34em; margin-top:3px; }
  #dinheiro {
    font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:700;
    font-size:clamp(1.9rem,7.5vw,3.1rem); line-height:1.05; margin-top:6px;
    background:linear-gradient(180deg,#fff 8%,var(--ouro) 92%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .stats { display:flex; gap:6px; margin-top:11px; flex-wrap:wrap; justify-content:center; }
  .stat {
    background:linear-gradient(180deg,#ffffff0e,#ffffff05); border:1px solid var(--linha);
    border-radius:12px; padding:6px 12px; min-width:86px; backdrop-filter:blur(4px);
  }
  .stat .k { font-size:.55rem; letter-spacing:.16em; color:var(--dim); text-transform:uppercase; }
  .stat .v { font-family:var(--mono); font-weight:700; font-size:.9rem; margin-top:2px; }

  #jogo { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); gap:14px; width:min(1080px,100%); align-items:start; }
  @media (max-width:880px){ #jogo { grid-template-columns:1fr; } }

  /* ---------- caixa ---------- */
  #tela { position:relative; line-height:0; }
  #caixa {
    width:100%; aspect-ratio:1/1.02; display:block; border-radius:var(--r);
    background:linear-gradient(180deg,#120c1e,#0a0713);
    border:1px solid var(--linha); box-shadow:inset 0 2px 24px #000a, 0 18px 40px #000a;
    cursor:pointer; touch-action:manipulation;
  }
  #caixa.cheia { border-color:var(--rosa); box-shadow:inset 0 2px 24px #000a, 0 0 26px #ff6b9d55; }
  #caixa.festa { border-color:var(--ouro); box-shadow:inset 0 2px 24px #000a, 0 0 34px #ffc85777; }
  .flutuando { position:absolute; z-index:3; display:flex; gap:6px; }
  .fSup { top:9px; left:9px; right:9px; align-items:center; flex-wrap:wrap; }
  .fInf { bottom:9px; left:9px; right:9px; align-items:flex-end; flex-wrap:wrap; pointer-events:none; }
  .pilula {
    background:#0a0713cc; border:1px solid var(--linha); border-radius:99px; color:var(--dim);
    font-family:var(--mono); font-size:.66rem; padding:5px 11px; line-height:1;
    display:flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap;
  }
  .pilula:hover { border-color:var(--ouro); color:var(--ouro); }
  .pilula.info { cursor:default; color:var(--ink); margin-left:auto; }
  .buff {
    background:#1d1530dd; border:1px solid var(--ouro); color:var(--ouro); border-radius:99px;
    font-family:var(--mono); font-size:.66rem; font-weight:700; padding:5px 10px; line-height:1;
    animation:pulsa 1.1s ease-in-out infinite;
  }
  .buff.combo { border-color:var(--rosa); color:var(--rosa); }
  @keyframes pulsa { 50% { transform:scale(1.06); } }
  .botoes { display:flex; gap:8px; margin-top:9px; }
  .grandao {
    flex:1; padding:14px; border:none; border-radius:13px; cursor:pointer;
    font-family:var(--mono); font-weight:800; font-size:.95rem; letter-spacing:.08em;
    background:linear-gradient(180deg,#ffe08a,var(--ouro)); color:#2a1c02;
    box-shadow:0 5px 0 #a8741a; transition:.08s;
  }
  .grandao:active { transform:translateY(5px); box-shadow:none; }
  .grandao.vender { background:linear-gradient(180deg,#8bf3b6,var(--verde)); box-shadow:0 5px 0 #2c7a4e; color:#052014; }
  .grandao:disabled { filter:grayscale(.75) brightness(.6); cursor:not-allowed; box-shadow:none; }

  /* ---------- painel ---------- */
  #painel {
    background:linear-gradient(180deg,#ffffff0a,#ffffff03); border:1px solid var(--linha);
    border-radius:var(--r); padding:12px; display:flex; flex-direction:column; gap:10px;
  }
  .abasTopo { display:flex; gap:5px; flex-wrap:wrap; }
  .abaT { flex:1 1 auto; min-width:64px; padding-left:2px; padding-right:2px; }
  .abaT {
    flex:1; padding:9px 4px; border-radius:10px; cursor:pointer; border:1px solid var(--linha);
    background:#ffffff08; color:var(--dim); font-family:var(--mono); font-size:.68rem; font-weight:700;
    position:relative;
  }
  .abaT.sel { background:#ffffff1a; color:var(--ink); border-color:var(--ouro); }
  .abaT .aviso { position:absolute; top:4px; right:5px; width:6px; height:6px; border-radius:50%; background:var(--verde); }
  .abas { display:flex; gap:5px; }
  .aba {
    flex:1; padding:8px; border-radius:10px; cursor:pointer; border:1px solid var(--linha);
    background:#ffffff08; color:var(--dim); font-family:var(--mono); font-size:.7rem; font-weight:700;
  }
  .aba.sel { background:var(--ouro); color:#241a02; border-color:var(--ouro); }
  .aba.cri.sel { background:var(--cristal); color:#052018; border-color:var(--cristal); }
  .familias { display:grid; grid-template-columns:repeat(9,1fr); gap:4px; }
  .fam {
    aspect-ratio:1; border-radius:9px; border:1px solid var(--linha); background:#ffffff08;
    cursor:pointer; font-size:1rem; display:grid; place-items:center; position:relative; padding:0;
  }
  .fam.sel { border-color:var(--ouro); background:#ffc85722; }
  .fam .pt { position:absolute; bottom:2px; right:3px; font-family:var(--mono); font-size:.5rem; color:var(--ouro); }
  .fam.pode::after { content:""; position:absolute; top:3px; right:3px; width:5px; height:5px; border-radius:50%; background:var(--verde); }

  .lista { display:flex; flex-direction:column; gap:6px; min-height:330px; }
  .item {
    display:grid; grid-template-columns:36px 1fr auto; gap:10px; align-items:center;
    padding:9px; border-radius:11px; cursor:pointer; text-align:left; width:100%;
    font-family:inherit; color:inherit; position:relative; overflow:hidden;
    background:linear-gradient(180deg,var(--painel2),var(--painel)); border:1px solid var(--linha);
    transition:border-color .12s, transform .08s;
  }
  .item .barra { position:absolute; left:0; bottom:0; height:2px; background:var(--ouro); opacity:.55; }
  .item.ok { border-color:#ffc85766; }
  .item.ok:hover { transform:translateY(-1px); border-color:var(--ouro); }
  .item.bloq { opacity:.4; cursor:not-allowed; }
  .item.cri.ok { border-color:#6ef0c866; }
  .item.cri .preco { color:var(--cristal); }
  .item .ic { width:36px; height:36px; border-radius:9px; display:grid; place-items:center; font-size:1.05rem; background:#ffffff0d; border:1px solid var(--linha); }
  .item .nome { font-weight:700; font-size:.85rem; }
  .item .desc { font-size:.68rem; color:var(--dim); margin-top:1px; }
  .item .preco { font-family:var(--mono); font-weight:700; font-size:.8rem; color:var(--ouro); text-align:right; }
  .item .qtd { font-family:var(--mono); font-size:.62rem; color:var(--dim); text-align:right; margin-top:2px; }

  #renascer {
    width:100%; padding:12px; border-radius:12px; cursor:pointer; text-align:left;
    font-family:inherit; color:inherit; border:1px solid #6ef0c855;
    background:linear-gradient(135deg,#0c3a32,#101a2a);
  }
  #renascer:not(.on) { opacity:.4; cursor:not-allowed; }
  #renascer b { color:var(--cristal); }
  #renascer span { display:block; font-size:.71rem; color:var(--dim); margin-top:4px; line-height:1.45; }
  #turbo {
    width:100%; padding:10px; border-radius:12px; cursor:pointer; text-align:left;
    font-family:inherit; color:inherit; border:1px solid #ffc85755;
    background:linear-gradient(135deg,#3a2a0c,#2a101a); font-size:.78rem;
  }
  #turbo b { color:var(--ouro); font-family:var(--mono); }
  #turbo span { display:block; font-size:.7rem; color:var(--dim); margin-top:3px; }

  /* ---------- conquistas / missões / stats ---------- */
  .cabecinha { font-family:var(--mono); font-size:.68rem; color:var(--dim); line-height:1.5; }
  .cabecinha b { color:var(--ouro); }
  .conqGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(126px,1fr)); gap:6px; max-height:430px; overflow-y:auto; padding-right:2px; }
  .conq {
    border:1px solid var(--linha); border-radius:11px; padding:8px; background:#ffffff08;
    display:flex; gap:7px; align-items:flex-start;
  }
  .conq.feita { border-color:#ffc85788; background:linear-gradient(180deg,#ffc8571a,#ffffff05); }
  .conq .ci { font-size:1.05rem; line-height:1; }
  .conq .cn { font-size:.72rem; font-weight:700; }
  .conq.nao .cn, .conq.nao .cd { color:#ffffff3d; }
  .conq .cd { font-size:.62rem; color:var(--dim); margin-top:2px; line-height:1.35; }

  .missao {
    border:1px solid var(--linha); border-radius:12px; padding:10px; background:linear-gradient(180deg,var(--painel2),var(--painel));
    display:flex; flex-direction:column; gap:6px;
  }
  .missao .mt { display:flex; align-items:center; gap:8px; font-size:.8rem; font-weight:700; }
  .missao .mt .mp { margin-left:auto; font-family:var(--mono); font-size:.68rem; color:var(--dim); }
  .trilho { height:7px; border-radius:99px; background:#ffffff12; overflow:hidden; }
  .trilho i { display:block; height:100%; background:linear-gradient(90deg,var(--ouro),var(--rosa)); }
  .missao .mr { font-family:var(--mono); font-size:.68rem; color:var(--verde); }
  .btMissao {
    padding:8px; border-radius:9px; border:none; cursor:pointer; font-family:var(--mono);
    font-weight:800; font-size:.74rem; background:linear-gradient(180deg,#8bf3b6,var(--verde)); color:#052014;
  }
  .btMissao:disabled { background:#ffffff10; color:#ffffff40; cursor:not-allowed; }

  /* tela de início e modos */
  .modoCard {
    width:100%; display:flex; gap:11px; align-items:flex-start; text-align:left; cursor:pointer;
    padding:12px; border-radius:13px; margin-bottom:8px; font-family:inherit; color:inherit;
    border:1px solid var(--linha); background:linear-gradient(180deg,var(--painel2),var(--painel));
    transition:border-color .12s, transform .08s;
  }
  .modoCard:hover { border-color:var(--ouro); transform:translateY(-1px); }
  .modoCard .mi { font-size:1.6rem; line-height:1; }
  .modoCard .mn { font-weight:800; font-size:.95rem; }
  .modoCard .md { font-size:.74rem; color:var(--dim); margin-top:3px; line-height:1.45; }
  .modoCard .mp { font-family:var(--mono); font-size:.66rem; color:var(--verde); margin-top:5px; }
  .modoCard .mp.novo { color:var(--dim); }
  .jogoCard { display:flex; gap:6px; align-items:stretch; margin-bottom:8px; }
  .jogoAbrir {
    flex:1; display:flex; gap:11px; align-items:flex-start; text-align:left; cursor:pointer;
    padding:11px; border-radius:13px; font-family:inherit; color:inherit; min-width:0;
    border:1px solid var(--linha); background:linear-gradient(180deg,var(--painel2),var(--painel));
    transition:border-color .12s, transform .08s;
  }
  .jogoAbrir:hover { border-color:var(--ouro); transform:translateY(-1px); }
  .jogoCard.aberto .jogoAbrir { border-color:var(--ouro); }
  .jogoBt {
    width:38px; border-radius:11px; cursor:pointer; font-size:.95rem;
    border:1px solid var(--linha); background:#ffffff08; color:var(--ink);
  }
  .jogoBt:hover { background:#ffffff18; border-color:var(--ouro); }
  .jogoBt.apagar:hover { background:#ff6b6b22; border-color:#ff6b6b; }
  .divisor {
    font-family:var(--mono); font-size:.6rem; letter-spacing:.2em; color:var(--dim);
    text-transform:uppercase; margin:14px 0 8px; display:flex; align-items:center; gap:8px;
  }
  .divisor::after { content:""; flex:1; height:1px; background:var(--linha); }
  .selo {
    font-family:var(--mono); font-size:.58rem; letter-spacing:.14em; text-transform:uppercase;
    padding:3px 8px; border-radius:99px; border:1px solid var(--linha); color:var(--dim); margin-left:auto;
  }

  /* temporadas */
  .tempTopo {
    border-radius:13px; padding:12px; border:1px solid var(--linha);
    background:linear-gradient(135deg,#ffffff10,#ffffff04); display:flex; gap:11px; align-items:center;
  }
  .tempTopo .ti { font-size:2rem; line-height:1; }
  .tempTopo .tn { font-weight:800; font-size:1rem; }
  .tempTopo .tc { font-size:.72rem; color:var(--dim); margin-top:2px; line-height:1.4; }
  .tempTopo .tp { font-family:var(--mono); font-size:.75rem; margin-top:5px; }
  .passo {
    display:grid; grid-template-columns:34px 1fr auto; gap:9px; align-items:center;
    padding:8px 9px; border-radius:10px; border:1px solid var(--linha); background:#ffffff06;
  }
  .passo.pronto { border-color:var(--verde); background:#6ee7a015; }
  .passo.pego { opacity:.5; }
  .passo .pi { font-size:1.1rem; text-align:center; }
  .passo .pn { font-size:.78rem; font-weight:700; }
  .passo .pd { font-family:var(--mono); font-size:.62rem; color:var(--dim); margin-top:1px; }
  .btPasse {
    padding:6px 10px; border-radius:8px; border:none; font-family:var(--mono); font-weight:800;
    font-size:.68rem; cursor:pointer; background:linear-gradient(180deg,#8bf3b6,var(--verde)); color:#052014;
  }
  .btPasse:disabled { background:#ffffff10; color:#ffffff40; cursor:not-allowed; }
  .calend { display:flex; flex-direction:column; gap:5px; }
  .calLinha {
    display:flex; gap:8px; align-items:center; padding:7px 9px; border-radius:9px;
    border:1px solid var(--linha); background:#ffffff06; font-size:.75rem;
  }
  .calLinha .cq { margin-left:auto; font-family:var(--mono); font-size:.64rem; color:var(--dim); }

  /* temas da caixa */
  .temaGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:7px; }
  .tema {
    border:1px solid var(--linha); border-radius:12px; padding:9px; cursor:pointer; text-align:left;
    font-family:inherit; color:inherit; background:#ffffff08; display:flex; flex-direction:column; gap:4px;
  }
  .tema .amostra { height:34px; border-radius:8px; border:1px solid var(--linha); }
  .tema .tn { font-size:.76rem; font-weight:700; }
  .tema .tc { font-family:var(--mono); font-size:.65rem; color:var(--cristal); }
  .tema.usando { border-color:var(--ouro); background:#ffc85718; }
  .tema.usando .tc { color:var(--ouro); }
  .tema.caro { opacity:.45; cursor:not-allowed; }

  .linhaStat { display:flex; gap:10px; padding:6px 2px; border-bottom:1px dashed #ffffff12; font-size:.76rem; }
  .linhaStat b { margin-left:auto; font-family:var(--mono); color:var(--ouro); font-weight:700; }

  .rodape { font-size:.71rem; color:var(--dim); text-align:center; max-width:560px; line-height:1.6; }

  /* ---------- janelas ---------- */
  #indice, #adm, #volta, #inicio { position:fixed; inset:0; z-index:60; display:none; background:#04020ae0; backdrop-filter:blur(6px); align-items:center; justify-content:center; padding:16px; }
  #indice.on, #adm.on, #volta.on, #inicio.on { display:flex; }
  #inicio { z-index:80; }
  .janela {
    width:min(680px,100%); max-height:88vh; overflow-y:auto; padding:16px; border-radius:var(--r);
    background:linear-gradient(180deg,var(--painel2),#0b0713); border:1px solid var(--ouro); box-shadow:0 30px 60px #000;
  }
  .janela h3 { margin:0 0 3px; font-family:var(--mono); font-size:.76rem; letter-spacing:.26em; color:var(--ouro); text-transform:uppercase; }
  .janela .sub { margin:0 0 12px; font-size:.73rem; color:var(--dim); }
  .paginas { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px; }
  .pag { padding:5px 9px; border-radius:8px; border:1px solid var(--linha); background:#ffffff08;
         color:var(--dim); font-family:var(--mono); font-size:.65rem; cursor:pointer; }
  .pag.sel { background:var(--ouro); color:#241a02; border-color:var(--ouro); }
  .faixa { margin-bottom:11px; }
  .faixaTop { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
  .pastilha { font-family:var(--mono); font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; padding:3px 9px; border-radius:99px; font-weight:700; }
  .faixaInfo { font-family:var(--mono); font-size:.63rem; color:var(--dim); margin-left:auto; }
  .fileira { display:grid; grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:5px; }
  .ficha { position:relative; aspect-ratio:1/1.18; border-radius:9px; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:2px; border:1px solid var(--linha); background:#ffffff08; font-size:1.25rem; }
  .ficha.nao { color:#ffffff20; }
  .ficha small { font-family:var(--mono); font-size:.5rem; color:var(--dim); }
  .ficha .qtdF { position:absolute; top:2px; right:4px; font-family:var(--mono); font-size:.46rem;
                 font-weight:700; color:var(--ouro); opacity:.9; }
  .btFechar { padding:9px 16px; border-radius:10px; cursor:pointer; font-family:var(--mono); font-weight:700;
              font-size:.75rem; color:var(--ink); background:#ffffff10; border:1px solid var(--linha); }

  /* ---------- modo adm ---------- */
  #adm { z-index:65; }
  #adm .janela { border-color:var(--azul); }
  #adm h3 { color:var(--azul); }
  .grupo { margin-bottom:12px; }
  .grupo .lab { font-family:var(--mono); font-size:.6rem; letter-spacing:.2em; color:var(--dim); text-transform:uppercase; margin-bottom:6px; }
  .btns { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .bt { padding:7px 11px; border-radius:9px; cursor:pointer; font-family:var(--mono); font-size:.74rem;
        font-weight:700; color:var(--ink); background:#ffffff10; border:1px solid var(--linha); }
  .bt:hover { background:#ffffff1e; border-color:var(--azul); }
  .bt.perigo { border-color:#ff6b6b55; color:#ff9d9d; }
  .bt.perigo:hover { background:#ff6b6b22; border-color:#ff6b6b; }
  .campo { flex:1; min-width:110px; padding:7px 10px; border-radius:9px; background:#05030b;
           border:1px solid var(--linha); color:var(--ink); font-family:var(--mono); font-size:.78rem; }
  .campo:focus { outline:none; border-color:var(--azul); }
  #admInfo { font-family:var(--mono); font-size:.7rem; color:var(--verde); background:#05030b;
             border:1px solid var(--linha); border-radius:9px; padding:9px; line-height:1.65; white-space:pre-wrap; margin-bottom:12px; }
  #admErro { color:#ff8787; font-size:.73rem; min-height:1.1em; margin-top:7px; }
  #btAdm { opacity:.3; }
  #btAdm:hover { opacity:1; }

  /* ---------- 轉盤 a roleta e 大喊 o grito ---------- */
  #roda { width:100%; max-width:340px; margin:0 auto; display:block; touch-action:manipulation; }
  #pRoleta .grandao { margin-top:2px; }
  #pRoleta .grandao:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; transform:none; }

function tr(k) {
  const v = DIC[k];
  if (!v) return k;
  let s = v[zh() ? 0 : 1];
  for (let i = 1; i < arguments.length; i++) s = s.split("%" + i).join(arguments[i]);
  return s;
}

   ========================================================================== */

  ["普通","Comum","#c8c8da"],  ["竹","Bambu","#8fd694"],   ["瓷","Porcelana","#7ac9ff"], ["玉","Jade","#6ef0c8"],
  ["絲綢","Seda","#ff9ecd"],   ["銅","Bronze","#c98a4b"],  ["銀","Prata","#dcdce8"],     ["金","Ouro","#ffcf5c"],
  ["硃砂","Vermelhão","#ff4d4d"],["蓮花","Lótus","#ffb4d8"],["燈籠","Lanterna","#ff6b4d"],["長城","Muralha","#c9a227"],
  ["麒麟","Qilin","#b47aff"],  ["鳳凰","Fênix","#ff7a3c"], ["龍","Dragão","#ff2e2e"],    ["天宮","Palácio Celeste","#8ab4ff"],
  ["玉皇","Imperador","#fff3b0"],["仙","Imortal","#7dffb8"],["永恆","Eterno","#b8c6ff"],  ["無極","Sem-Limite","#ff2e6b"],
];
const PREFIXOS = [["朱雀","Ave"],["青龍","Dragão"],["白虎","Tigre"],["玄武","Tartaruga"],["太極","Taiji"],
                  ["八卦","Bagua"],["九天","Céus"],["崑崙","Kunlun"],["蓬萊","Penglai"],["天河","Rio"],
                  ["雷","Trovão"],["風","Vento"],["山","Montanha"],["水","Água"],["火","Fogo"],
                  ["雲","Nuvem"],["雪","Neve"],["星","Estrela"],["月","Lua"],["日","Sol"]];
const NUCLEOS  = [["小","Menor"],["大","Maior"],["古","Ancestral"],["至尊","Supremo"],["太初","Primordial"]];

const RARIDADES = [];
for (let i = 0; i < 120; i++) {
  let zhN, ptN, cor;
  if (i < NOMEADAS.length) { zhN = NOMEADAS[i][0]; ptN = NOMEADAS[i][1]; cor = NOMEADAS[i][2]; }
  else {
    const g = i - NOMEADAS.length;
    const p = PREFIXOS[g % PREFIXOS.length], n = NUCLEOS[Math.floor(g / PREFIXOS.length)];
    zhN = n[0] + p[0]; ptN = p[1] + " " + n[1];   // em chinês o tamanho vem antes: 小雷, 太初雷
    cor = "hsl(" + ((g * 47) % 360) + " 85% 68%)";
  }
  RARIDADES.push({
    id: "r" + i, zh: zhN, pt: ptN, nome: dois(zhN, ptN), cor, indice: i,
    base: Math.pow(8.5, i),
    desbloqueio: i === 0 ? 0 : 200 * Math.pow(8, i - 1),
  });
}

// embaralhador com semente fixa: a ordem é sempre a mesma em qualquer computador
function baralhoFixo(arr, semente) {
  const a = arr.slice();
  let s = semente;
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* Nesta fábrica o baralho não é só embaralhado: as cinco primeiras raridades
   são a China de propósito — a mesa, os 12 animais do zodíaco e os símbolos.
   Depois disso o resto entra embaralhado, com semente própria (então o índice
   daqui é diferente do das outras fábricas, mas igual em qualquer aparelho). */
const CHINESES = [

  "🐼","☯️","🎋","🐲","🎆","🎇",                     // 絲綢 — os símbolos
];
const BARALHO = CHINESES.concat(
  baralhoFixo(LISTA_EMOJIS.filter(e => !CHINESES.includes(e)), 20260908));
const POR_RARIDADE = 6;

const TIPOS = [];
RARIDADES.forEach((r, ri) => {
  for (let i = 0; i < POR_RARIDADE; i++) {
    const e = BARALHO[(ri * POR_RARIDADE + i) % BARALHO.length];
    TIPOS.push({
      e, chave: r.id + "|" + e, raridade: r.id, rIndex: ri, cor: r.cor,
      valor: r.base * (1 + i * 0.3),
      tam: 12 + Math.min(ri, 30) * .28 + i * .2,

});

function sortearSecreto() {

  for (let i = SECRETOS.length - 1; i >= 0; i--) {      // testa do mais raro pro menos raro
    if (Math.random() < SECRETOS[i].chance * radar) return SECRETOS[i];

}
/* ---------- emoji do dia: um sorteado por dia que vale 10x ----------
   O sorteio usa a data como semente, então é o mesmo pra todo mundo. */
const MULT_DIA = 10;
let tipoDoDia = null;
function atualizarDia() {
  const d = new Date();
  const chave = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  let semente = 0;
  for (let i = 0; i < chave.length; i++) semente = (semente * 31 + chave.charCodeAt(i)) % 1e9;
  const total = Math.max(POR_RARIDADE, raridadesLiberadas().length * POR_RARIDADE);
  tipoDoDia = TIPOS[semente % total];
  const pil = el("pilulaDia");
  if (pil) pil.innerHTML = tr("doDia", tipoDoDia.e, MULT_DIA);
}
function valorDe(tipo) {
  const dia = (tipo === tipoDoDia) ? MULT_DIA : 1;
  if (tipo.secreto || tipo.temporada) {        // secretos e emojis de evento acompanham a sua melhor raridade
    const lib = raridadesLiberadas();
    return lib[lib.length - 1].base * tipo.fator * dia;
  }
  return tipo.valor * dia;
}

function gerar(familias, moeda) {
  const out = [];
  familias.forEach(f => {
    for (let t = 0; t < 10; t++) {
      const forca = Math.pow(2, t);
      out.push({
        id: f.id + t, fam: f.id, k: f.k, famNome: tr(f.k), ic: f.ic, tipo: f.tipo, moeda, soFusao: !!f.soFusao,
        nome: nomeUp(f.k, t),
        val: f.val * forca,
        txt: f.txt,
        base: moeda === "cristal" ? f.base * Math.pow(3.4, t) : f.base * Math.pow(28, t),
        qtd: 0, nivel: t,
      });
    }
  });
  return out;
}

  const d = festival(ano, qual).getTime();
  return [new Date(d - antes * DIA), new Date(d + (depois + 1) * DIA - 1000)];
};

function fmt(n) {
  if (!isFinite(n)) return "∞";
  if (n < 1000) return (Math.floor(n * 10) / 10).toString().replace(".", ",");
  const u = ["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc","Ud","Dd","Td","Qd","Qq","Sd","St","Od","Nd","Vg"];
  let i = 0, x = n;
  while (x >= 1000 && i < u.length - 1) { x /= 1000; i++; }
  if (x >= 1000) return n.toExponential(2).replace(".", ",").replace("e+", "×10^");
  return x.toFixed(1).replace(".", ",") + u[i];
}
function tempoCurto(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  if (h) return h + "h" + String(m).padStart(2, "0");
  if (m) return m + "min";
  return s + "s";
}

function janelaDaTemporada(t, agora) {
  if (t.estreia) {
    if (!primeiroDia) return null;
    const fim = primeiroDia + t.estreia * DIA;
    return (agora >= primeiroDia && agora <= fim) ? { ini: primeiroDia, fim } : null;
  }
  const ano = new Date(agora).getFullYear();
  for (const a of [ano - 1, ano, ano + 1]) {
    for (const [ini, fim] of t.janelas(a)) {
      if (agora >= ini.getTime() && agora <= fim.getTime()) return { ini: ini.getTime(), fim: fim.getTime() };
    }
  }
  return null;
}
function temporadaAtiva() {
  const agora = Date.now();
  if (temporadaForcada) {
    const t = TEMPORADAS.find(x => x.id === temporadaForcada);
    if (t) return { t, ini: agora, fim: agora + 3 * DIA, forcada: true };
  }
  for (const t of TEMPORADAS) {
    const j = janelaDaTemporada(t, agora);
    if (j) return { t, ini: j.ini, fim: j.fim };
  }
  return null;
}
function proximaTemporada() {
  const agora = Date.now();
  let melhor = null;
  for (const t of TEMPORADAS) {
    if (t.estreia) continue;
    const ano = new Date(agora).getFullYear();
    for (const a of [ano, ano + 1]) {
      for (const [ini] of t.janelas(a)) {
        const q = ini.getTime();
        if (q > agora && (!melhor || q < melhor.quando)) melhor = { t, quando: q };
      }
    }
  }
  return melhor;
}
function fichaTemporada(id) {
  const ano = new Date().getFullYear();
  let f = temporadas[id];
  const dono = TEMPORADAS.find(t => t.id === id);
  if (!f || (!dono.estreia && f.ano !== ano)) f = temporadas[id] = { ano, pontos: 0, pegos: [] };
  if (!Array.isArray(f.pegos)) f.pegos = [];
  return f;
}
function ganharPontos(n, motivo) {
  const a = temporadaAtiva(); if (!a || !n) return;
  const f = fichaTemporada(a.t.id);
  f.pontos += n;
  if (motivo === "secreto") {
    [880, 1174, 1568, 2093].forEach((x, i) => setTimeout(() => bip(x, .16), i * 90));
  }
  if (painelAtual === "temp") montarTemporada();
}
function premioDoPasse(t, nivel) {
  const d = PASSE[nivel];
  if (d.tipo === "dinheiro") return { ic:"💵", txt:"R$ " + fmt(Math.max(5000, recorde * d.mult)) };
  if (d.tipo === "cristal")  return { ic:"💠", txt:d.n + (d.n > 1 ? " cristais" : " cristal") };
  if (d.tipo === "turbo")    return { ic:"⚡", txt:"tudo x5 por 2 minutos" };
  if (d.tipo === "tema")     return { ic:"🎨", txt:"tema + skin de " + t.nome };
  return { ic: TIPOS_TEMP[t.id][d.i].e, txt:"o emoji " + TIPOS_TEMP[t.id][d.i].e + " no índice" };
}
function pegarPremio(nivel) {
  const a = temporadaAtiva(); if (!a) return;
  const f = fichaTemporada(a.t.id), d = PASSE[nivel];
  if (f.pegos.includes(nivel) || f.pontos < d.p) return;

function sprite(tipo, r, dourado) {

const GRAV = .42, QUIQUE = .32, ATRITO = .995, PAREDE = .5;
let bolas = [], fundoAberto = false;

/* ---------- GRAVIDADE QUE SEGUE O CELULAR ----------
   gx/gy é pra onde "cai". Parado, é pra baixo. Com o sensor ligado,
   vira junto com o aparelho; no computador dá pra testar com as setas. */
let gx = 0, gy = GRAV, inclinacao = false, tetoFechado = false;

function definirGravidade(ax, ay) {
  const antesX = gx, antesY = gy;
  const tam = Math.hypot(ax, ay);
  if (tam < .25) { gx = 0; gy = GRAV; }            // deitado: cai pra baixo mesmo
  else { gx = ax / tam * GRAV; gy = ay / tam * GRAV; }
  tetoFechado = true;                               // com inclinação a caixa fecha em cima
  // mexeu bastante? acorda a pilha, senão ela fica flutuando de lado
  if (Math.hypot(gx - antesX, gy - antesY) > .06)
    for (let i = 0; i < bolas.length; i++) bolas[i].acordar();
}

// de onde o emoji novo cai: sempre do lado "de cima" em relação à gravidade
function pontoDeEntrada(x) {
  if (!tetoFechado) {
    return [x === undefined ? L * (.2 + Math.random() * .6)
                            : Math.max(20, Math.min(L - 20, x + (Math.random() - .5) * 44)),
            -10 - Math.random() * 20];
  }
  const d = Math.hypot(gx, gy) || 1;
  const px = L / 2 - (gx / d) * L * .34 + (Math.random() - .5) * L * .2;
  const py = A / 2 - (gy / d) * A * .34 + (Math.random() - .5) * A * .2;
  return [Math.max(14, Math.min(L - 14, px)), Math.max(14, Math.min(A - 14, py))];
}

function ligarInclinacao() {
  const ligar = () => {
    window.addEventListener("deviceorientation", e => {
      if (!inclinacao || e.beta === null) return;
      const rad = Math.PI / 180;
      definirGravidade(Math.sin(e.gamma * rad), Math.sin(e.beta * rad));
    });
    inclinacao = true; estat.inclinou = true;
    el("btGiro").textContent = "📱 ON";
    avisar(tr("avGiroOn"));
  };
  if (inclinacao) {                                  // desligar
    inclinacao = false; tetoFechado = false; gx = 0; gy = GRAV;
    el("btGiro").textContent = "📱";
    return;
  }
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === "function") {   // iPhone pede permissão
    D.requestPermission().then(r => { if (r === "granted") ligar(); else avisar(tr("avGiroNeg")); })
                         .catch(() => avisar(tr("avGiroErro")));
  } else if (D) ligar();
  else avisar(tr("avSemSensor"));
}

// no computador: setas mudam a gravidade, pra dar pra testar
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const setas = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] };
  if (setas[e.key]) {

});

class Bola {
  constructor(x, y, tipo) {
    this.x = x; this.y = y; this.ux = x; this.uy = y;
    this.vx = (Math.random() - .5) * 3.4; this.vy = Math.random() * 1.2;
    this.tipo = tipo;
    this.dourado = !tipo.secreto && Math.random() < chanceDourado();
    if (this.dourado) estat.dourados++;
    this.valor = valorDe(tipo) * (this.dourado ? 10 : 1);
    this.r = Math.max(6, tipo.tam * encolhe());
    this.giro = (Math.random() - .5) * .25; this.ang = Math.random() * 6.28;
    this.quieto = 0; this.dormindo = false;
    this.fundindo = null; this.nascendo = 0;
    this.sprite = sprite(tipo, this.r, this.dourado);
  }
  acordar() { this.dormindo = false; this.quieto = 0; }
  passo(gIma) {
    if (this.fundindo) {                    // puxado feito ímã pro meio do grupo
      const g = this.fundindo;
      const puxao = Math.min(.5, .075 * g.vel);   // o Turbo da Fusão puxa mais forte
      this.x += (g.x - this.x) * puxao;
      this.y += (g.y - this.y) * puxao;
      this.vx = 0; this.vy = 0;
      this.ang += .28;
      return;
    }
    if (this.dormindo) return;
    this.vx += gx; this.vy += gy;
    if (gIma) this.vx += (L / 2 - this.x) * gIma;
    this.x += this.vx; this.y += this.vy;
    this.vx *= ATRITO; this.vy *= ATRITO;
    this.ang += this.giro * (Math.abs(this.vx) > .3 ? 1 : .2);

    // paredes: esquerda, direita, chão e (com inclinação) o teto
    if (this.x < this.r) {
      const b = -this.vx; this.x = this.r; this.vx = Math.abs(this.vx) * QUIQUE; this.vy *= .93;
      if (Math.abs(this.vx) < .6) this.vx = 0; plop(b, this.r);
    }
    if (this.x > L - this.r) {
      const b = this.vx; this.x = L - this.r; this.vx = -Math.abs(this.vx) * QUIQUE; this.vy *= .93;
      if (Math.abs(this.vx) < .6) this.vx = 0; plop(b, this.r);
    }
    if (tetoFechado && this.y < this.r) {
      const b = -this.vy; this.y = this.r; this.vy = Math.abs(this.vy) * QUIQUE; this.vx *= .93;
      if (Math.abs(this.vy) < .6) this.vy = 0; plop(b, this.r);
    }
    if (!fundoAberto && this.y > A - this.r) {
      const b = this.vy;
      this.y = A - this.r; this.vy = -this.vy * QUIQUE; this.vx *= .93;
      if (Math.abs(this.vy) < .6) this.vy = 0;
      plop(b, this.r);
    }
  }
}

/* A grade divide a caixa em quadrados pra só testar vizinhos.
   O quadrado tem que acompanhar o tamanho dos emojis: com a Prensa no
   máximo eles viram bolinhas de 6px e um quadrado fixo de 44px juntaria
   40 emojis por célula — aí a colisão volta a ser "todos contra todos". */
let CEL = 44;
const grade = new Map();
function ajustarGrade() {
  if (!bolas.length) return;
  let soma = 0;
  for (let i = 0; i < bolas.length; i++) soma += bolas[i].r;
  CEL = Math.max(13, (soma / bolas.length) * 2.3);
}
function colidir() {
  ajustarGrade();
  grade.clear();
  for (let i = 0; i < bolas.length; i++) {
    const b = bolas[i], k = ((b.x / CEL) | 0) * 4096 + ((b.y / CEL) | 0);
    let l = grade.get(k); if (!l) grade.set(k, l = []); l.push(i);
  }
  for (let i = 0; i < bolas.length; i++) {
    const a = bolas[i], cx = (a.x / CEL) | 0, cy = (a.y / CEL) | 0;
    for (let gx = cx - 1; gx <= cx + 1; gx++) for (let gy = cy - 1; gy <= cy + 1; gy++) {
      const l = grade.get(gx * 4096 + gy); if (!l) continue;
      for (let n = 0; n < l.length; n++) {
        const j = l[n]; if (j <= i) continue;
        const b = bolas[j];
        if (a.fundindo || b.fundindo) continue;
        if (a.dormindo && b.dormindo) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy, min = a.r + b.r;
        if (d2 > min * min || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
        const sobra = Math.max((min - d) / 2 - .25, 0) * .7;
        if (sobra > 0) { a.x -= nx * sobra; a.y -= ny * sobra; b.x += nx * sobra; b.y += ny * sobra; }
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn < 0) {
          const imp = vn * .55;
          a.vx += imp * nx; a.vy += imp * ny; b.vx -= imp * nx; b.vy -= imp * ny;
          if (vn < -1.2) { a.acordar(); b.acordar(); }
          plop(-vn * .8, (a.r + b.r) / 2);
        }
      }
    }
  }
}

let ctxAudio = null, sonsRecentes = [];
function bip(f, dur = .06, tipo = "triangle", vol = .05) {
  if (mudo) return;
  try {
    ctxAudio = ctxAudio || new (window.AudioContext || window.webkitAudioContext)();
    const t = ctxAudio.currentTime, o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
    o.type = tipo; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
    o.connect(g); g.connect(ctxAudio.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}

function plop(forca, raio) {

/* A caixa simula no máximo MAX_FISICOS emojis com física de verdade.

function fabricar(n, x) {

  for (let i = 0; i < n; i++) {

  }

  else {

/* ==========================================================================
   7b. FUSÃO AUTOMÁTICA — só no modo Fusão.
   Quando 5 emojis da mesma raridade estão soltos na caixa, eles se puxam
   feito ímã, se juntam no meio e viram 1 emoji da raridade de cima.
   ========================================================================== */
const CUSTO_FUSAO = 5;
const MAX_FUSOES_JUNTAS = 10;      // quantos grupos podem estar se juntando ao mesmo tempo
let fusoesAtivas = [], flashes = [];

function procurarFusoes() {
  if (!modoObj().fusao || fundoAberto) return;
  if (fusoesAtivas.length >= MAX_FUSOES_JUNTAS) return;
  const porRaridade = new Map();
  for (let i = 0; i < bolas.length; i++) {
    const b = bolas[i];
    if (b.fundindo || b.tipo.secreto || b.tipo.rIndex >= RARIDADES.length - 1) continue;
    if (!b.dormindo && b.quieto < Math.max(2, 10 / velFusao())) continue;   // só funde quem já pousou na pilha
    let l = porRaridade.get(b.tipo.rIndex);
    if (!l) porRaridade.set(b.tipo.rIndex, l = []);
    l.push(b);
  }
  porRaridade.forEach((lista, ri) => {
    while (lista.length >= CUSTO_FUSAO && fusoesAtivas.length < MAX_FUSOES_JUNTAS) {
      // junta a que estiver mais embaixo com as 4 vizinhas mais próximas dela
      let base = lista[0];
      for (let i = 1; i < lista.length; i++) if (lista[i].y > base.y) base = lista[i];
      lista.sort((a, b) => ((a.x - base.x) ** 2 + (a.y - base.y) ** 2) - ((b.x - base.x) ** 2 + (b.y - base.y) ** 2));
      comecarFusao(lista.splice(0, CUSTO_FUSAO), ri);
    }
  });
}
function comecarFusao(membros, ri) {
  let x = 0, y = 0;
  for (const b of membros) { x += b.x; y += b.y; }
  const g = { membros, ri, x: x / membros.length, y: y / membros.length, t: 0,
              cor: RARIDADES[ri].cor, vel: velFusao() };
  membros.forEach(b => { b.fundindo = g; b.acordar(); });
  fusoesAtivas.push(g);
  bip(330 + ri * 12, .09, "sine", .035);
}
function passoFusoes() {
  for (let i = fusoesAtivas.length - 1; i >= 0; i--) {
    const g = fusoesAtivas[i];
    g.t++;
    g.membros = g.membros.filter(b => bolas.indexOf(b) >= 0);   // vendeu no meio da fusão? deixa pra lá
    if (g.membros.length < CUSTO_FUSAO) {
      g.membros.forEach(b => b.fundindo = null);
      fusoesAtivas.splice(i, 1);
      continue;
    }
    let longe = false;
    for (const b of g.membros) if ((b.x - g.x) ** 2 + (b.y - g.y) ** 2 > 16) longe = true;
    const espera = Math.max(4, 26 / g.vel), limite = Math.max(12, 100 / g.vel);
    if ((!longe && g.t > espera) || g.t > limite) { terminarFusao(g); fusoesAtivas.splice(i, 1); }
  }
}
function terminarFusao(g) {
  const dentro = new Set(g.membros);
  bolas = bolas.filter(b => !dentro.has(b));
  const novo = TIPOS[(g.ri + 1) * POR_RARIDADE + Math.floor(Math.random() * POR_RARIDADE)];
  marcar(novo);
  const nova = new Bola(g.x, g.y, novo);
  nova.vy = -2.4 - Math.random() * 1.6; nova.vx = (Math.random() - .5) * 2;
  nova.nascendo = 1;                                    // cresce do zero na animação
  bolas.push(nova);
  estat.fusoes++;
  flashes.push({ x: g.x, y: g.y, t: 0, cor: RARIDADES[g.ri + 1].cor });
  bip(880 + Math.min(g.ri, 20) * 30, .12);
  setTimeout(() => bip(1318 + Math.min(g.ri, 20) * 30, .1), 70);
  sujo = true;
}
function cancelarFusoes() {
  fusoesAtivas.forEach(g => g.membros.forEach(b => b.fundindo = null));
  fusoesAtivas = [];
}
function desenharFlashes(ctx) {
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.t++;
    if (f.t > 34) { flashes.splice(i, 1); continue; }
    const p = f.t / 34, raio = 8 + p * 62;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1 - p;
    ctx.strokeStyle = f.cor; ctx.lineWidth = 3 * (1 - p) + .6;
    ctx.beginPath(); ctx.arc(f.x, f.y, raio, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = f.cor;
    for (let k = 0; k < 6; k++) {                        // faíscas saindo do meio
      const a = k * 1.047 + p * 2, d = raio * .8;
      ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * d, f.y + Math.sin(a) * d, 2.4 * (1 - p), 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

const CUSTO_RENASCER = 1e9;
const cristaisAGanhar = () => recorde < CUSTO_RENASCER ? 0
  : Math.max(1, Math.floor(Math.pow(recorde / CUSTO_RENASCER, .38) * 3));
function renascer() {
  const g = cristaisAGanhar(); if (!g) return;
  cristais += g; renascimentos++;
  dinheiro = 0; recorde = 0; vendidos = 0; bolas = []; deposito = 0; depositoValor = 0;
  LOJA.forEach(u => u.qtd = 0);
  combo = 0;
  avisar(tr("avRenasceu", g));
  [440, 550, 660, 880, 1100].forEach((f, i) => setTimeout(() => bip(f, .15), i * 130));
  sujo = true; salvar();
}

/* ---------- o que rendeu enquanto o jogo estava fechado ---------- */
function ganhosOffline(quando) {
  const fator = fatorOffline();
  if (!fator || !quando) return;
  const seg = Math.min((Date.now() - quando) / 1000, 8 * 3600);
  if (seg < 120) return;
  const ganho = rendaPorSegundo() * seg * fator;
  if (ganho < 1) return;
  dinheiro += ganho; estat.ganhoTotal += ganho;
  recorde = Math.max(recorde, dinheiro);
  el("voltaSub").textContent = tr("voltaSub", tempoCurto(seg * 1000));
  el("voltaInfo").textContent =
    "tempo fora....: " + tempoCurto(seg * 1000) + "\n" +
    "rendimento....: " + Math.round(fator * 100) + "% da produção\n" +
    "você ganhou...: R$ " + fmt(ganho);
  el("volta").classList.add("on");
}

    '<button class="item' + (u.moeda === "cristal" ? " cri" : "") + '" data-id="' + u.id + '">' +

function comprar(u) {
  const p = preco(u);
  if (modoLivre()) { /* no modo Livre nada custa nada */ }
  else if (u.moeda === "cristal") { if (cristais < p) return; cristais -= p; }
  else { if (dinheiro < p) return; dinheiro -= p; }
  u.qtd++; estat.ups++; bip(u.moeda === "cristal" ? 1200 : 900);
  sujo = true; atualizarLista(); salvar();
}
function atualizarLista() {
  if (painelAtual !== "loja") return;
  const moeda = moedaAtual();
  lojaDaAba().filter(u => u.fam === famAtual).forEach(u => {
    const p = preco(u), pode = moeda >= p;
    const pe = el("p-" + u.id); if (!pe) return;
    pe.textContent = (u.moeda === "cristal" ? "💠 " : "") + fmt(p);
    el("q-" + u.id).textContent = u.qtd ? "x" + u.qtd : "—";
    el("b-" + u.id).style.width = Math.min(100, moeda / p * 100) + "%";
    u.el.classList.toggle("bloq", !pode);
    u.el.classList.toggle("ok", pode);
  });
  famsDaAba().forEach(f => {
    const pt = el("pt-" + f.id); if (!pt) return;
    const meus = lojaDaAba().filter(u => u.fam === f.id);
    const total = meus.reduce((s, u) => s + u.qtd, 0);
    pt.textContent = total || "";
    const podeAlgo = meus.some(u => moeda >= preco(u));
    pt.parentElement.classList.toggle("pode", podeAlgo);
  });
  const t = el("turbo");
  t.innerHTML = tr("turbo", CUSTO_TURBO, fmt(cristais));
  t.style.opacity = cristais >= CUSTO_TURBO ? 1 : .45;
}

        (tem ? s.e : "❔") + '<small>' + (tem ? tr("umEm", fmt(Math.round(1 / s.chance))) : "???") + '</small></div>';
    }).join("") + '</div></div>';

  const faixasTemp = pagIndice !== 0 ? "" : TEMPORADAS.map(t => {
    const lista = TIPOS_TEMP[t.id].concat([t.tipoSecreto]);
    const achados = lista.filter(x => vistos.has(x.chave)).length;
    return '<div class="faixa"><div class="faixaTop">' +
      '<span class="pastilha" style="background:' + t.cor + '22;color:' + t.cor + ';border:1px solid ' + t.cor + '55">' +
      t.ic + " " + t.nome + '</span><span class="faixaInfo">' + achados + "/" + lista.length + ' · ' + t.conta + '</span></div>' +
      '<div class="fileira">' + lista.map(x => {

        return '<div class="ficha' + (tem ? "" : " nao") + '" style="' + (tem ? "border-color:" + t.cor + "88" : "") + '">' +
          (n > 1 ? '<b class="qtdF">x' + fmt(n) + '</b>' : "") + (tem ? x.e : "❔") +

      }).join("") + '</div></div>';

  const inicio = pagIndice * porPag;
  el("faixas").innerHTML = (pagIndice === 0 ? faixaSecreta + faixasTemp : "") + RARIDADES.slice(inicio, inicio + porPag).map(r => {
    const desta = TIPOS.filter(t => t.raridade === r.id);
    const achados = desta.filter(t => descobertos.includes(t.chave)).length;
    const liberada = recorde >= r.desbloqueio;
    const fichas = desta.map(t => {
      const tem = descobertos.includes(t.chave), n = contagem[t.chave] || 0;
      return '<div class="ficha' + (tem ? "" : " nao") + '" style="' + (tem ? "border-color:" + r.cor + "55" : "") + '">' +
        (n > 1 ? '<b class="qtdF">x' + fmt(n) + '</b>' : "") +
        (tem ? t.e : "❔") + '<small>' + (tem ? din(t.valor) : "???") + '</small></div>';

    return '<div class="faixa" style="' + (liberada ? "" : "opacity:.42") + '">' +

      ';border:1px solid ' + r.cor + '55">' + (r.indice + 1) + '. ' + r.nome + '</span>' +
      '<span class="faixaInfo">' + (liberada
        ? achados + "/" + desta.length + (achados === desta.length ? tr("completa") : "") + " · " + din(r.base)
        : "🔒 " + din(r.desbloqueio)) + '</span></div>' +
      '<div class="fileira">' + fichas + '</div></div>';
  }).join("");
  el("indiceSub").textContent = tr("indiceSub", descobertos.length, raridadesLiberadas().length,
    TOTAL_EMOJIS, RARIDADES.length, colecoesCompletas(), Math.round((bonusColecao() - 1) * 100));
}

const SENHA_ADM = "1234";
let admLiberado = false, segredo = "";

function abrirAdm() {
  el("adm").classList.add("on");
  el("admLogin").style.display = admLiberado ? "none" : "";
  el("admPainel").style.display = admLiberado ? "" : "none";
  el("admErro").textContent = "";
  if (!admLiberado) { el("admSenha").value = ""; el("admSenha").focus(); } else puxarAdm();
}
function fecharAdm() { el("adm").classList.remove("on"); }
function tentarSenha() {
  if (el("admSenha").value === SENHA_ADM) {
    admLiberado = true; estat.admUsado = true;
    el("admLogin").style.display = "none"; el("admPainel").style.display = "";
    bip(900); puxarAdm();
  } else { el("admErro").textContent = tr("admErrada"); el("admSenha").value = ""; bip(140); }
}
el("admEntrar").onclick = tentarSenha;
el("admSenha").addEventListener("keydown", e => { if (e.key === "Enter") tentarSenha(); });
el("btAdm").onclick = e => { e.stopPropagation(); abrirAdm(); };
el("btGiro").onclick = e => { e.stopPropagation(); ligarInclinacao(); bip(760); };
el("btModo").onclick = e => { e.stopPropagation(); abrirInicio(); };
el("btSalvar").onclick = e => { e.stopPropagation(); salvarNaMao(); };
el("adm").onclick = e => { if (e.target === el("adm")) fecharAdm(); };

document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.shiftKey && e.key.toUpperCase() === "A") { e.preventDefault(); abrirAdm(); return; }
  if (e.key === "Escape") { fecharAdm(); el("indice").classList.remove("on"); el("volta").classList.remove("on"); }
  if (e.target.tagName === "INPUT") return;
  if (el("inicio").classList.contains("on")) return;      // na tela de início o teclado não fabrica
  if (e.key === " ") { e.preventDefault(); clicar(); return; }
  if (e.key.toUpperCase() === "V") { vender(); return; }
  if (e.key.length === 1) {
    segredo = (segredo + e.key.toUpperCase()).slice(-5);
    if (segredo === "ADMIN") { segredo = ""; abrirAdm(); }
  }
});

/* ==========================================================================
   11. LOOPS
   ========================================================================== */
let contaQuadros = 0;
function quadro() {
  const gIma = forcaIma();
  for (let i = 0; i < bolas.length; i++) bolas[i].passo(gIma);
  colidir();
  if (fusoesAtivas.length) passoFusoes();
  if (contaQuadros % Math.max(3, Math.round(15 / velFusao())) === 0) procurarFusoes();

  /* A colisão empurra os emojis pra sair da sobreposição e isso pode
     espremer um pra fora da parede — inclusive os que estão dormindo,
     que não passam pela checagem lá do passo(). Aqui todo mundo volta. */
  if (!fundoAberto) {
    for (let i = 0; i < bolas.length; i++) {
      const b = bolas[i];
      if (b.x < b.r) { b.x = b.r; if (b.vx < 0) b.vx = 0; }
      else if (b.x > L - b.r) { b.x = L - b.r; if (b.vx > 0) b.vx = 0; }
      if (b.y > A - b.r) { b.y = A - b.r; if (b.vy > 0) b.vy = 0; }
      else if (tetoFechado && b.y < b.r) { b.y = b.r; if (b.vy < 0) b.vy = 0; }
    }
  }

  if (fundoAberto) {
    bolas = bolas.filter(b => b.y < A + 60);
    if (!bolas.length) terminarVenda();
  } else {
    for (let i = 0; i < bolas.length; i++) {
      const b = bolas[i];
      if (b.dormindo || b.fundindo) continue;
      const dx = b.x - b.ux, dy = b.y - b.uy;
      if (dx * dx + dy * dy < .09) { if (++b.quieto > 22) { b.dormindo = true; b.vx = 0; b.vy = 0; } }
      else b.quieto = 0;
      b.ux = b.x; b.uy = b.y;
    }
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, L, A);
  const tema = temaObj();
  if (tema.estrelas) {                      // Espaço: pontinhos parados no fundo
    ctx.fillStyle = "#ffffff26";
    for (let i = 0; i < 40; i++) {
      const ex = (i * 97 % 101) / 101 * L, ey = (i * 53 % 89) / 89 * A;
      ctx.fillRect(ex, ey, 1.6, 1.6);
    }
  }
  if (tema.arco) {                          // Arco-íris: faixas suaves atrás dos emojis
    const cores = ["#ff4d6d18","#ffc85718","#6ee7a018","#5ce1e618","#b47aff18"];
    for (let i = 0; i < cores.length; i++) { ctx.fillStyle = cores[i]; ctx.fillRect(0, A * i / 5, L, A / 5); }
  }
  ctx.fillStyle = fundoAberto ? "#ff6b9d22" : tema.chao;
  ctx.fillRect(0, A - 4, L, 4);
  for (let i = 0; i < bolas.length; i++) {
    const b = bolas[i], s = b.sprite, m = s.meio;
    let esc = 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (b.fundindo) {                            // encolhe e brilha enquanto se junta
      esc = Math.max(.28, 1 - b.fundindo.t / 130);
      ctx.shadowColor = b.fundindo.cor; ctx.shadowBlur = 10 + b.fundindo.t * .5;
    } else if (b.nascendo > 0) {                 // nasce grandão e volta ao tamanho
      esc = 1 + b.nascendo * .7;
      b.nascendo = Math.max(0, b.nascendo - .08);
      ctx.shadowColor = b.tipo.cor; ctx.shadowBlur = 18 * b.nascendo;
    }
    ctx.translate(b.x, b.y); ctx.rotate(b.ang);
    if (esc !== 1) ctx.scale(esc, esc);
    ctx.drawImage(s.cv, -m, -m, m * 2, m * 2);
    if (ctx.shadowBlur) ctx.shadowBlur = 0;
  }
  desenharFlashes(ctx);

  // a estrela de bônus fica por cima de tudo, com um anel mostrando o tempo
  if (estrela) {
    if (Date.now() > estrela.ate) estrela = null;
    else {
      const p = performance.now() / 260, pulso = 1 + Math.sin(p) * .07, r = estrela.r;
      const falta = (estrela.ate - Date.now()) / 11000;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.translate(estrela.x, estrela.y); ctx.scale(pulso, pulso);
      const g = ctx.createRadialGradient(0, 0, 2, 0, 0, r);
      g.addColorStop(0, "#fff6d0"); g.addColorStop(1, "#ff9d2e");
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#ffffff55";
      ctx.beginPath(); ctx.arc(0, 0, r + 4, -1.5708, -1.5708 + 6.2832 * falta); ctx.stroke();
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = (r * 1.05) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(estrela.tipo.ic, 0, r * .04);
    }
  }

  if (++contaQuadros % 12 === 0) {
    const total = bolas.length + deposito;
    el("contadorPilha").textContent = total
      ? total + "/" + fmt(limite()) + (deposito ? " (📦" + fmt(deposito) + ")" : "") + " · " + din(valorPilha())
      : (fundoAberto ? "…" : tr("vazia"));
    el("btVender").disabled = !total || fundoAberto;
    const vel = somaEfeito("auto");
    let txt = total ? tr("btVender") + " · " + din(valorPilha()) : tr("btVender");
    if (vel) {
      // mostra o relógio da venda automática, pra dar pra ver que ela existe
      const falta = Math.max(0, Math.ceil((segundosAuto(vel) * 1000 - (Date.now() - ultimaVendaAuto)) / 1000));
      txt = "🤝 " + falta + "s · " + txt;
    }
    el("btVender").textContent = txt;
    desenharBuffs();
  }
  requestAnimationFrame(quadro);
}

function desenharBuffs() {
  const agora = Date.now();
  buffs = buffs.filter(b => b.ate > agora);
  let html = buffs.map(b => '<div class="buff">' + b.nome + " · " + Math.ceil((b.ate - agora) / 1000) + "s</div>").join("");
  if (combo > 1 && agora - ultimoClique < 1500 && tetoCombo() > 0)
    html += '<div class="buff combo">🔥 combo ' + Math.min(combo, tetoCombo()) + " · x" + multCombo().toFixed(2) + "</div>";
  const f = el("faixaBuffs");
  if (f.innerHTML !== html) f.innerHTML = html;
}

/* ---------- venda automática ---------- */
setInterval(() => {
  const vel = somaEfeito("auto");
  if (!modoAtual || !vel || fundoAberto) return;
  const total = bolas.length + deposito;
  if (!total) { ultimaVendaAuto = Date.now(); return; }
  const cheia = total >= limite();
  const passou = Date.now() - ultimaVendaAuto > segundosAuto(vel) * 1000;
  if (cheia || passou) { vender(); ultimaVendaAuto = Date.now(); }
}, 400);

/* ---------- chuva de emojis ---------- */
setInterval(() => {
  const porSeg = porSegundoChuva();
  if (!modoAtual || !porSeg || fundoAberto) return;
  chuvaAcum += porSeg / 10;
  const lim = limite();
  let n = 0;
  while (chuvaAcum >= 1 && n < 400) {
    chuvaAcum--; n++;
    if (bolas.length + deposito >= lim) { estat.encheu = true; break; }
    nascer(sortearTipo());
    estat.feitos++;
  }
  if (chuvaAcum > 1e4) chuvaAcum = 0;
}, 100);

/* ---------- estrela de bônus, conquistas e missões ---------- */
setInterval(() => {
  if (!modoAtual) return;                 // ainda na tela de início
  estat.tempo += 500;
  atualizarDia();
  checarConquistas();
  checarMissoes();
  if (!estrela && recorde >= 3000 && Date.now() > proximaEstrela && !document.hidden) {
    nasceEstrela();
    proximaEstrela = Date.now() + 70000 + Math.random() * 90000;
  }
  if (painelAtual === "miss") {                     // barrinhas andando ao vivo
    missoes.forEach((m, i) => {
      const t = el("missLista").children[i]; if (!t) return;
      const p = Math.min(missaoProgresso(m), m.alvo);
      t.querySelector(".mp").textContent = fmt(p) + "/" + fmt(m.alvo);
      t.querySelector(".trilho i").style.width = (p / m.alvo * 100) + "%";
    });
  }
}, 500);

setInterval(() => {
  render();
  atualizarLista();

  if (combo && Date.now() - ultimoClique > 1500) combo = 0;
}, 250);

const ANTIGAS = ["fabricaChina_v4", "fabricaChina_v3", "fabricaChina_v2"];
const CHAVE_MODOS = "fabricaChina_modosJogados";
let modosJogados = [];
try { modosJogados = JSON.parse(localStorage.getItem(CHAVE_MODOS) || "[]") || []; } catch (e) {}
function marcarModoJogado(id) {
  if (modosJogados.includes(id)) return;
  modosJogados.push(id);
  try { localStorage.setItem(CHAVE_MODOS, JSON.stringify(modosJogados)); } catch (e) {}
}
function pacote() {
  return {
    v: 6, modo: modoAtual, dinheiro, recorde, vendidos, cristais, renascimentos, mudo, descobertos,
    conquistas: conquistasFeitas, missoes, nivelMissao, estat, quando: Date.now(),
    contagem, temas, temaAtual, temporadas, primeiroDia, skins, skinAtual, giros, proxGiro,
    ups: TODOS.filter(u => u.qtd).map(u => [u.id, u.qtd]),
  };
}
function salvar() {
  if (!jogoAtual) return;                    // ninguém abriu um jogo ainda: não sobrescreve nada
  try {
    localStorage.setItem(chaveDoJogo(jogoAtual.id), JSON.stringify(pacote()));
    jogoAtual.quando = Date.now();
    jogoAtual.resumo = { recorde, emojis: descobertos.length, conquistas: conquistasFeitas.length,
                         tempo: estat.tempo };

  } catch (e) {}
}
function salvarIndice() {
  try { localStorage.setItem(CHAVE_INDICE, JSON.stringify(jogos)); } catch (e) {}
}
function salvarNaMao() {
  if (!jogoAtual) return;
  salvar();
  avisar(tr("avSalvo"));
  bip(1046, .12); setTimeout(() => bip(1318, .1), 80);
}

/* Lê a lista de jogos salvos. Quem já jogava antes dos slots tinha um save
   por modo — cada um daqueles vira um jogo salvo, sem perder nada. */
function carregarIndice() {
  try { jogos = JSON.parse(localStorage.getItem(CHAVE_INDICE) || "null") || []; } catch (e) { jogos = []; }
  if (!Array.isArray(jogos)) jogos = [];
  if (jogos.length) return;
  MODOS.forEach(m => {
    const antigo = localStorage.getItem(chaveDoModo(m.id));
    if (!antigo) return;
    const id = novoIdDeJogo();
    try { localStorage.setItem(chaveDoJogo(id), antigo); } catch (e) { return; }
    jogos.push({ id, modo: m.id, nome: m.nome, quando: Date.now(), resumo: resumoDoTexto(antigo) });
  });
  if (!jogos.length) {                        // save de antes até dos modos
    for (const k of ANTIGAS) {
      const antigo = localStorage.getItem(k);
      if (!antigo) continue;
      const id = novoIdDeJogo();
      try { localStorage.setItem(chaveDoJogo(id), antigo); } catch (e) { break; }
      jogos.push({ id, modo:"normal", nome:"Meu jogo", quando: Date.now(), resumo: resumoDoTexto(antigo) });
      break;
    }
  }
  if (jogos.length) salvarIndice();
}
function resumoDoTexto(txt) {
  try { const d = JSON.parse(txt);
    return { recorde: d.recorde || 0, emojis: (d.descobertos||[]).length,
             conquistas: (d.conquistas||[]).length, tempo: (d.estat && d.estat.tempo) || 0 };
  } catch (e) { return { recorde:0, emojis:0, conquistas:0, tempo:0 }; }
}
const novoIdDeJogo = () => "j" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);

function novoJogo(modo) {
  if (jogos.length >= MAX_JOGOS) { avisar(tr("avMuitosJogos", MAX_JOGOS)); bip(180); return; }
  salvar();
  const m = MODOS.find(x => x.id === modo) || MODOS[0];
  const quantos = jogos.filter(j => j.modo === modo).length;
  const jogo = { id: novoIdDeJogo(), modo, nome: m.nome + (quantos ? " " + (quantos + 1) : ""),
                 quando: Date.now(), resumo: { recorde:0, emojis:0, conquistas:0, tempo:0 } };
  jogos.push(jogo); salvarIndice();
  entrarNoJogo(jogo, true);
}
function abrirJogo(id) {
  const j = jogos.find(x => x.id === id); if (!j) return;
  salvar();
  entrarNoJogo(j, false);
}
function apagarJogo(id) {
  const j = jogos.find(x => x.id === id); if (!j) return;
  if (!confirm(tr("perguntaApagar", j.nome))) return;
  try { localStorage.removeItem(chaveDoJogo(id)); } catch (e) {}
  jogos = jogos.filter(x => x.id !== id); salvarIndice();
  if (jogoAtual && jogoAtual.id === id) {     // apagou o que estava aberto: volta pro início
    jogoAtual = null; modoAtual = null; limparEstado(); render();
    el("inicio").classList.add("on");
  }
  avisar(tr("avApagado")); bip(200, .18);
  montarInicio();
}
function renomearJogo(id) {
  const j = jogos.find(x => x.id === id); if (!j) return;
  const n = prompt(tr("perguntaNome"), j.nome);
  if (n && n.trim()) { j.nome = n.trim().slice(0, 22); salvarIndice(); montarInicio(); }
}
function aplicar(d) {
  if (!d) return;
  dinheiro = d.dinheiro || 0; recorde = d.recorde || 0; vendidos = d.vendidos || 0;
  cristais = d.cristais || 0; renascimentos = d.renascimentos || 0; mudo = !!d.mudo;
  descobertos = Array.isArray(d.descobertos) ? d.descobertos : [];
  conquistasFeitas = Array.isArray(d.conquistas)
    ? d.conquistas.filter(id => CONQUISTAS.some(c => c.id === id))   // ignora conquistas que saíram do jogo
    : [];
  missoes = Array.isArray(d.missoes) ? d.missoes.filter(m => m && m.tipo) : [];
  nivelMissao = d.nivelMissao || 0;
  if (d.estat) for (const k in estat) if (k in d.estat) estat[k] = d.estat[k];
  contagem = (d.contagem && typeof d.contagem === "object") ? d.contagem : {};
  // save antigo não tinha contagem: quem já descobriu, começa com 1 de cada
  descobertos.forEach(c => { if (!contagem[c]) contagem[c] = 1; });
  temas = Array.isArray(d.temas) && d.temas.length ? d.temas : ["padrao"];
  if (!temas.includes("padrao")) temas.unshift("padrao");
  temaAtual = temas.includes(d.temaAtual) ? d.temaAtual : "padrao";
  skins = Array.isArray(d.skins) && d.skins.length ? d.skins : ["nenhuma"];
  if (!skins.includes("nenhuma")) skins.unshift("nenhuma");
  skinAtual = skins.includes(d.skinAtual) ? d.skinAtual : "nenhuma";
  sprites.clear();
  temporadas = (d.temporadas && typeof d.temporadas === "object") ? d.temporadas : {};
  primeiroDia = d.primeiroDia || 0;
  giros = d.giros || 0; proxGiro = d.proxGiro || 0;
  sincronizarVistos();
  TODOS.forEach(u => u.qtd = 0);
  (d.ups || []).forEach(([id, q]) => { const u = TODOS.find(x => x.id === id); if (u) u.qtd = q; });
  if (mudo) el("btSom").textContent = "🔇";
}
function carregar() {
  if (!jogoAtual) return null;
  let d = null;
  try { d = JSON.parse(localStorage.getItem(chaveDoJogo(jogoAtual.id)) || "null"); } catch (e) {}
  if (!d) return null;
  aplicar(d);
  return d;
}

        '<div class="md">' + tr("cardModo", m.nome, tempoCurto(r.tempo || 0)) + '</div></div></button>' +
      '<button class="jogoBt" data-ren="' + j.id + '" title="' + tr("ttRenomear") + '">✏️</button>' +
      '<button class="jogoBt apagar" data-del="' + j.id + '" title="' + tr("ttApagar") + '">🗑️</button></div>';
  }).join("") :
    '<div class="cabecinha">' + tr("semJogos") + '</div>';

  el("jogoLista").querySelectorAll("[data-j]").forEach(b => b.onclick = () => abrirJogo(b.dataset.j));
  el("jogoLista").querySelectorAll("[data-ren]").forEach(b => b.onclick = () => renomearJogo(b.dataset.ren));

  el("modoLista").innerHTML = MODOS.map(m =>
    '<button class="modoCard" data-m="' + m.id + '">' +
      '<div class="mi">' + m.ic + '</div>' +
      '<div style="flex:1"><div class="mn">' + m.nome + '</div>' +
      '<div class="md">' + m.desc + '</div>' +
      '<div class="mp novo">' + tr("modoSalvos", jogos.filter(j => j.modo === m.id).length || tr("nenhum")) +
        '</div></div></button>').join("");
  [...el("modoLista").children].forEach(b => b.onclick = () => novoJogo(b.dataset.m));
}
function abrirInicio() { salvar(); montarInicio(); el("inicio").classList.add("on"); }
function escolherModo(id) {                   // atalho: abre o jogo mais recente daquele modo, ou cria um
  const meu = jogos.filter(j => j.modo === id).sort((a, b) => b.quando - a.quando)[0];
  if (meu) abrirJogo(meu.id); else novoJogo(id);
}
function entrarNoJogo(jogo, novo) {
  jogoAtual = jogo;
  modoAtual = jogo.modo;
  limparEstado();
  const d = novo ? null : carregar();

  marcarModoJogado(jogo.modo);

  checarConquistas(); checarMissoes(); render(); salvar();

}
function exportarSave() {

  document.querySelectorAll("[data-i18n-a]").forEach(e => {          // texto com um número dentro
    const p = e.dataset.i18nA.split("|");

  });
  RARIDADES.forEach(r => r.nome = dois(r.zh, r.pt));
  FAMILIAS_TODAS.forEach(f => f.nome = tr(f.k));
  TODOS.forEach(u => { u.famNome = tr(u.k); u.nome = nomeUp(u.k, u.nivel); });
  CONQUISTAS.forEach(c => {
    c.nome = tr(c.kNome) + (c.romano ? " " + c.romano : "");

  BONUS.forEach(b => b.nome = tr(b.k));
  TEMPORADAS.forEach(t => { t.nome = dois(t.zh, t.pt); t.conta = tr(t.kConta); });
  TEMAS.forEach(t => { if (t.zh) t.nome = dois(t.zh, t.pt); });
  SKINS.forEach(k => { if (k.k) k.nome = tr(k.k); else if (k.zh) k.nome = dois(k.zh, k.pt); });
  MODOS.forEach(m => { m.nome = dois(m.zh, m.pt); m.desc = tr(m.kDesc); });
  el("btIdioma").textContent = zh() ? "中" : "A";
  el("rodape").innerHTML = tr("rodape", TOTAL_EMOJIS, SECRETOS.length, TODOS.length,

  /* redesenha o que já estava na tela */
  sprites.clear(); bolas.forEach(b => b.sprite = sprite(b.tipo, b.r, b.dourado));
  atualizarDia(); montarFamilias(); montarLista(); montarInicio();
  if (painelAtual === "conq") montarConquistas();
  if (painelAtual === "miss") montarMissoes();
  if (painelAtual === "stat") montarStats();
  if (painelAtual === "tema") montarTemas();
  if (painelAtual === "temp") montarTemporada();
  if (painelAtual === "roleta") { montarRoleta(); desenharRoda(); }
  if (jogoAtual) el("btModo").title = jogoAtual.nome + " (" + modoObj().nome + ")";
  sujo = true; render();
}
function trocarIdioma() {
  idioma = zh() ? "pt" : "zh";
  try { localStorage.setItem(CHAVE_IDIOMA, idioma); } catch (e) {}
  aplicarIdioma();

}

/* ==========================================================================
   🎡 幸運轉盤 — a roleta da sorte
   Um giro grátis a cada 10 minutos; os outros custam cristal. O prémio é
   sorteado com peso ANTES da animação, e a roda é girada até parar em cima
   dele — assim o que a tela mostra é sempre o que o jogo deu.
   ========================================================================== */
const GIRO_GRATIS_MIN = 10, CUSTO_GIRO = 2;
let giros = 0, proxGiro = 0, girando = false, angRoda = 0;

const PREMIOS = [
  { k:"pxDinP",    ic:"💵", cor:"#6ee7a0", peso:16, da:() => { const g = Math.max(5000, recorde * .15); ganhar(g); return tr("avDinheiro", din(g)); } },
  { k:"pxEmojis",  ic:"🏭", cor:"#7ac9ff", peso:14, da:() => tr("avPresente", fmt(fabricar(Math.max(30, Math.round(limite() * .6))))) },
  { k:"pxCris1",   ic:"💠", cor:"#6ef0c8", peso:12, da:() => { cristais += 1; return tr("avCristais", 1); } },
  { k:"pxFrenesi", ic:"🌟", cor:"#ffcf5c", peso:10, da:() => { addBuff("tudo", 7, 20, tr("buffFrenesi")); return tr("avFrenesi"); } },
  { k:"pxDinM",    ic:"💰", cor:"#ff8a3c", peso:10, da:() => { const g = Math.max(2e4, recorde * .6); ganhar(g); return tr("avDinheiro", din(g)); } },
  { k:"pxEstrela", ic:"⭐", cor:"#fff3b0", peso:9,  da:() => { nasceEstrela(); return tr("avEstrela"); } },
  { k:"pxPontos",  ic:"🎟️", cor:"#ff6b9d", peso:8,  da:() => { ganharPontos(25); return "🎟️ +25"; } },
  { k:"pxCris3",   ic:"💠", cor:"#5ce1e6", peso:7,  da:() => { cristais += 3; return tr("avCristais", 3); } },
  { k:"pxDedo",    ic:"👆", cor:"#b47aff", peso:6,  da:() => { addBuff("clique", 25, 15, tr("buffDedo")); return tr("avDedo"); } },
  { k:"pxGiros",   ic:"🎡", cor:"#ffb4d8", peso:5,  da:() => { giros += 2; return tr("avGirosMais"); } },
  { k:"pxDinG",    ic:"🏦", cor:"#ff4d4d", peso:2,  da:() => { const g = Math.max(1e5, recorde * 2.5); ganhar(g); return tr("avDinheiro", din(g)); } },
  { k:"pxJackpot", ic:"🐉", cor:"#ffcf5c", peso:1,  da:() => { const g = Math.max(1e6, recorde * 12); ganhar(g); cristais += 5;
      [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => bip(f, .18), i * 110));
      return tr("avJackpot", din(g)); } },
];
const PESO_TOTAL = PREMIOS.reduce((s, p) => s + p.peso, 0);
function ganhar(g) { dinheiro += g; estat.ganhoTotal += g; recorde = Math.max(recorde, dinheiro); }
function sortearPremio() {
  let x = Math.random() * PESO_TOTAL;
  for (let i = 0; i < PREMIOS.length; i++) { x -= PREMIOS[i].peso; if (x <= 0) return i; }
  return 0;
}
function checarGiroGratis() {
  if (!proxGiro) proxGiro = Date.now() + GIRO_GRATIS_MIN * 60000;
  else if (Date.now() >= proxGiro) {
    giros++; proxGiro = Date.now() + GIRO_GRATIS_MIN * 60000;
    if (painelAtual === "roleta") montarRoleta();
    salvar();
  }
}

const rd = el("roda"), rctx = rd.getContext("2d");
function desenharRoda() {
  const lado = Math.max(160, Math.min(340, rd.clientWidth || 300));
  const dprR = Math.min(window.devicePixelRatio || 1, 2);
  rd.width = Math.round(lado * dprR); rd.height = Math.round(lado * dprR);
  rd.style.height = lado + "px";
  rctx.setTransform(dprR, 0, 0, dprR, 0, 0);
  const c = lado / 2, raio = c - 8, passo = 6.2832 / PREMIOS.length;
  rctx.clearRect(0, 0, lado, lado);
  rctx.save(); rctx.translate(c, c); rctx.rotate(angRoda);
  PREMIOS.forEach((p, i) => {
    const a0 = i * passo - 1.5708 - passo / 2;
    rctx.beginPath(); rctx.moveTo(0, 0); rctx.arc(0, 0, raio, a0, a0 + passo); rctx.closePath();
    rctx.fillStyle = p.cor + "cc"; rctx.fill();
    rctx.strokeStyle = "#12060a"; rctx.lineWidth = 2; rctx.stroke();
    rctx.save();
    rctx.rotate(a0 + passo / 2); rctx.translate(raio * .68, 0); rctx.rotate(1.5708);
    rctx.textAlign = "center"; rctx.textBaseline = "middle";
    rctx.font = (raio * .17) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    rctx.fillStyle = "#1a0810";
    rctx.fillText(p.ic, 0, 0);
    rctx.restore();
  });
  rctx.restore();
  /* miolo e ponteiro */
  rctx.beginPath(); rctx.arc(c, c, raio * .2, 0, 6.2832);
  rctx.fillStyle = "#12060a"; rctx.fill();
  rctx.strokeStyle = "#ffcf5c"; rctx.lineWidth = 3; rctx.stroke();
  rctx.textAlign = "center"; rctx.textBaseline = "middle";
  rctx.font = (raio * .2) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  rctx.fillText("🎡", c, c + raio * .01);
  rctx.beginPath();
  rctx.moveTo(c - 11, 2); rctx.lineTo(c + 11, 2); rctx.lineTo(c, 26); rctx.closePath();
  rctx.fillStyle = "#ffcf5c"; rctx.fill();
  rctx.strokeStyle = "#12060a"; rctx.lineWidth = 2; rctx.stroke();
}
function girarRoleta() {
  if (girando) return;
  if (giros <= 0) { bip(170); avisar(tr("rolSemGiros")); return; }
  giros--; girando = true; estat.giros++;
  const i = sortearPremio();
  const passo = 6.2832 / PREMIOS.length;
  const alvo = 6.2832 * 6 + (6.2832 - i * passo);      // 6 voltas e para no prémio sorteado
  const ini = angRoda % 6.2832, dur = 4200, t0 = performance.now();
  montarRoleta();
  let ultimoTique = -1;
  (function passoAnim(agora) {
    const k = Math.min(1, (agora - t0) / dur);
    const suave = 1 - Math.pow(1 - k, 3.2);            // desacelera no fim
    angRoda = ini + (alvo - ini) * suave;
    const tique = Math.floor(angRoda / passo);
    if (tique !== ultimoTique) { ultimoTique = tique; if (k < .98) bip(1200 - k * 500, .02, "square", .02); }
    desenharRoda();
    if (k < 1) requestAnimationFrame(passoAnim);
    else {
      girando = false;
      const p = PREMIOS[i];
      const texto = p.da();
      avisar(tr("rolCaiu", tr(p.k) + " · " + texto));
      [880, 1174].forEach((f, n) => setTimeout(() => bip(f, .14), n * 90));
      checarConquistas(); montarRoleta(); atualizarLista(); render(); salvar();
    }
  })(t0);
}
function comprarGiro() {
  if (cristais < CUSTO_GIRO) { bip(170); avisar(tr("avPrecisaCris", CUSTO_GIRO)); return; }
  cristais -= CUSTO_GIRO; giros++;
  avisar(tr("rolComprou")); bip(900); montarRoleta(); salvar();
}
function montarRoleta() {
  if (painelAtual !== "roleta") return;
  const falta = Math.max(0, proxGiro - Date.now());
  el("rolTopo").innerHTML = tr("rolTopo", GIRO_GRATIS_MIN) + "<br>" + tr("rolGiros", giros) +
    " · " + (falta > 0 ? tr("rolGratisEm", tempoAte(falta)) : tr("rolGratisJa"));
  el("btGirar").textContent = girando ? tr("rolGirando") : tr("rolGirar");
  el("btGirar").disabled = girando || giros <= 0;
  el("btComprarGiro").textContent = tr("rolComprar", CUSTO_GIRO);
  el("rolInfo").innerHTML = tr("rolTotal", estat.giros) + "<br>" + tr("rolPremios") + " " +
    PREMIOS.map(p => p.ic + " " + tr(p.k)).join(" · ");
  el("gritoTopo").innerHTML = tr("gritoTopo") + "<br>" + tr("gritoPriv");
  el("btMic").textContent = micLigado ? tr("gritoDesligar") : tr("gritoLigar");
  el("gritoInfo").textContent = tr("gritoQtd", estat.gritos);
}
el("btGirar").onclick = girarRoleta;
el("btComprarGiro").onclick = comprarGiro;

/* ==========================================================================
   🎤 大喊 — o grito
   O microfone só é ligado quando o Jojo aperta o botão, e o som NÃO sai do
   aparelho: nada é enviado pra lugar nenhum e nada fica salvo. O que o jogo
   faz é medir o volume (pra sacudir a caixa) e guardar mais ou menos um
   segundo de som num pedaço de memória, só pra tocar de volta na hora,
   mais agudo — é a parte de "os emojis repetem".
   ========================================================================== */
let micLigado = false, micFluxo = null, micNo = null, micFonte = null, micSilencio = null;
let micNivel = 0, ultimoGrito = 0;
let gravando = false, gravPedacos = [], gravFaltam = 0;
const LIMIAR_GRITO = .18;                 // acima disso já conta como grito
let tremor = 0;                           // a caixa treme quando você grita

async function ligarMicrofone() {
  if (micLigado) { desligarMicrofone(); return; }
  try {
    const fluxo = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
    ctxAudio = ctxAudio || new (window.AudioContext || window.webkitAudioContext)();
    if (ctxAudio.state === "suspended") await ctxAudio.resume();
    micFluxo = fluxo;
    micFonte = ctxAudio.createMediaStreamSource(fluxo);
    micNo = ctxAudio.createScriptProcessor(2048, 1, 1);
    micNo.onaudioprocess = ouvir;
    micSilencio = ctxAudio.createGain(); micSilencio.gain.value = 0;   // o nó precisa de saída, mas muda
    micFonte.connect(micNo); micNo.connect(micSilencio); micSilencio.connect(ctxAudio.destination);
    micLigado = true;
    avisar(tr("gritoOn")); bip(880, .1);
    montarRoleta();
  } catch (e) {
    avisar(tr("gritoNao")); bip(170);
  }
}
function desligarMicrofone() {
  micLigado = false; gravando = false; micNivel = 0;
  try { if (micNo) micNo.disconnect(); if (micFonte) micFonte.disconnect(); if (micSilencio) micSilencio.disconnect(); } catch (e) {}
  try { if (micFluxo) micFluxo.getTracks().forEach(t => t.stop()); } catch (e) {}
  micNo = micFonte = micSilencio = micFluxo = null;
  el("barraMic").style.width = "0%";
  avisar(tr("gritoOff")); montarRoleta();
}
function ouvir(ev) {
  const dados = ev.inputBuffer.getChannelData(0);
  let soma = 0;
  for (let i = 0; i < dados.length; i++) soma += dados[i] * dados[i];
  const nivel = Math.sqrt(soma / dados.length);
  micNivel = micNivel * .7 + nivel * .3;                 // suaviza pra barra não piscar
  if (gravando) {
    gravPedacos.push(new Float32Array(dados));
    gravFaltam -= dados.length;
    if (gravFaltam <= 0) { gravando = false; tocarEco(); }
  } else if (micNivel > LIMIAR_GRITO && Date.now() - ultimoGrito > 1800 && !fundoAberto) {
    ultimoGrito = Date.now();
    gritar(Math.min(1, micNivel / .55));
  }
}
function gritar(forca) {
  estat.gritos++;
  tremor = 14 + forca * 16;
  for (const b of bolas) {                                // todo mundo pula
    b.acordar();
    b.vx += (Math.random() - .5) * 16 * forca;
    b.vy -= (4 + Math.random() * 12) * forca;
  }
  const q = fabricar(Math.round(4 + forca * 26));
  avisar(tr("gritoAviso", fmt(q)));
  bip(320 + forca * 300, .09, "sawtooth", .04);
  /* e agora grava um pedacinho pra devolver o grito */
  gravPedacos = []; gravFaltam = Math.round(ctxAudio.sampleRate * 1.1); gravando = true;
  checarConquistas(); montarRoleta(); sujo = true;
}
function tocarEco() {
  try {
    let total = 0;
    for (const p of gravPedacos) total += p.length;
    if (!total) return;
    const buf = ctxAudio.createBuffer(1, total, ctxAudio.sampleRate);
    const canal = buf.getChannelData(0);
    let n = 0;
    for (const p of gravPedacos) { canal.set(p, n); n += p.length; }
    gravPedacos = [];
    const fonte = ctxAudio.createBufferSource();
    fonte.buffer = buf;
    fonte.playbackRate.value = 1.55;                      // vozinha de esquilo
    const g = ctxAudio.createGain(); g.gain.value = mudo ? 0 : 1.7;
    fonte.connect(g); g.connect(ctxAudio.destination);
    fonte.start();
    avisar(tr("gritoEco"));
    /* os emojis "cantam junto" enquanto o eco toca */
    let voltas = 0;
    const balanco = setInterval(() => {
      for (const b of bolas) { b.acordar(); b.vy -= 1.4; b.vx += (Math.random() - .5) * 3; }
      tremor = Math.max(tremor, 6);
      sujo = true;
      if (++voltas > 6) clearInterval(balanco);
    }, 110);
  } catch (e) {}
}
el("btMic").onclick = ligarMicrofone;
el("btGritar").onclick = e => { e.stopPropagation(); mostrarPainel("roleta"); ligarMicrofone(); };

/* a barrinha do volume e o relógio do giro grátis */
setInterval(() => {
  checarGiroGratis();
  if (painelAtual !== "roleta") return;
  el("barraMic").style.width = Math.min(100, micNivel * 380) + "%";
  const falta = Math.max(0, proxGiro - Date.now());
  el("rolTopo").innerHTML = tr("rolTopo", GIRO_GRATIS_MIN) + "<br>" + tr("rolGiros", giros) +
    " · " + (falta > 0 ? tr("rolGratisEm", tempoAte(falta)) : tr("rolGratisJa"));
  el("btGirar").disabled = girando || giros <= 0;
}, 500);
window.addEventListener("resize", () => { if (painelAtual === "roleta") desenharRoda(); });

/* ---------- começo: a tela de início escolhe o modo, e o modo carrega o save ---------- */
ajustar();
aplicarTema();
carregarIndice();
sortearMissoes();
montarFamilias(); montarLista();
atualizarDia();
render();
montarInicio();
aplicarIdioma();
quadro();
</script>
