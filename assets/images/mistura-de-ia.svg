<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a3e"/>
      <stop offset="0.5" stop-color="#2d1b5e"/>
      <stop offset="1" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="arcoiris" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b9d"/>
      <stop offset="0.25" stop-color="#ffd43b"/>
      <stop offset="0.5" stop-color="#69db7c"/>
      <stop offset="0.75" stop-color="#4dabf7"/>
      <stop offset="1" stop-color="#da77f2"/>
    </linearGradient>
    <radialGradient id="brilho">
      <stop offset="0" stop-color="#ffd43b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd43b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#fundo)"/>

  <!-- estrelinhas do fundo -->
  <g fill="#fff">
    <circle cx="52" cy="44" r="1.8" opacity="0.9"/>
    <circle cx="128" cy="92" r="1.2" opacity="0.6"/>
    <circle cx="212" cy="38" r="2" opacity="0.8"/>
    <circle cx="318" cy="70" r="1.3" opacity="0.5"/>
    <circle cx="404" cy="34" r="1.7" opacity="0.85"/>
    <circle cx="498" cy="86" r="1.2" opacity="0.6"/>
    <circle cx="576" cy="48" r="2" opacity="0.9"/>
    <circle cx="86" cy="286" r="1.5" opacity="0.7"/>
    <circle cx="556" cy="300" r="1.4" opacity="0.65"/>
    <circle cx="368" cy="318" r="1.1" opacity="0.5"/>
  </g>

  <!-- rastro de brilho atrás do robô -->
  <circle cx="320" cy="150" r="110" fill="url(#brilho)"/>

  <!-- itens caindo, com rastro -->
  <g font-size="30" text-anchor="middle">
    <text x="120" y="150" opacity="0.95">⭐</text>
    <text x="196" y="252" opacity="0.9">💻</text>
    <text x="452" y="140" opacity="0.95">⚡</text>
    <text x="524" y="240" opacity="0.9">🧠</text>
    <text x="252" y="96" opacity="0.85">👾</text>
    <text x="392" y="268" opacity="0.9">💣</text>
  </g>
  <g stroke="#4dabf7" stroke-width="2" stroke-linecap="round" opacity="0.28">
    <path d="M120 104 v22"/>
    <path d="M196 206 v22"/>
    <path d="M452 94 v22"/>
    <path d="M524 194 v22"/>
  </g>

  <!-- o robô, personagem central -->
  <text x="320" y="150" font-size="76" text-anchor="middle">🤖</text>

  <!-- título com o gradiente arco-íris do jogo -->
  <text x="320" y="228" text-anchor="middle" font-family="'Trebuchet MS',Verdana,sans-serif"
        font-size="46" font-weight="bold" fill="url(#arcoiris)" letter-spacing="1.5">Mistura de IA</text>

  <text x="320" y="262" text-anchor="middle" font-family="'Trebuchet MS',Verdana,sans-serif"
        font-size="17" font-weight="bold" fill="#b0c4ff" letter-spacing="1.2">✨ um jogo do Jojo ✨</text>

  <!-- barra do arco-íris embaixo, como no jogo -->
  <rect x="240" y="292" width="160" height="4" rx="2" fill="url(#arcoiris)" opacity="0.85"/>
</svg>
