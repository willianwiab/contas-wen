<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Jogo do Nada">
  <defs>
    <radialGradient id="vazio" cx="50%" cy="34%" r="70%">
      <stop offset="0" stop-color="#2a1a4a"/><stop offset="1" stop-color="#0a0a15"/>
    </radialGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ff4dc4"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" fill="url(#vazio)"/>

  <!-- a palavra NADA repetida ao fundo, apagadinha, como no jogo -->
  <g fill="#fafafa" opacity=".07" font-family="system-ui,sans-serif" font-weight="700" font-size="22">
    <text x="18" y="36">NADA</text><text x="196" y="58">NADA</text>
    <text x="42" y="168">NADA</text><text x="214" y="186">NADA</text>
  </g>

  <!-- a logo que vira portal -->
  <rect x="96" y="132" width="128" height="44" rx="16" fill="url(#portal)" opacity=".92"/>
  <text x="160" y="164" text-anchor="middle" font-family="system-ui,sans-serif"
        font-weight="700" font-size="26" fill="#fafafa" letter-spacing="2">JOGO</text>

  <!-- o emoji que manda não fazer nada, já com o bigode que o derruba -->
  <circle cx="160" cy="76" r="44" fill="#ffd84d"/>
  <ellipse cx="144" cy="64" rx="5" ry="7" fill="#12101c"/>
  <ellipse cx="176" cy="64" rx="5" ry="7" fill="#12101c"/>
  <path d="M160 86 q-5 -7 -16 -6 q-13 2 -16 13 q8 4 17 -1 q10 -4 15 -6
           q5 2 15 6 q9 5 17 1 q-3 -11 -16 -13 q-11 -1 -16 6 Z" fill="#12101c"/>
  <path d="M142 104 q18 8 36 0" fill="none" stroke="#12101c" stroke-width="4" stroke-linecap="round"/>
</svg>
