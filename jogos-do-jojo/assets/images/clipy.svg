<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="mesa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a3a1"/><stop offset="1" stop-color="#075e63"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f9"/><stop offset=".35" stop-color="#aebccd"/>
      <stop offset=".55" stop-color="#e3ebf4"/><stop offset=".8" stop-color="#8fa0b4"/>
      <stop offset="1" stop-color="#cfdae6"/>
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b4b8f"/><stop offset="1" stop-color="#2a7fd4"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#mesa)"/>

  <!-- a janelinha com o papel -->
  <g>
    <rect x="34" y="52" width="330" height="264" fill="#c3c7cb" stroke="#7b7f85" stroke-width="3"/>
    <rect x="37" y="55" width="324" height="24" fill="url(#titulo)"/>
    <text x="48" y="72" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fff">Documento sem título</text>
    <g fill="#c3c7cb" stroke="#7b7f85">
      <rect x="308" y="60" width="15" height="14"/><rect x="325" y="60" width="15" height="14"/><rect x="342" y="60" width="15" height="14"/>
    </g>
    <rect x="37" y="79" width="324" height="22" fill="#d8dade" stroke="#7b7f85" stroke-width="1"/>
    <g fill="#c3c7cb" stroke="#7b7f85">
      <rect x="43" y="83" width="26" height="15"/><rect x="72" y="83" width="26" height="15"/><rect x="101" y="83" width="40" height="15"/>
    </g>
    <rect x="37" y="101" width="324" height="212" fill="#fffef8"/>
    <g stroke="#e6e2d2" stroke-width="1">
      <path d="M37 128h324M37 155h324M37 182h324M37 209h324M37 236h324M37 263h324M37 290h324"/>
    </g>
    <text x="52" y="123" font-family="Georgia, serif" font-size="16" fill="#14161a">Prezado João,</text>
    <text x="52" y="177" font-family="Georgia, serif" font-size="16" fill="#14161a">Tudo bem com você?</text>
    <rect x="52" y="188" width="2" height="18" fill="#14161a"/>
  </g>

  <!-- o balão amarelo -->
  <g>
    <rect x="386" y="44" width="222" height="96" rx="14" fill="#fffbc8" stroke="#0f0f10" stroke-width="3"/>
    <path d="M416 140 l6 20 l16 -20 z" fill="#fffbc8" stroke="#0f0f10" stroke-width="3" stroke-linejoin="round"/>
    <text x="400" y="72" font-family="Segoe UI, sans-serif" font-size="14" fill="#14161a">Parece que você está</text>
    <text x="400" y="92" font-family="Segoe UI, sans-serif" font-size="14" fill="#14161a">escrevendo uma carta.</text>
    <text x="400" y="112" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#14161a">Quer ajuda?</text>
    <g fill="#c3c7cb" stroke="#0f0f10" stroke-width="2">
      <rect x="400" y="120" width="86" height="14"/><rect x="492" y="120" width="60" height="14"/>
    </g>
  </g>

  <!-- o Clipy -->
  <g transform="translate(500 232) scale(82)">
    <ellipse cx="0" cy="1.2" rx=".5" ry=".09" fill="#000" opacity=".18"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(.012 .022)" stroke="#3f4a58" stroke-width=".175"
        d="M-.55 -.75 L-.55 .55 A.55 .55 0 0 0 .55 .55 L.55 -.9 A.385 .385 0 0 0 -.195 -.9 L-.195 .3 A.2375 .2375 0 0 0 .28 .3 L.28 -.45"/>
      <path stroke="url(#metal)" stroke-width=".16"
        d="M-.55 -.75 L-.55 .55 A.55 .55 0 0 0 .55 .55 L.55 -.9 A.385 .385 0 0 0 -.195 -.9 L-.195 .3 A.2375 .2375 0 0 0 .28 .3 L.28 -.45"/>
      <path transform="translate(-.028 -.035)" stroke="#ffffffcc" stroke-width=".045"
        d="M-.55 -.75 L-.55 .55 A.55 .55 0 0 0 .55 .55 L.55 -.9 A.385 .385 0 0 0 -.195 -.9 L-.195 .3 A.2375 .2375 0 0 0 .28 .3 L.28 -.45"/>
    </g>
    <circle cx="-.31" cy="-.70" r=".21" fill="#fff" stroke="#2a3038" stroke-width=".028"/>
    <circle cx=".06" cy="-.70" r=".21" fill="#fff" stroke="#2a3038" stroke-width=".028"/>
    <circle cx="-.35" cy="-.70" r=".097" fill="#15181d"/>
    <circle cx=".02" cy="-.70" r=".097" fill="#15181d"/>
    <circle cx="-.382" cy="-.735" r=".027" fill="#ffffffdd"/>
    <circle cx="-.012" cy="-.735" r=".027" fill="#ffffffdd"/>
    <g fill="none" stroke="#2a3038" stroke-width=".062" stroke-linecap="round">
      <path d="M-.48 -1.05 Q-.31 -1.11 -.14 -1.01"/>
      <path d="M-.11 -1.01 Q.06 -1.11 .23 -1.05"/>
      <path d="M-.30 -.40 Q-.12 -.33 .06 -.40"/>
    </g>
  </g>
</svg>
