<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Quiz de Gênio: um quiz só de pegadinhas. Errou uma, volta tudo do começo!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Quiz de Gênio">
<title>Quiz de Gênio</title>
<style>
  :root { --ink:#fff; --dim:#9a9a9a; --ouro:#ffd45c; --verde:#62e6a0; --vermelho:#ff4d5e; --r:18px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:#000; color:var(--ink); overflow:hidden; font-family:"Trebuchet MS", system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; }
  [hidden] { display:none !important; }
  .tela { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; padding:max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); overflow-y:auto; }
  .caixa { width:min(560px, 100%); display:flex; flex-direction:column; align-items:center; gap:16px; margin:auto 0; }
  h1 { margin:0; font-size:clamp(2.4rem, 11vw, 3.8rem); line-height:1; text-align:center; color:var(--ouro); }
  .grandao { font-size:5rem; line-height:1; }
  .sub { margin:0; color:var(--dim); text-align:center; font-size:1.05rem; line-height:1.4; }
  .sub b { color:var(--ink); }
  .botao { width:100%; border:0; border-radius:var(--r); padding:18px; font-size:1.4rem; font-weight:900; background:var(--verde); color:#06301b; box-shadow:0 6px 0 #2a9a5f; transition:transform .08s; }
  .botao:active { transform:translateY(4px); box-shadow:0 2px 0 #2a9a5f; }
  .numero { border:0; background:none; padding:0; font-family:inherit; cursor:pointer; position:fixed; top:max(12px, env(safe-area-inset-top)); left:16px; font-size:2rem; font-weight:900; color:var(--ouro); z-index:2; }
  .recorde { position:fixed; top:max(18px, env(safe-area-inset-top)); right:16px; font-size:.95rem; font-weight:700; color:var(--dim); z-index:2; }
  .pergunta { width:100%; text-align:center; font-size:clamp(1.35rem, 5.5vw, 1.8rem); font-weight:800; line-height:1.3; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .pergunta .tema { font-size:2.6rem; }
  .respostas { width:100%; display:grid; grid-template-columns:1fr; gap:10px; }
  @media (min-width:560px) { .respostas { grid-template-columns:1fr 1fr; } }
  .resp { border:2px solid #333; background:#111; border-radius:16px; padding:16px 12px; font-size:1.15rem; font-weight:700; min-height:60px; transition:transform .08s; }
  .numero.acertou { color:var(--verde); transform:scale(1.6); transition:transform .2s; }
  .escondido { position:fixed; z-index:3; border:0; background:none; padding:4px; font-size:15px; opacity:.55; transform:translate(-50%, -50%); }
  .achou { color:var(--verde) !important; opacity:1 !important; display:inline-block; transform:scale(1.4); transition:transform .2s; }
  .escondido.achou { transform:translate(-50%, -50%) scale(3); }
  .resp:active { transform:scale(.97); }
  .resp:disabled { cursor:default; }
  .resp.certa { background:var(--verde); color:#06301b; border-color:var(--verde); }
  .resp.errada { background:var(--vermelho); color:#fff; border-color:var(--vermelho); animation:treme .35s; }
  @keyframes treme { 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }
  .jegue { font-size:clamp(2.4rem, 12vw, 4rem); font-weight:900; color:var(--vermelho); text-align:center; line-height:1.05; animation:entra .4s; }
  .genio { color:var(--ouro); }
  @keyframes entra { from { transform:scale(.3) rotate(-10deg); opacity:0; } }
  .rodape { font-size:.8rem; color:#555; text-align:center; }
</style>
</head>
<body>

<section class="tela" id="inicio">
  <div class="caixa">
    <div class="grandao">🧠</div>
    <h1>Quiz de Gênio</h1>
    <p class="sub">Só tem <b>pegadinha</b>. Pense diferente!<br>Errou uma, volta tudo do começo! 😈</p>
    <button class="botao" id="comecar">▶ Começar</button>
    <p class="sub" id="recordeInicio"></p>
    <p class="rodape">Ideia do Jojo, feito com o Claude 🧠</p>
  </div>
</section>

<section class="tela" id="jogo" hidden>
  <button class="numero" id="numero">1</button>
  <div class="caixa">
    <div class="pergunta" id="pergunta"></div>
    <div class="respostas" id="respostas"></div>
  </div>
</section>

<section class="tela" id="perdeu" hidden>
  <div class="caixa">
    <div class="grandao">🫏</div>
    <div class="jegue" id="jegueTxt">Você é um jegue!</div>
    <p class="sub" id="perdeuTxt"></p>
    <button class="botao" id="denovo">🔁 Começar tudo de novo</button>
  </div>
</section>

<script>
/* ============================================================
   QUIZ DE GÊNIO
   Todas as perguntas são pegadinhas, inventadas pelo Jojo e pelo Claude.
   Elas vêm sempre na mesma ordem. O número no canto diz em qual
   pergunta você está. Errou uma: "Você é um jegue!" e volta tudo
   pra pergunta 1.

   Cada pergunta tem:
     t = emoji     p = pergunta
     c = resposta certa (quando a certa é um dos botões)
     e = respostas erradas
   Quando não tem c, nenhum botão está certo, e o jeito de passar é o x:
     x:'numero'    -> apertar o número lá no canto
     x:'emoji'     -> apertar o emoji da pergunta
     x:'palavra'   -> apertar a palavra w no texto da pergunta
     x:'esperar'   -> não apertar NADA por s segundos
     x:'escondido' -> achar o jeguinho 🫏 escondido na tela e apertar nele
   Pra colocar pergunta nova é só copiar uma linha e trocar.
   ============================================================ */
const PERGUNTAS = [
  /*  1 */ {t:'👆',p:'Aperte no botão que está escrito botão.',x:'palavra',w:'botão',e:['Botão','BOTÃO','B0TÃO','Bo-tão']},
  /*  2 */ {t:'🧮',p:'Quanto é 2 + 2 × 2?',c:'6',e:['8','4','12']},
  /*  3 */ {t:'🌍',p:'Qual é a massa da Terra?',c:'5,97 × 10²⁴ kg',e:['Lasanha 🍝','Pizza de calabresa','Miojo']},
  /*  4 */ {t:'🐢',p:'Qual é a resposta mais paciente?',x:'esperar',s:6,e:['Esta','Não, esta aqui','Eu!','Aperta logo!']},
  /*  5 */ {t:'🐝',p:'Aperte no inseto.',x:'emoji',e:['Formiga','Joaninha','Besouro','Borboleta']},
  /*  6 */ {t:'📅',p:'Quantos meses têm 28 dias?',c:'Todos',e:['1','2','Nenhum']},
  /*  7 */ {t:'🔍',p:'Cadê o jegue?',x:'escondido',e:['Fugiu','No pasto','Dentro de você','Em lugar nenhum']},
  /*  8 */ {t:'🌌',p:'Qual é a massa do universo?',c:'Uns 10⁵³ kg',e:['Macarrão','1 kg','Um pouquinho']},
  /*  9 */ {t:'⚖️',p:'O que pesa mais: 1 kg de pena ou 1 kg de ferro?',c:'Os dois pesam igual',e:['O ferro','A pena','Depende do vento']},
  /* 10 */ {t:'🐴',p:'Qual é a cor do cavalo branco do rei?',c:'Branco',e:['Preto','Marrom','Rosa']},
  /* 11 */ {t:'🌍',p:'Aperte na Terra.',x:'emoji',e:['Marte','Terra','Lua','Sol']},
  /* 12 */ {t:'🏃',p:'Numa corrida, você passa quem está em segundo lugar. Em que lugar você fica?',c:'Segundo',e:['Primeiro','Terceiro','Último']},
  /* 13 */ {t:'🫏',p:'Qual é a pessoa mais jegue do mundo?',x:'numero',e:['Você','O Claude 🤖','O jegue 🫏','Ninguém']},
  /* 14 */ {t:'🏁',p:'Aperte no fim desta pergunta.',x:'palavra',w:'pergunta.',e:['Fim','THE END','Acabou','Tchau']},
  /* 15 */ {t:'🎈',p:'Quanto é 1 + 1?',c:'2',e:['11','Janela 🪟','Depende']},
  /* 16 */ {t:'🙈',p:'Não aperte em nada.',x:'esperar',s:5,e:['Ok','Tá bom','Não vou apertar','Prometo']},
  /* 17 */ {t:'🚢',p:'Quantos bichos de cada tipo o Moisés levou na arca?',c:'Nenhum, quem fez a arca foi Noé',e:['1','2','7']},
  /* 18 */ {t:'🔢',p:'Qual é o maior número que tem nesta tela?',x:'numero',e:['9','12','15','17']},
  /* 19 */ {t:'🔎',p:'O jegue fugiu de novo. Ache ele!',x:'escondido',e:['Tô procurando','Achei!','Ele foi embora','Não tem jegue']},
  /* 20 */ {t:'🍇',p:'Quantas bananas tem num cacho de uva?',c:'Nenhuma',e:['12','30','Um monte']},
  /* 21 */ {t:'🧠',p:'Aperte no cérebro.',x:'emoji',e:['Cérebro','Cabeça','Neurônio','Pensamento']},
  /* 22 */ {t:'⚡',p:'Qual é a resposta mais rápida?',x:'esperar',s:8,e:['Eu!','Eu sou mais!','Rapidão','Aperta já!']},
  /* 23 */ {t:'🤔',p:'Quantas perguntas você já passou?',c:'22',e:['21','23','20']},
  /* 24 */ {t:'❓',p:'Qual é a primeira palavra desta pergunta?',x:'palavra',w:'Qual',e:['Qual','Primeira','Palavra','É']},
  /* 25 */ {t:'🏆',p:'Última! Qual é a resposta certa?',x:'palavra',w:'certa?',e:['Esta','Esta não','A outra','Nenhuma']},
];

const ORDEM = PERGUNTAS;

const $ = id => document.getElementById(id);
const limpa = w => w.toLowerCase().replace(/[.,!?]/g, '');  // "Pergunta." vale igual a "pergunta"
const embaralha = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- recorde: a pergunta mais longe que você chegou ---------- */
function lerRecorde() { try { return +localStorage.getItem('quiz-genio-recorde') || 0; } catch (e) { return 0; } }
function salvarRecorde(n) { if (n > lerRecorde()) { try { localStorage.setItem('quiz-genio-recorde', n); } catch (e) {} return true; } return false; }
function mostrarRecorde() {
  const r = lerRecorde();
  $('recordeInicio').innerHTML = r ? `🏆 Mais longe que você chegou: pergunta <b>${r}</b> de ${ORDEM.length}` : '';
}

/* ---------- sons (feitos na hora, sem arquivo) ---------- */
let audio;
function som(tipo) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const notas = { certo:[659,988], errado:[300,200,120], ganhou:[392,523,659,784,1047,1319] }[tipo];
    notas.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = tipo === 'errado' ? 'sawtooth' : 'triangle'; o.frequency.value = f;
      const t = audio.currentTime + i * (tipo === 'errado' ? .2 : .08);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + (tipo === 'errado' ? .35 : .18));
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + .4);
    });
  } catch (e) {}
}

/* ---------- jogo ---------- */
let atual = 0, travado = false;

function telas(qual) { if (qual !== 'jogo') limparTruques(); ['inicio','jogo','perdeu'].forEach(t => $(t).hidden = t !== qual); }

function comecar() { atual = 0; mostrarRecorde(); telas('jogo'); mostrarPergunta(); }

function mostrarPergunta() {
  const q = ORDEM[atual];
  travado = false;
  $('numero').textContent = atual + 1; $('numero').classList.remove('acertou');
  limparTruques();
  $('pergunta').innerHTML = '<span class="tema"></span><span></span>';
  $('pergunta').firstChild.textContent = q.t;
  // as palavras da pergunta podem ser apertadas (só vale na pegadinha de palavra)
  q.p.split(' ').forEach((w, i) => {
    const sp = document.createElement('span'); sp.className = 'palavra'; sp.textContent = (i ? ' ' : '') + w;
    sp.onclick = () => { if (q.x === 'palavra' && limpa(w) === limpa(q.w) && !travado) { sp.classList.add('achou'); responder(null, true); } };
    $('pergunta').lastChild.appendChild(sp);
  });
  if (q.x === 'esperar') esperaTimer = setTimeout(() => responder(null, true), q.s * 1000);
  if (q.x === 'escondido') {
    const j = document.createElement('button'); j.className = 'escondido'; j.textContent = '🫏';
    j.style.left = (8 + Math.random() * 80) + '%'; j.style.top = (Math.random() < .5 ? 12 + Math.random() * 6 : 88 + Math.random() * 5) + '%';
    j.onclick = () => { if (!travado) { j.classList.add('achou'); responder(null, true); } };
    document.body.appendChild(j);
  }
  $('respostas').innerHTML = '';
  embaralha(q.c == null ? q.e : [q.c, ...q.e]).forEach(txt => {
    const b = document.createElement('button'); b.className = 'resp'; b.textContent = txt;
    b.onclick = () => responder(b, txt === q.c); $('respostas').appendChild(b);
  });
  $('jogo').scrollTop = 0;
}

let esperaTimer = null;
function limparTruques() { clearTimeout(esperaTimer); document.querySelectorAll('.escondido').forEach(e => e.remove()); }

function responder(botao, certo) {
  if (travado) return; travado = true;
  clearTimeout(esperaTimer);
  document.querySelectorAll('.resp').forEach(b => b.disabled = true);
  if (certo) {
    if (botao) botao.classList.add('certa'); som('certo');
    salvarRecorde(atual + 1);
    setTimeout(() => {
      atual++;
      if (atual >= ORDEM.length) return ganhou();
      mostrarPergunta();
    }, 600);
  } else {
    botao.classList.add('errada'); som('errado');
    setTimeout(() => { limparTruques(); perdeu(); }, 700);
  }
}

function perdeu() {
  $('jegueTxt').textContent = 'Você é um jegue!';
  $('jegueTxt').classList.remove('genio');
  document.querySelector('#perdeu .grandao').textContent = '🫏';
  $('perdeuTxt').innerHTML = `Você errou a pergunta <b>${atual + 1}</b>.<br>Agora volta tudo pra pergunta 1! 😈`;
  $('denovo').textContent = '🔁 Começar tudo de novo';
  telas('perdeu');
}

function ganhou() {
  som('ganhou');
  $('jegueTxt').textContent = 'VOCÊ É UM GÊNIO!';
  $('jegueTxt').classList.add('genio');
  document.querySelector('#perdeu .grandao').textContent = '👑';
  $('perdeuTxt').innerHTML = `Passou pelas <b>${ORDEM.length}</b> pegadinhas sem errar nenhuma.<br>Isso era pra ser impossível! 🤯`;
  $('denovo').textContent = '🔁 Jogar de novo';
  telas('perdeu');
}

$('numero').onclick = () => {
  // só vale nas pegadinhas; nas outras perguntas o número não faz nada
  if (travado || ORDEM[atual].x !== 'numero') return;
  $('numero').classList.add('acertou');
  responder(null, true);
};
$('pergunta').addEventListener('click', ev => {
  // o emoji da pergunta (só vale na pegadinha do emoji)
  if (ev.target.classList.contains('tema') && ORDEM[atual].x === 'emoji' && !travado) { ev.target.classList.add('achou'); responder(null, true); }
});
$('comecar').onclick = comecar;
$('denovo').onclick = comecar;
document.addEventListener('keydown', ev => {
  if (!$('jogo').hidden) {
    const n = parseInt(ev.key, 10);
    if (n >= 1 && n <= 4) { const b = document.querySelectorAll('.resp')[n - 1]; if (b) b.click(); }
  } else if (ev.key === 'Enter') { (!$('inicio').hidden ? $('comecar') : $('denovo')).click(); }
});

mostrarRecorde();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
