  .numero { position:fixed; top:max(12px, env(safe-area-inset-top)); left:16px; font-size:2rem; font-weight:900; color:var(--ouro); z-index:2; }
  .recorde { position:fixed; top:max(18px, env(safe-area-inset-top)); right:16px; font-size:.95rem; font-weight:700; color:var(--dim); z-index:2; }
  .pergunta { width:100%; text-align:center; font-size:clamp(1.35rem, 5.5vw, 1.8rem); font-weight:800; line-height:1.3; display:flex; flex-direction:column; align-items:center; gap:8px; }

  .respostas { width:100%; display:grid; grid-template-columns:1fr; gap:10px; }
  @media (min-width:560px) { .respostas { grid-template-columns:1fr 1fr; } }
  .resp { border:2px solid #333; background:#111; border-radius:16px; padding:16px 12px; font-size:1.15rem; font-weight:700; min-height:60px; transition:transform .08s; }
  .resp:active { transform:scale(.97); }
  .resp:disabled { cursor:default; }
  .resp.certa { background:var(--verde); color:#06301b; border-color:var(--verde); }
  .resp.errada { background:var(--vermelho); color:#fff; border-color:var(--vermelho); animation:treme .35s; }
  @keyframes treme { 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }
  .jegue { font-size:clamp(2.4rem, 12vw, 4rem); font-weight:900; color:var(--vermelho); text-align:center; line-height:1.05; animation:entra .4s; }
  .genio { color:var(--ouro); }
  @keyframes entra { from { transform:scale(.3) rotate(-10deg); opacity:0; } }
  .rodape { font-size:.8rem; color:#555; text-align:center; }

   As perguntas vêm sempre na mesma ordem, da mais fácil pra mais

   Errou uma: "Você é um jegue!" e volta tudo pra pergunta 1.

     n = nível (2 muito difícil, 3 impossível)

     p = pergunta
     c = resposta certa

  {n:3,t:'🌍',p:'Qual é a velocidade da Terra andando em volta do Sol?',c:'Uns 30 km por segundo',e:['Uns 30 km por hora','Uns 300 km por segundo','Ela fica parada'],s:'São uns 107 mil km/h! A gente está viajando super rápido agora mesmo e nem sente.'},

  {n:3,t:'🫖',p:'Em que temperatura a água ferve no topo do Everest?',c:'Uns 70 °C',e:['100 °C, igual aqui','Uns 120 °C','Uns 30 °C'],s:'Lá em cima o ar aperta menos a água, então ela ferve antes. Por isso é difícil cozinhar macarrão lá!'},

// Ordem fixa: primeiro as muito difíceis, depois as impossíveis.
const ORDEM = [2, 3].flatMap(n => PERGUNTAS.filter(q => q.n === n));

const $ = id => document.getElementById(id);
const embaralha = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- recorde: a pergunta mais longe que você chegou ---------- */
function lerRecorde() { try { return +localStorage.getItem('quiz-genio-recorde') || 0; } catch (e) { return 0; } }
function salvarRecorde(n) { if (n > lerRecorde()) { try { localStorage.setItem('quiz-genio-recorde', n); } catch (e) {} return true; } return false; }
function mostrarRecorde() {
  const r = lerRecorde();
  $('recordeInicio').innerHTML = r ? `🏆 Mais longe que você chegou: pergunta <b>${r}</b> de ${ORDEM.length}` : '';
  $('recorde').textContent = r ? `🏆 ${r}` : '';
}

/* ---------- sons (feitos na hora, sem arquivo) ---------- */
let audio;
function som(tipo) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const notas = { certo:[659,988], errado:[300,200,120], ganhou:[392,523,659,784,1047,1319] }[tipo];
    notas.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = tipo === 'errado' ? 'sawtooth' : 'triangle'; o.frequency.value = f;
      const t = audio.currentTime + i * (tipo === 'errado' ? .2 : .08);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + (tipo === 'errado' ? .35 : .18));
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + .4);
    });
  } catch (e) {}
}

/* ---------- jogo ---------- */
let atual = 0, travado = false;

function telas(qual) { ['inicio','jogo','perdeu'].forEach(t => $(t).hidden = t !== qual); }

function comecar() { atual = 0; mostrarRecorde(); telas('jogo'); mostrarPergunta(); }

function mostrarPergunta() {
  const q = ORDEM[atual];
  travado = false;
  $('numero').textContent = atual + 1;
  $('pergunta').innerHTML = '<span class="tema"></span><span></span>';
  $('pergunta').firstChild.textContent = q.t;
  $('pergunta').lastChild.textContent = q.p;
  $('respostas').innerHTML = '';
  embaralha([q.c, ...q.e]).forEach(txt => {
    const b = document.createElement('button'); b.className = 'resp'; b.textContent = txt;
    b.onclick = () => responder(b, txt === q.c); $('respostas').appendChild(b);
  });
  $('jogo').scrollTop = 0;
}

function responder(botao, certo) {
  if (travado) return; travado = true;
  document.querySelectorAll('.resp').forEach(b => b.disabled = true);
  if (certo) {
    botao.classList.add('certa'); som('certo');
    salvarRecorde(atual + 1);
    setTimeout(() => {
      atual++;
      if (atual >= ORDEM.length) return ganhou();
      mostrarPergunta();
    }, 600);
  } else {
    botao.classList.add('errada'); som('errado');
    setTimeout(perdeu, 700);
  }
}

function perdeu() {
  $('jegueTxt').textContent = 'Você é um jegue!';
  $('jegueTxt').classList.remove('genio');
  document.querySelector('#perdeu .grandao').textContent = '🫏';
  $('perdeuTxt').innerHTML = `Você errou a pergunta <b>${atual + 1}</b>.<br>Agora volta tudo pra pergunta 1! 😈`;
  $('denovo').textContent = '🔁 Começar tudo de novo';
  telas('perdeu');
}

function ganhou() {
  som('ganhou');
  $('jegueTxt').textContent = 'VOCÊ É UM GÊNIO!';
  $('jegueTxt').classList.add('genio');
  document.querySelector('#perdeu .grandao').textContent = '👑';
  $('perdeuTxt').innerHTML = `Acertou as <b>${ORDEM.length}</b> perguntas sem errar nenhuma.<br>Isso era pra ser impossível! 🤯`;
  $('denovo').textContent = '🔁 Jogar de novo';
  telas('perdeu');
}

$('comecar').onclick = comecar;
$('denovo').onclick = comecar;
document.addEventListener('keydown', ev => {
  if (!$('jogo').hidden) {
    const n = parseInt(ev.key, 10);
    if (n >= 1 && n <= 4) { const b = document.querySelectorAll('.resp')[n - 1]; if (b) b.click(); }
  } else if (ev.key === 'Enter') { (!$('inicio').hidden ? $('comecar') : $('denovo')).click(); }
});

mostrarRecorde();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
