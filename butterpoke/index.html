<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ButterPoke — quanto vale a tua carta?</title>
<meta name="description" content="Digita o número da carta de Pokémon e o ButterPoke mostra quanto ela vale. Se tiver mais de uma carta com o mesmo número, ele pergunta o nome." />
<link rel="icon" type="image/svg+xml" href="icone.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#a97fd6" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="ButterPoke" />
<link rel="apple-touch-icon" href="icone.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  /* As cores são as da Butterfree: asa lilás, corpo roxo e o olho vermelhão. */
  --asa:#a97fd6; --asa-escura:#7b52ab; --creme:#faf7ff;
  --olho:#e3350d; --tinta:#2e2140; --tinta-fraca:#6f6288;
  --cartao:#ffffff; --borda:#e5daf7; --sombra:0 6px 0 #d9c9f2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Rubik',system-ui,sans-serif; color:var(--tinta);
  background:var(--creme);
  background-image:radial-gradient(circle at 12% 8%, #efe4ff 0 22%, transparent 22.5%),
                   radial-gradient(circle at 88% 72%, #e6d8fb 0 18%, transparent 18.5%);
  background-attachment:fixed;
  min-height:100vh; padding:0 16px 56px;
}
.envolve{max-width:900px;margin:0 auto}

/* ---------- topo ---------- */
header{text-align:center;padding:30px 0 18px}
.logo{
  font-family:'Baloo 2',cursive; font-size:clamp(2.4rem,9vw,3.6rem); line-height:1;
  color:var(--asa-escura); text-shadow:3px 3px 0 var(--asa);
}
.logo span{color:var(--olho);text-shadow:3px 3px 0 #fff}
/* A Butterfree desenhada, em vez do emoji — o emoji sai laranja e briga com o roxo. */
.logo .bicho{height:1.15em;vertical-align:-.22em;margin-left:.12em}
.slogan{margin-top:8px;color:var(--tinta-fraca);font-size:1rem}

/* ---------- busca ---------- */
.busca{
  background:var(--cartao); border:3px solid var(--asa); border-radius:22px;
  padding:20px; box-shadow:var(--sombra);
}
.modos{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.modos button{
  flex:1 1 140px; padding:10px 14px; border:2px solid var(--borda); background:#fff;
  border-radius:999px; font:inherit; font-weight:600; color:var(--tinta-fraca); cursor:pointer;
}
.modos button[aria-pressed="true"]{background:var(--asa);border-color:var(--asa-escura);color:var(--tinta)}
.linha-busca{display:flex;gap:10px;flex-wrap:wrap}
#campo{
  flex:1 1 200px; min-width:0; padding:16px 18px; font:inherit; font-size:1.15rem;
  border:3px solid var(--borda); border-radius:16px; background:#fcfaff; color:var(--tinta);
}
#campo:focus{outline:none;border-color:var(--asa-escura);background:#fff}
.btn{
  padding:16px 26px; border:none; border-radius:16px; font:inherit; font-weight:700;
  font-size:1.05rem; cursor:pointer; background:var(--olho); color:#fff;
  box-shadow:0 5px 0 #a8250a; transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a8250a}
.btn.secundario{background:var(--asa);color:var(--tinta);box-shadow:0 5px 0 var(--asa-escura)}
.btn.secundario:active{box-shadow:0 1px 0 var(--asa-escura)}
.dica{margin-top:12px;font-size:.88rem;color:var(--tinta-fraca)}
.idioma-linha{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;font-size:.9rem;font-weight:600}
.idioma-linha select{flex:1 1 150px;max-width:220px}
.atalhos{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.atalhos .btn{flex:1 1 150px;padding:12px 10px;font-size:.95rem}
.rotulo-filtro{display:block;font-size:.9rem;font-weight:600;margin:0 0 6px}
.mais-opcoes{
  border:2px solid var(--borda);border-radius:16px;background:#fff;
  padding:4px 14px;margin:0 0 16px;
}
.mais-opcoes summary{
  cursor:pointer;font-weight:600;padding:10px 0;color:var(--tinta-fraca);list-style:none;
}
.mais-opcoes summary::-webkit-details-marker{display:none}
.mais-opcoes summary::before{content:'▸ ';color:var(--asa-escura)}
.mais-opcoes[open] summary::before{content:'▾ '}
.mais-opcoes .escolha{margin:0 0 14px}
select.escolher{
  width:100%;max-width:340px;padding:10px 12px;font:inherit;border:2px solid var(--borda);
  border-radius:12px;background:#fff;color:var(--tinta);cursor:pointer;
}
select.escolher:focus{outline:none;border-color:var(--asa-escura)}
/* A estrela fica por cima da cartinha; por isso a opção virou caixa com
   dois botões dentro, em vez de um botão só (botão dentro de botão não vale). */
.opcao{position:relative;padding:0;overflow:hidden}
.opcao .abrir{
  display:block;width:100%;border:none;background:none;padding:10px;
  font:inherit;color:inherit;text-align:center;cursor:pointer;
}
.opcao .estrela{
  position:absolute;top:7px;right:7px;width:34px;height:34px;border:none;
  border-radius:50%;background:rgba(255,255,255,.92);cursor:pointer;
  font-size:1.05rem;line-height:1;padding:0;box-shadow:0 1px 5px rgba(0,0,0,.18);
}
.opcao .estrela:hover{background:#fff;transform:scale(1.1)}
/* O logo da coleção é deitado e cada um tem um formato; não dá pra tratar
   como carta em pé, senão estica tudo. */
.opcao.colecao img{aspect-ratio:auto;height:72px;object-fit:contain;background:transparent;padding:4px}

/* ---------- avisos ---------- */
.aviso{
  margin-top:22px;background:#fff;border:3px dashed var(--borda);border-radius:20px;
  padding:26px 20px;text-align:center;color:var(--tinta-fraca);
}
.aviso strong{display:block;color:var(--tinta);font-size:1.15rem;margin-bottom:6px}
.aviso.ruim{border-color:#f5b3a4;background:#fff6f4}
.girando{
  width:42px;height:42px;margin:0 auto 14px;border-radius:50%;
  border:6px solid var(--borda);border-top-color:var(--olho);animation:gira .8s linear infinite;
}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- pergunta do nome ---------- */
.pergunta{margin-top:26px}
.pergunta h2{font-family:'Baloo 2',cursive;font-size:1.5rem;margin-bottom:4px}
.pergunta p{color:var(--tinta-fraca);margin-bottom:14px}
#filtro{
  width:100%;padding:13px 16px;font:inherit;border:3px solid var(--borda);
  border-radius:14px;background:#fff;color:var(--tinta);margin-bottom:16px;
}
#filtro:focus{outline:none;border-color:var(--asa-escura)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.opcao{
  background:var(--cartao);border:3px solid var(--borda);border-radius:18px;padding:10px;
  cursor:pointer;text-align:center;font:inherit;color:var(--tinta);
  transition:transform .12s,border-color .12s;
}
.opcao:hover,.opcao:focus{transform:translateY(-4px);border-color:var(--asa-escura);outline:none}
.opcao img{width:100%;border-radius:10px;display:block;background:#f2eafc;aspect-ratio:245/342}
.opcao b{display:block;margin-top:8px;font-size:.98rem}
.opcao small{display:block;color:var(--tinta-fraca);font-size:.8rem;margin-top:2px}

/* ---------- carta ---------- */
.carta{
  margin-top:26px;background:var(--cartao);border:3px solid var(--asa);
  border-radius:24px;padding:22px;box-shadow:var(--sombra);
  display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;
}
/* No celular a carta vira uma coluna só. O minmax(0,...) é o que impede
   a tabela de preços de esticar a página pro lado. */
@media(max-width:640px){
  .carta{grid-template-columns:minmax(0,1fr);padding:16px;gap:16px}
  /* Foto menor no celular: quem procurou o preço não quer rolar meia tela
     de carta antes de ver o número. Dá pra reconhecer a carta assim. */
  .carta .foto{max-width:200px;margin:0 auto}
  .carta h2{font-size:1.6rem;text-align:center}
  .etiquetas{justify-content:center}
  th,td{padding:8px 3px;font-size:.85rem}
  thead th{font-size:.72rem}
  .modos button{flex:1 1 120px;padding:10px 8px;font-size:.92rem}
}
.carta .foto{width:100%;align-self:start;border-radius:14px;display:block;background:#f2eafc;aspect-ratio:245/342;object-fit:contain}
.carta h2{font-family:'Baloo 2',cursive;font-size:1.9rem;line-height:1.1}
.etiquetas{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.etiqueta{background:#f5edff;border:2px solid var(--borda);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:600}
.etiqueta.pais{background:var(--asa);border-color:var(--asa-escura);color:#fff}
.etiqueta.forte{background:var(--olho);border-color:#a8250a;color:#fff}
.de-onde{font-size:.82rem;color:var(--tinta-fraca);margin:-8px 0 16px;line-height:1.45}
.de-onde b{color:var(--tinta)}
.destaque{
  background:linear-gradient(135deg,var(--asa),#c9a8ef);border-radius:18px;
  padding:16px 18px;border:2px solid var(--asa-escura);
}
.destaque .rotulo{font-size:.82rem;font-weight:600;color:#3d2a5c;text-transform:uppercase;letter-spacing:.06em}
.destaque .preco{font-family:'Baloo 2',cursive;font-size:2.4rem;line-height:1.1;color:var(--tinta)}
.destaque .reais{font-size:1.05rem;font-weight:600;color:#3d2a5c}
.destaque .crua{
  margin-top:8px;font-size:.88rem;color:#3d2a5c;background:rgba(255,255,255,.55);
  padding:7px 11px;border-radius:10px;display:inline-block;
}
.destaque .qual{font-size:.85rem;color:#3d2a5c;margin-top:6px}
h3.titulinho{margin:22px 0 8px;font-size:1rem;color:var(--tinta-fraca);text-transform:uppercase;letter-spacing:.05em}
table{width:100%;max-width:100%;border-collapse:collapse;font-size:.92rem;table-layout:fixed}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--borda)}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--tinta-fraca);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.fonte{margin-top:10px;font-size:.82rem;color:var(--tinta-fraca)}
.fonte a{color:var(--olho)}

/* ---------- escolher versão e estado ---------- */
.escolha{margin:18px 0 0}
.escolha h3{font-size:.95rem;margin-bottom:8px;color:var(--tinta)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  border:2px solid var(--borda);background:#fff;border-radius:14px;padding:9px 14px;
  font:inherit;font-weight:600;font-size:.92rem;color:var(--tinta-fraca);cursor:pointer;
  text-align:left;line-height:1.25;transition:transform .1s;
}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--asa);border-color:var(--asa-escura);color:#fff}
.chip small{display:block;font-weight:400;font-size:.72rem;opacity:.8;margin-top:1px}
.nota{
  margin-top:10px;font-size:.84rem;color:var(--tinta-fraca);background:#f7f2ff;
  border-left:4px solid var(--asa);padding:10px 12px;border-radius:0 10px 10px 0;
}
.nota b{color:var(--tinta)}
td .sub{display:block;font-size:.74rem;color:var(--tinta-fraca);font-weight:400}
.mais{margin:16px auto 0;display:block}

/* ---------- cotação ---------- */
.cotacao{
  margin-top:24px;background:#fff;border:2px solid var(--borda);border-radius:16px;
  padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--tinta-fraca);
}
.cotacao input{width:90px;padding:8px 10px;font:inherit;border:2px solid var(--borda);border-radius:10px;color:var(--tinta)}
footer{text-align:center;margin-top:34px;color:var(--tinta-fraca);font-size:.85rem}
.escondido{display:none}
</style>
</head>
<body>
<div class="envolve">

  <header>
    <h1 class="logo">Butter<span>Poke</span><img class="bicho" src="icone.svg" alt="" /></h1>
    <p class="slogan">Digita o número da carta e eu te digo quanto ela vale.</p>
  </header>

  <section class="busca">
    <div class="modos" role="group" aria-label="Buscar por">
      <button type="button" id="modo-numero" aria-pressed="true">🔢 Pelo número</button>
      <button type="button" id="modo-nome" aria-pressed="false">🔤 Pelo nome</button>
    </div>
    <form class="linha-busca" id="formulario">
      <input id="campo" inputmode="numeric" autocomplete="off"
             placeholder="Ex: 25" aria-label="Número da carta" />
      <button class="btn" type="submit">Procurar</button>
    </form>
    <p class="dica" id="dica">
      O número fica no cantinho de baixo da carta — em <b>25/185</b>, o número é o <b>25</b>.
    </p>
    <div class="idioma-linha">
      <label for="sel-idioma">🌐 Idioma da carta:</label>
      <select id="sel-idioma" class="escolher"></select>
    </div>
    <div class="atalhos">
      <button class="btn secundario" type="button" id="btn-colecoes">📚 Ver as coleções</button>
      <button class="btn secundario" type="button" id="btn-favoritos">⭐ Meus favoritos</button>
    </div>
  </section>

  <div id="palco" aria-live="polite"></div>

  <div class="cotacao">
    <label for="cotacao">💵 Dólar hoje: R$</label>
    <input id="cotacao" type="number" step="0.01" min="0" value="5.40" />
    <span>— serve só pra dar uma ideia em reais, não é o valor oficial.</span>
  </div>

  <footer>ButterPoke · preços das APIs públicas pokemontcg.io e tcgdex.net (TCGplayer e Cardmarket)</footer>
</div>

<script>
/* ============================================================
   ButterPoke — quanto vale a carta

   A ideia: o número sozinho não identifica uma carta. Existem dezenas
   de cartas "25" (uma por coleção). Então quando a busca traz mais de
   uma, o site PERGUNTA o nome em vez de chutar a primeira.
   ============================================================ */

const API    = 'https://api.pokemontcg.io/v2/cards';
/* O site reserva fala vários idiomas — é o que permite procurar carta em
   português. O principal é só em inglês, então fora do inglês a busca vai
   direto pro reserva. */
const TCGDEX = 'https://api.tcgdex.net/v2';
const IDIOMAS = [
  { id:'en',    nome:'🇺🇸 Inglês',    codigos:['en'] },
  { id:'pt-br', nome:'🇧🇷 Português', codigos:['pt-br', 'pt'] },
  { id:'ja',    nome:'🇯🇵 Japonês',   codigos:['ja'] },
  { id:'es',    nome:'🇪🇸 Espanhol',  codigos:['es', 'es-mx'] },
  { id:'fr',    nome:'🇫🇷 Francês',   codigos:['fr'] },
  { id:'de',    nome:'🇩🇪 Alemão',    codigos:['de'] },
  { id:'it',    nome:'🇮🇹 Italiano',  codigos:['it'] },
  { id:'ko',    nome:'🇰🇷 Coreano',   codigos:['ko'] },
  { id:'zh-tw', nome:'🇹🇼 Chinês',    codigos:['zh-tw', 'zh-cn'] },
];
let idioma = 'en';        // o que a pessoa escolheu
let langBusca = 'en';     // o que esta busca está de fato usando
let avisoBusca = '';      // recado no topo da lista, quando caí pro inglês
function nomeIdioma(id){ return (IDIOMAS.find(i => i.id === id) || IDIOMAS[0]).nome; }
function soNome(id){ return nomeIdioma(id).replace(/^\S+\s/, ''); }   // sem a bandeirinha

/* O português está em "pt-br" num lugar e "pt" em outro, e não dá pra saber
   daqui qual existe. Então tento as escritas em ordem e fico na primeira
   que responder — erro numa não derruba a busca. */
async function pedirReserva(caminho, qual){
  const idi = IDIOMAS.find(i => i.id === (qual || langBusca)) || IDIOMAS[0];
  let ultimo = null;
  for(const cod of idi.codigos){
    try{ return await pedirJSON(TCGDEX + '/' + cod + caminho); }
    catch(e){ ultimo = e; }
  }
  throw ultimo || new Error('sem resposta');
}
const API_SETS = 'https://api.pokemontcg.io/v2/sets';

const palco   = document.getElementById('palco');
const campo   = document.getElementById('campo');
const dica    = document.getElementById('dica');
const btnNum  = document.getElementById('modo-numero');
const btnNome = document.getElementById('modo-nome');
const inpCota = document.getElementById('cotacao');

let modo = 'numero';
let versaoEscolhida = null;    // qual versão da carta a pessoa tem na mão
let estadoEscolhido = 'perfeita';
let limiteGrade = 60;          // quantas cartas a grade mostra por vez
let totalReal = 0;             // quantas existem, mesmo que eu não tenha trazido todas
let gradeAtual = null;         // a lista que a grade está mostrando e o que fazer no clique
let tipoFiltro = 'todos';      // Pokémon, Treinador, Energia ou tudo junto
let voltarPraLista = null;     // como voltar da carta pra lista de onde ela veio
let achadas = [];   // resultado da última busca, pra filtrar sem ir na internet de novo
let cartaAberta = null;

/* ---------- cotação do dólar, guardada no aparelho ---------- */
try{
  const salva = localStorage.getItem('butterpoke:dolar');
  if(salva) inpCota.value = salva;
}catch(e){}
inpCota.addEventListener('input', () => {
  try{ localStorage.setItem('butterpoke:dolar', inpCota.value); }catch(e){}
  if(cartaAberta) desenharCarta();   // redesenha os preços em reais
});

/* ---------- troca de modo ---------- */
function trocarModo(novo){
  modo = novo;
  btnNum.setAttribute('aria-pressed', novo === 'numero');
  btnNome.setAttribute('aria-pressed', novo === 'nome');
  if(novo === 'numero'){
    campo.placeholder = 'Ex: 25';
    campo.inputMode = 'numeric';
    dica.innerHTML = 'O número fica no cantinho de baixo da carta — em <b>25/185</b>, o número é o <b>25</b>.';
  }else{
    campo.placeholder = 'Ex: Pikachu';
    campo.inputMode = 'text';
    dica.innerHTML = 'Escreve o nome em inglês, que é como vem na API — <b>Pikachu</b>, <b>Charizard</b>, <b>Eevee</b>.';
  }
  campo.focus();
}
btnNum.onclick  = () => trocarModo('numero');
btnNome.onclick = () => trocarModo('nome');

/* ---------- a busca ---------- */
document.getElementById('formulario').addEventListener('submit', ev => {
  ev.preventDefault();
  buscar(campo.value.trim());
});

function aspas(t){ return t.replace(/"/g, ''); }

/* Quem escreve "025" e quem escreve "25" quer a mesma carta, e a API
   guarda só uma das formas. Então pergunto por todas de uma vez. */
function consultaNumero(valor){
  const formas = new Set([valor]);
  const limpo = valor.replace(/^0+/, '');
  if(limpo) formas.add(limpo);
  if(/^\d+$/.test(limpo)){ formas.add(limpo.padStart(2,'0')); formas.add(limpo.padStart(3,'0')); }
  // O OR precisa ser MAIÚSCULO: em minúsculo o buscador deles entende "or"
  // como se fosse parte do nome e devolve erro 500.
  return '(' + [...formas].map(f => 'number:"' + aspas(f) + '"').join(' OR ') + ')';
}

/* As consultas que eu mando, da mais caprichada pra mais simples. Se a
   primeira der erro eu tento a próxima — já vi a API engasgar com consulta
   elaborada e responder numa simples. */
function url(q, pag, ordenada){
  return API + '?q=' + encodeURIComponent(q) + '&pageSize=250' +
         (ordenada ? '&orderBy=-set.releaseDate' : '') + '&page=' + pag;
}

/* As consultas, da mais certeira pra mais ampla. Uma que responde vazio não
   encerra a busca: a próxima é mais aberta e pode achar. */
function tentativas(valor){
  if(modo === 'numero'){
    const q = consultaNumero(valor);
    const cru = 'number:' + valor.replace(/[^0-9A-Za-z]/g, '');
    return [
      pag => url(q, pag, true),
      pag => url(q, pag, false),
      pag => url(cru, pag, false),
    ];
  }
  /* Procurar "Imakuni" com name:"Imakuni*" não acha "Dance! Neo Imakuni?",
     porque o * só vale no fim: o nome tem que COMEÇAR com o que se digitou.
     Por isso a segunda tem estrela dos dois lados — aí o pedaço pode estar
     em qualquer lugar do nome. */
  const comeca = 'name:"' + aspas(valor) + '*"';
  const solto  = valor.replace(/[^0-9A-Za-z ]/g, '').trim();
  return [
    pag => url(comeca, pag, true),
    pag => url('name:*' + solto + '*', pag, false),
    pag => url('name:' + solto, pag, false),
  ];
}

/* A API devolve 250 cartas por página, e número popular passa disso. Pego
   as outras páginas de uma vez, até o teto: acima de mil cartas ninguém
   vai olhar mesmo, e o filtro pelo nome resolve melhor que rolar a tela. */
const MAX_PAGINAS = 4;
async function todasAsPaginas(monta, primeira, total){
  const paginas = Math.min(Math.ceil(total / 250), MAX_PAGINAS);
  if(paginas <= 1) return primeira;
  palco.innerHTML = '<div class="aviso"><div class="girando"></div>' +
    'São ' + total + ' cartas! Buscando todas…</div>';
  const resto = await Promise.all(
    Array.from({ length: paginas - 1 }, (x, i) =>
      pedirJSON(monta(i + 2)).then(d => d.data || []).catch(() => []))
  );
  return primeira.concat.apply(primeira, resto);
}

async function pedirJSON(url){
  const r = await fetch(url, { headers:{ Accept:'application/json' } });
  if(!r.ok){ const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r.json();
}

/* ---------- o site reserva ----------
   Formato diferente do principal, então eu traduzo pro mesmo formato aqui
   dentro e o resto da tela nem fica sabendo da troca. A lista de lá não
   traz preço; o preço vem quando a pessoa escolhe a carta. */
function numero(){
  for(const v of arguments) if(typeof v === 'number' && isFinite(v)) return v;
  return undefined;
}
function deTcgdex(c){
  const set = c.set || {};
  const saida = {
    id: c.id,
    name: c.name || '?',
    // lá o campo chama category, e o Pokémon vem sem acento
    supertype: c.category === 'Pokemon' ? 'Pokémon' : (c.category || ''),
    __daReserva: true, __lang: langBusca,
    hp: c.hp, types: c.types || [], artist: c.illustrator || '',
    subtypes: [c.suffix, c.stage].filter(Boolean),
    nationalPokedexNumbers: c.dexId || [],
    number: c.localId != null ? String(c.localId) : '',
    rarity: c.rarity || '',
    set: { name: set.name || '',
           printedTotal: (set.cardCount && set.cardCount.official) || null,
           releaseDate: set.releaseDate || '' },
    images: c.image ? { small: c.image + '/low.png', large: c.image + '/high.png' } : {},
  };
  const p = c.pricing || {};
  if(p.tcgplayer){
    const precos = {};
    for(const par of Object.entries(p.tcgplayer)){
      const k = par[0], v = par[1];
      if(!v || typeof v !== 'object') continue;              // pula 'unit', 'updated' e afins
      const nome = k.replace(/-([a-z])/g, (m, l) => l.toUpperCase());
      precos[nome] = { market: numero(v.marketPrice, v.market),
                       low:    numero(v.lowPrice, v.low),
                       mid:    numero(v.midPrice, v.mid),
                       high:   numero(v.highPrice, v.high) };
    }
    if(Object.keys(precos).length) saida.tcgplayer = { prices: precos };
  }
  if(p.cardmarket){
    const cm = p.cardmarket;
    saida.cardmarket = { prices:{
      trendPrice:       numero(cm.trendPrice, cm.trend),
      averageSellPrice: numero(cm.averageSellPrice, cm.avg, cm.avg30),
      lowPrice:         numero(cm.lowPrice, cm.low) } };
  }
  return saida;
}
async function buscarReserva(valor){
  const url = modo === 'numero'
    ? '/cards?localId=' + encodeURIComponent(valor.replace(/^0+/, '') || valor)
    : '/cards?name='    + encodeURIComponent(valor);
  const lista = await pedirReserva(url);
  if(!Array.isArray(lista)) throw new Error('resposta fora do esperado');
  return lista.slice(0, 500).map(c => {
    const n = deTcgdex(c);
    n.__faltaPreco = true;   // o preço vem só quando escolherem esta carta
    return n;
  });
}

async function buscar(valor, caiuProIngles){
  if(!valor){ campo.focus(); return; }
  cartaAberta = null;
  voltarPraLista = null;
  langBusca = caiuProIngles ? 'en' : idioma;
  if(!caiuProIngles) avisoBusca = '';
  palco.innerHTML = '<div class="aviso"><div class="girando"></div>Procurando a carta…</div>';

  const tropecos = [];
  let ninguemConhece = false;

  // O principal só fala inglês. Nos outros idiomas ele nem é consultado.
  const soReserva = langBusca !== 'en';

  // Três consultas no site principal, da mais caprichada pra mais simples.
  for(const monta of (soReserva ? [] : tentativas(valor))){
    try{
      const dados = await pedirJSON(monta(1));
      const primeira = dados.data || [];
      // Respondeu, mas veio vazio. A próxima consulta é mais ampla, então
      // vale tentar; só depois de todas é que o reserva entra.
      if(primeira.length === 0){ ninguemConhece = true; continue; }
      ninguemConhece = false;
      const total = dados.totalCount || primeira.length;
      return receber(await todasAsPaginas(monta, primeira, total), valor, total);
    }catch(e){
      if(e.status === 429){   // de graça e sem cadastro, tem limite por dia
        palco.innerHTML = '<div class="aviso ruim"><strong>Calma aí ⏳</strong>' +
          'O site dos preços atingiu o limite de pesquisas de hoje. Tenta de novo daqui a pouco.</div>';
        return;
      }
      tropecos.push('pokemontcg.io ' + (e.message || e));
    }
  }

  /* Chega aqui por dois motivos: o principal caiu, ou ele não conhece a
     carta. O reserva vale nos dois casos — a base dele é outra, e carta
     japonesa ou promo que não saiu em inglês costuma estar só lá. */
  try{
    const doReserva = await buscarReserva(valor);
    if(doReserva.length) return receber(doReserva, valor, doReserva.length);
    ninguemConhece = true;
  }catch(e){
    tropecos.push('tcgdex.net ' + (e.message || e));
  }

  /* Não achar no idioma escolhido não pode virar tela vazia: o catálogo em
     inglês é muito maior, e a carta quase sempre está lá. Então em vez de
     dar de ombros, procuro em inglês sozinho e aviso o que fiz. */
  if(ninguemConhece && soReserva){
    palco.innerHTML = '<div class="aviso"><div class="girando"></div>' +
      'Não achei em ' + escapar(soNome(idioma)) + '. Procurando em inglês…</div>';
    avisoBusca = 'Não achei essa carta em ' + soNome(idioma) +
      ' — tem bem menos carta cadastrada fora do inglês. Estas aqui são as <b>em inglês</b>.';
    return buscar(valor, true);
  }

  if(ninguemConhece){
    palco.innerHTML = '<div class="aviso"><strong>Não achei essa carta 😕</strong>' +
      (avisoBusca
        ? 'Procurei em ' + escapar(soNome(idioma)) + ' e também em inglês, e não achei em nenhum. '
        : 'Procurei nos dois bancos de carta e nenhum tem. ') +
      (modo === 'numero'
        ? 'Confere o número, ou tenta procurar pelo nome.'
        : 'Tenta escrever o nome em inglês, ou só um pedaço dele — ' +
          'os bancos são em inglês, e carta que só saiu no Japão às vezes não está em nenhum.') +
      '</div>';
    return;
  }

  palco.innerHTML = '<div class="aviso ruim"><strong>Os sites de preço não responderam 📡</strong>' +
    'Tentei em dois lugares diferentes e nenhum atendeu. Quase sempre é coisa passageira: ' +
    'espera uns minutinhos e aperta Procurar de novo.' +
    '<br><br><small>' + escapar(tropecos.join(' · ')) + '</small></div>';
}

function receber(cartas, valor, total){

/* A raridade vem como texto livre e muda de coleção pra coleção, então em
   vez de uma lista fechada (que ia furar na próxima coleção que sair) eu
   dou uma nota pelo que está escrito. Uncommon antes de Common, senão
   "uncommon" cai na regra de "common". */
/* A raridade vem escrita em inglês mesmo quando a carta é de outro idioma.
   Traduzir é o que dá pra fazer sem inventar nada. */
const RARIDADES = {
  'Common':'Comum', 'Uncommon':'Incomum', 'Rare':'Rara',
  'Rare Holo':'Rara holográfica', 'Rare Holo EX':'Rara holo EX',
  'Rare Holo GX':'Rara holo GX', 'Rare Holo V':'Rara holo V',
  'Rare Holo VMAX':'Rara holo VMAX', 'Rare Holo VSTAR':'Rara holo VSTAR',
  'Rare Holo LV.X':'Rara holo LV.X', 'Rare Ultra':'Ultra rara',
  'Rare Secret':'Rara secreta', 'Rare Rainbow':'Rara arco-íris',
  'Rare Shiny':'Rara brilhante', 'Rare Shining':'Rara brilhante',
  'Rare Prime':'Rara Prime', 'Rare ACE':'Rara ACE', 'Rare BREAK':'Rara BREAK',
  'Rare Prism Star':'Rara Prism Star', 'Amazing Rare':'Rara incrível',
  'Radiant Rare':'Rara radiante', 'Illustration Rare':'Rara ilustrada',
  'Special Illustration Rare':'Rara ilustrada especial',
  'Hyper Rare':'Hiper rara', 'Double Rare':'Rara dupla',
  'Ultra Rare':'Ultra rara', 'Secret Rare':'Rara secreta',
  'Shiny Rare':'Rara brilhante', 'Shiny Ultra Rare':'Ultra rara brilhante',
  'ACE SPEC Rare':'Rara ACE SPEC', 'Trainer Gallery Rare Holo':'Rara holo da galeria',
  'Classic Collection':'Coleção clássica', 'Promo':'Promo', 'LEGEND':'LEGEND',
  'None':'Sem raridade',
};
function nomeRaridade(r){ return RARIDADES[r] || r || ''; }

function nivelRaridade(c){
  const r = (c.rarity || '').toLowerCase();
  if(!r) return 0;
  if(/secret|rainbow|hyper|special illustration/.test(r)) return 9;
  if(/illustration|ultra|ace spec|shiny/.test(r))         return 8;
  if(/vmax|vstar|legend|amazing|radiant|prime|star/.test(r)) return 7;
  if(/\bex\b|\bgx\b|\bv\b|double rare/.test(r))        return 6;
  if(/holo/.test(r))     return 5;
  if(/promo/.test(r))    return 4;
  if(/rare/.test(r))     return 3;
  if(/uncommon/.test(r)) return 2;
  if(/common/.test(r))   return 1;
  return 0;
}
function numHp(c){ const n = parseInt(c.hp, 10); return isNaN(n) ? -Infinity : n; }
function numDex(c){
  const d = (c.nationalPokedexNumbers || [])[0];
  return typeof d === 'number' ? d : Infinity;
}
function valorOu(c, fim){ const v = precoDe(c); return v == null ? fim : v; }
// Subtrair não serve: Infinity - Infinity dá NaN, e comparador com NaN embaralha a lista.
function dif(x, y){ return x === y ? 0 : (x < y ? -1 : 1); }

// As duas APIs escrevem data diferente (2021/10/08 e 2021-10-08). Igualando
// a barra, as duas viram texto que já compara na ordem certa.
function dataDe(c){
  return String((c.set && c.set.releaseDate) || c.releaseDate || '').replace(/-/g, '/');
}
function precoDe(c){
  const p = precoPrincipal(c);
  return p && typeof p.valor === 'number' ? p.valor : null;
}
/* Carta sem o dado da ordem vai sempre pro fim: ela não é barata nem
   fraca, é desconhecida, e no meio da lista viraria mentira. */
function comparador(id){
  if(id === 'novas')    return (a, b) => dataDe(b).localeCompare(dataDe(a));
  if(id === 'antigas')  return (a, b) => dataDe(a).localeCompare(dataDe(b));
  if(id === 'nome')     return (a, b) => (a.name || '').localeCompare(b.name || '', 'en');
  if(id === 'numero')   return porNumero;
  if(id === 'caras')    return (a, b) => dif(valorOu(b, -Infinity), valorOu(a, -Infinity));
  if(id === 'baratas')  return (a, b) => dif(valorOu(a, Infinity), valorOu(b, Infinity));
  if(id === 'raridade') return (a, b) => dif(nivelRaridade(b), nivelRaridade(a));
  if(id === 'hp')       return (a, b) => dif(numHp(b), numHp(a));
  if(id === 'pokedex')  return (a, b) => dif(numDex(a), numDex(b));
  return () => 0;
}

/* Duas ordenações ao mesmo tempo: a principal manda, e onde ela empata
   quem decide é a de desempate. É o que faz "mais raras, e entre as da
   mesma raridade, as mais caras primeiro". */
function ordenar(lista){
  const principal = comparador(ordemAtual);
  const segunda = desempate ? comparador(desempate) : null;
  return lista.slice().sort((a, b) => principal(a, b) || (segunda ? segunda(a, b) : 0));
}

function virarFavorita(carta){
  const l = lerFavoritos();
  const i = l.findIndex(f => f.id === carta.id);
  if(i >= 0) l.splice(i, 1);
  else l.push({
    id: carta.id, name: carta.name, number: carta.number || '',
    supertype: carta.supertype || '',
    rarity: carta.rarity || '',
    subtypes: carta.subtypes || [],
    hp: carta.hp || '', types: carta.types || [], artist: carta.artist || '',

    fonte: carta.__daReserva ? 'reserva' : 'principal',

/* ---------- a grade ----------
   Serve pra três coisas: escolher a carta entre as de mesmo número,
   escolher uma coleção, e ver as cartas de uma coleção. Mudam o título e
   o que acontece no clique; o resto (filtro, paginação) é igual. */
function mostrarGrade(titulo, subtitulo, lista, aoClicar, tipo, placeholder, ordemInicial){
  gradeAtual = { lista: lista, aoClicar: aoClicar, tipo: tipo || 'carta' };
  limiteGrade = 60;

  ordemAtual = ordemInicial || 'novas';
  desempate = energiaFiltro = faixaFiltro = artistaFiltro = especialFiltro = '';

  const ehCarta = gradeAtual.tipo === 'carta';
  const temPreco = ehCarta && lista.some(c => precoDe(c) != null);

  // Ordem por preço só aparece quando há preço na mão: nos favoritos o preço
  // só chega ao abrir a carta, e oferecer ali seria mentira.
  // Uma ordem só é oferecida se as cartas da lista tiverem o dado dela.
  const tem = {
    preco: temPreco,
    raridade: ehCarta && lista.some(c => nivelRaridade(c) > 0),
    hp: ehCarta && lista.some(c => numHp(c) > -Infinity),
    dex: ehCarta && lista.some(c => numDex(c) < Infinity),
  };
  const ordens = ORDENS.filter(o =>
    (o.onde === 'ambos' || ehCarta) && (o.precisa ? tem[o.precisa] : true));
  const escolherOrdem =
    '<div class="escolha" style="margin:0 0 14px"><h3>Ordenar por</h3>' +
      chips('chips-ordem', ordens.map(o => ({ v:o.id, rotulo:o.nome })), ordemAtual) +
    '</div>';

  // As energias e os artistas que existem nesta lista, nada além disso.
  const energias = ENERGIAS.filter(e => lista.some(c => (c.types || []).indexOf(e.id) >= 0));
  const artistas = [];
  lista.forEach(c => { if(c.artist && artistas.indexOf(c.artist) < 0) artistas.push(c.artist); });
  artistas.sort((a, b) => a.localeCompare(b, 'en'));

  const caixinha = (rotulo, corpo) => '<div class="escolha"><h3>' + rotulo + '</h3>' + corpo + '</div>';
  const opcoesSelect = (itens, ativo) => itens.map(i =>
    '<option value="' + escapar(i.v) + '"' + (i.v === ativo ? ' selected' : '') + '>' +
      escapar(i.rotulo) + '</option>').join('');

  const extras = ehCarta ? (
    (energias.length > 1
      ? caixinha('Tipo de energia', chips('chips-energia',
          [{ v:'', rotulo:'Todos' }]
            .concat(energias.map(e => ({ v:e.id, rotulo:e.nome })))
            // Carta de dois tipos é rara, e procurando por um tipo só ela
            // se perde no meio das outras. Ganha botão próprio.
            .concat(lista.some(c => (c.types || []).length > 1)
              ? [{ v:'duplo', rotulo:'🔀 Dois tipos' }] : []), ''))
      : '') +
    caixinha('Carta especial', chips('chips-especial',
      [{ v:'', rotulo:'Todas' }]
        .concat(ESPECIAIS.filter(x => lista.some(c => especiaisDe(c).indexOf(x) >= 0))
          .map(x => ({ v:x, rotulo:rotuloEspecial(x) })))
        // As que ainda não saíram vão no fim, e aparecem mesmo sem carta.
        .concat(FUTUROS.map(f => ({ v:f.id, rotulo:f.nome }))), '')) +
    (temPreco
      ? caixinha('Preço', chips('chips-faixa', FAIXAS.map(f => ({ v:f.id, rotulo:f.nome })), ''))
      : '') +
    (artistas.length > 1
      ? caixinha('Quem desenhou',
          '<select id="sel-artista" class="escolher">' +
            opcoesSelect([{ v:'', rotulo:'Qualquer artista' }].concat(
              artistas.map(a => ({ v:a, rotulo:a }))), '') + '</select>')
      : '') +
    (ordens.length > 1
      ? caixinha('Empatou? Desempata por',
          '<select id="sel-desempate" class="escolher">' +
            opcoesSelect([{ v:'', rotulo:'Deixa como está' }].concat(
              ordens.map(o => ({ v:o.id, rotulo:o.nome }))), '') + '</select>')
      : '')
  ) : '';
  const maisOpcoes = extras
    ? '<details class="mais-opcoes"><summary>⚙️ Mais opções</summary>' + extras + '</details>'
    : '';

  // Cada botãozinho só aparece se a lista tiver do que ele filtra. Sem
  // carta jumbo na lista, não existe botão de jumbo pra clicar à toa.
  const presentes = FILTROS.filter(f => f.id === 'todos' || lista.some(f.testa));
  const escolherTipo = (ehCarta && presentes.length > 2)
    ? '<div class="escolha" style="margin:0 0 14px"><h3>Mostrar só</h3>' +
        chips('chips-tipo', presentes.map(f => ({ v:f.id, rotulo:f.nome })), 'todos') +
      '</div>'
    : '';

  palco.innerHTML =
    '<section class="pergunta">' +
      '<h2>' + titulo + '</h2>' +
      '<p>' + subtitulo + '</p>' +
      (avisoBusca ? '<p class="nota" style="margin:0 0 14px">🌐 ' + avisoBusca + '</p>' : '') +
      '<label class="rotulo-filtro" for="filtro">🔎 ' +
        (ehCarta ? 'Procurar pelo nome da carta' : 'Procurar coleção') + '</label>' +
      '<input id="filtro" autocomplete="off" placeholder="' + escapar(placeholder) + '" ' +
        'aria-label="Procurar pelo nome" />' +
      escolherTipo + escolherOrdem + maisOpcoes +
      '<div class="grade" id="grade"></div>' +
    '</section>';

  const filtro = document.getElementById('filtro');
  const atualizar = () => {
    limiteGrade = 60;
    desenharOpcoes(ordenar(filtrar(lista, filtro.value)));
  };
  const marcar = (id, valor) => document.querySelectorAll('#' + id + ' .chip').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.v === valor));

  ligarChips('chips-tipo',    v => { tipoFiltro = v; },    () => { atualizar(); marcar('chips-tipo', tipoFiltro); });
  ligarChips('chips-ordem',   v => { ordemAtual = v; },    () => { atualizar(); marcar('chips-ordem', ordemAtual); });
  ligarChips('chips-energia', v => { energiaFiltro = v; }, () => { atualizar(); marcar('chips-energia', energiaFiltro); });
  ligarChips('chips-faixa',   v => { faixaFiltro = v; },   () => { atualizar(); marcar('chips-faixa', faixaFiltro); });
  ligarChips('chips-especial', v => { especialFiltro = v; }, () => { atualizar(); marcar('chips-especial', especialFiltro); });
  const selArt = document.getElementById('sel-artista');
  if(selArt) selArt.onchange = () => { artistaFiltro = selArt.value; atualizar(); };
  const selDes = document.getElementById('sel-desempate');
  if(selDes) selDes.onchange = () => { desempate = selDes.value; atualizar(); };

  atualizar();
  filtro.addEventListener('input', atualizar);
  // Se a busca deixou só uma, Enter abre ela direto.
  filtro.addEventListener('keydown', ev => {
    if(ev.key !== 'Enter') return;
    ev.preventDefault();
    const sobraram = filtrar(lista, filtro.value);
    if(sobraram.length === 1) aoClicar(sobraram[0]);
  });
  filtro.focus();
  palco.scrollIntoView({ behavior:'smooth', block:'start' });
}

function filtrar(lista, texto){
  const t = texto.trim().toLowerCase();
  const f = FILTROS.find(x => x.id === tipoFiltro) || FILTROS[0];
  const min = (FAIXAS.find(x => x.id === faixaFiltro) || FAIXAS[0]).min;
  let saida = lista;
  if(tipoFiltro !== 'todos') saida = saida.filter(f.testa);
  if(energiaFiltro === 'duplo') saida = saida.filter(c => (c.types || []).length > 1);
  else if(energiaFiltro) saida = saida.filter(c => (c.types || []).indexOf(energiaFiltro) >= 0);
  if(artistaFiltro) saida = saida.filter(c => c.artist === artistaFiltro);
  if(especialFiltro){
    const fut = FUTUROS.find(f => f.id === especialFiltro);
    saida = fut ? saida.filter(c => casaComFuturo(c, fut))
                : saida.filter(c => (c.subtypes || []).indexOf(especialFiltro) >= 0);
  }
  // Acima de um valor: carta sem preço não entra, porque não dá pra afirmar que passa.
  if(min > 0) saida = saida.filter(c => { const v = precoDe(c); return v != null && v >= min; });
  if(t) saida = saida.filter(c => (c.name || '').toLowerCase().includes(t));
  return saida;
}

function perguntarNome(valor, lista){
  voltarPraLista = () => perguntarNome(valor, lista);
  mostrarGrade(
    'Achei ' + lista.length + ' cartas ' +
      (modo === 'numero' ? 'com o número <b>' + escapar(valor) + '</b>' : 'com esse nome') + '.',
    'Qual é o nome da tua? Escreve aí ou toca na carta certa.' +
      (totalReal > lista.length
        ? ' <br><small>(existem ' + totalReal + ' no total; trouxe as ' + lista.length +
          ' mais novas — escreve o nome pra achar a tua)</small>'
        : ''),
    lista, mostrarCarta, 'carta', 'Nome da carta…', 'novas');
}

function desenharOpcoes(lista){
  const grade = document.getElementById('grade');
  if(!grade || !gradeAtual) return;
  const ehColecao = gradeAtual.tipo === 'colecao';
  if(lista.length === 0){
    const fut = FUTUROS.find(f => f.id === especialFiltro);
    grade.innerHTML = fut
      ? '<div class="aviso" style="grid-column:1/-1;margin:0"><strong>Ainda não saiu ⏳</strong>' +
        fut.aviso + '</div>'
      : '<p style="color:var(--tinta-fraca)">Nada com esse nome aqui. Apaga uma letrinha.</p>';
    return;
  }
  grade.innerHTML = '';
  lista.slice(0, limiteGrade).forEach(c => {
    const caixa = document.createElement('div');
    caixa.className = 'opcao' + (ehColecao ? ' colecao' : '');
    const img = ehColecao ? c.logo : ((c.images && c.images.small) || '');
    const linhaDebaixo = ehColecao
      ? [ c.total ? c.total + ' cartas' : '', (c.releaseDate || '').slice(0, 4) ]
      : [ (c.set && c.set.name) || '', c.number ? 'nº ' + c.number : '' ];
    caixa.innerHTML =
      '<button type="button" class="abrir">' +
        '<img loading="lazy" alt="' + escapar(c.name) + '" src="' + escapar(img) + '" />' +
        '<b>' + escapar(c.name) + '</b>' +
        '<small>' + linhaDebaixo.filter(Boolean).map(escapar).join(' · ') + '</small>' +
      '</button>';
    caixa.querySelector('.abrir').onclick = () => gradeAtual.aoClicar(c);

    if(!ehColecao){
      const estrela = document.createElement('button');
      estrela.type = 'button';
      estrela.className = 'estrela';
      const pintar = () => {
        const tem = ehFavorita(c.id);
        estrela.textContent = tem ? '⭐' : '☆';
        estrela.title = tem ? 'Tirar dos favoritos' : 'Guardar nos favoritos';
        estrela.setAttribute('aria-label', estrela.title);
      };
      pintar();
      estrela.onclick = () => {
        virarFavorita(c);
        pintar();
        // Na tela dos favoritos, tirar uma tem que sumir com ela na hora.
        if(gradeAtual.ehFavoritos) mostrarFavoritos();
      };
      caixa.appendChild(estrela);
    }
    grade.appendChild(caixa);
  });
  // Em vez de cortar em 60 e pronto, dá pra pedir mais.
  if(lista.length > limiteGrade){
    const p = document.createElement('p');
    p.style.cssText = 'grid-column:1/-1;text-align:center;color:var(--tinta-fraca);font-size:.88rem';
    p.textContent = 'Mostrando ' + limiteGrade + ' de ' + lista.length + '.';
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn secundario mais';
    b.style.cssText = 'padding:10px 20px;font-size:.95rem';
    b.textContent = '⬇ Mostrar mais ' + Math.min(60, lista.length - limiteGrade);
    b.onclick = () => { limiteGrade += 60; desenharOpcoes(lista); };
    p.appendChild(b);
    grade.appendChild(p);
  }
}

/* ---------- as coleções ----------
   Cada coleção é uma leva de cartas que saiu junto (Celebrations, 151,
   Base Set...). Dá pra ver todas e entrar numa pra olhar carta por carta. */
function deSetPrincipal(s){
  return { id:s.id, name:s.name, serie:s.series || '',
           total:s.printedTotal || s.total || null, releaseDate:s.releaseDate || '',
           logo:(s.images && (s.images.logo || s.images.symbol)) || '', fonte:'principal' };
}
function deSetReserva(s){
  return { id:s.id, name:s.name, serie:(s.serie && s.serie.name) || '',
           total:(s.cardCount && (s.cardCount.official || s.cardCount.total)) || null,
           releaseDate:s.releaseDate || '',
           logo:s.logo ? s.logo + '.png' : (s.symbol ? s.symbol + '.png' : ''), fonte:'reserva' };
}

async function mostrarColecoes(){
  cartaAberta = null;
  palco.innerHTML = '<div class="aviso"><div class="girando"></div>Pegando a lista de coleções…</div>';
  let colecoes = null;
  try{
    if(idioma !== 'en') throw new Error('idioma ' + idioma + ': só o reserva tem');
    const d = await pedirJSON(API_SETS + '?pageSize=250&orderBy=-releaseDate');
    colecoes = (d.data || []).map(deSetPrincipal);
  }catch(e){
    try{
      const l = await pedirReserva('/sets');
      colecoes = (Array.isArray(l) ? l : []).map(deSetReserva);
      colecoes.forEach(c => { c.lang = idioma; });
    }catch(e2){
      palco.innerHTML = '<div class="aviso ruim"><strong>Não consegui pegar as coleções 📡</strong>' +
        'Os dois sites de dados falharam. Tenta de novo daqui a pouco.' +
        '<br><br><small>' + escapar(String(e.message || e) + ' · ' + String(e2.message || e2)) +
        '</small></div>';
      return;
    }
  }
  if(!colecoes.length){
    palco.innerHTML = '<div class="aviso"><strong>Nenhuma coleção veio 🤔</strong>Tenta de novo.</div>';
    return;
  }
  mostrarGrade(
    'Todas as ' + colecoes.length + ' coleções.',
    'Toca numa pra ver as cartas dela, da primeira à última. Estão das mais novas pras mais velhas.',
    colecoes, abrirColecao, 'colecao', 'Ex: Celebrations', 'novas');
}

/* Ordena pelo número impresso na carta, tratando número como número:
   senão a 10 fica antes da 2, e a coleção parece bagunçada. */
function porNumero(a, b){
  return String(a.number || '').localeCompare(String(b.number || ''), 'en', { numeric:true });
}

async function abrirColecao(colecao){
  palco.innerHTML = '<div class="aviso"><div class="girando"></div>' +
    'Pegando as cartas de ' + escapar(colecao.name) + '…</div>';
  let cartas = [];
  try{
    if(colecao.fonte === 'principal'){
      const monta = pag => API + '?q=' + encodeURIComponent('set.id:"' + aspas(colecao.id) + '"') +
                           '&pageSize=250&page=' + pag;
      const d = await pedirJSON(monta(1));
      cartas = await todasAsPaginas(monta, d.data || [], d.totalCount || (d.data || []).length);
    }else{
      const d = await pedirReserva('/sets/' + encodeURIComponent(colecao.id));
      cartas = ((d && d.cards) || []).map(c => {
        const n = deTcgdex(c);
        n.set = { name: colecao.name, printedTotal: colecao.total, releaseDate: colecao.releaseDate };
        n.__faltaPreco = true;
        return n;
      });
    }
  }catch(e){
    palco.innerHTML = '<div class="aviso ruim"><strong>Não consegui abrir essa coleção 📡</strong>' +
      'Tenta de novo, ou escolhe outra.<br><br><small>' + escapar(String(e.message || e)) + '</small></div>';
    return;
  }
  if(!cartas.length){
    palco.innerHTML = '<div class="aviso"><strong>Essa coleção veio vazia 🤔</strong>' +
      'Acontece com coleção muito nova. Tenta outra.</div>';
    return;
  }
  cartas.sort(porNumero);
  achadas = cartas;
  totalReal = cartas.length;
  voltarPraLista = () => { mostrarCartasDaColecao(colecao, cartas); };
  mostrarCartasDaColecao(colecao, cartas);
}

function mostrarCartasDaColecao(colecao, cartas){
  mostrarGrade(
    escapar(colecao.name) + ' — ' + cartas.length + ' cartas.',
    'Toca numa carta pra ver quanto ela vale.' +
      (colecao.releaseDate ? ' <br><small>Saiu em ' + escapar(colecao.releaseDate) + '.</small>' : ''),
    cartas, mostrarCarta, 'carta', 'Nome da carta…', 'numero');

/* ---------- estado da carta e nota da PSA ----------
   Os preços que as APIs dão são de carta Near Mint: perfeita, sem uso.
   Daqui pra baixo é CONTA MINHA, não preço de tabela. Os fatores são a
   régua que o pessoal de carta usa de cabeça pra descontar o desgaste,
   e servem pra dar noção — a carta vale mesmo é o que alguém pagar. */
const ESTADOS = [
  { id:'perfeita', nome:'✨ Perfeita',     fator:1,    dica:'Saiu do pacote agora: cantos afiados, sem risco nenhum.' },
  { id:'boa',      nome:'🙂 Estado bom',   fator:0.80, dica:'Risquinhos que só aparecem na luz, cantos quase perfeitos.' },
  { id:'media',    nome:'😐 Estado médio', fator:0.60, dica:'Cantos embranquecidos e riscos que dá pra ver de longe.' },
  { id:'ruim',     nome:'😬 Estado ruim',  fator:0.35, dica:'Dobrada, rasgada, manchada ou bem gasta.' },
];
/* Quanto a MESMA carta costuma valer depois de avaliada pela PSA. Varia
   muito de carta pra carta, então é palpite pra dar noção, não cotação:
   preço de carta avaliada ninguém entrega de graga numa API. */
const NOTAS_PSA = [
  { nome:'PSA 10', fator:5,    obs:'perfeita de lupa' },
  { nome:'PSA 9',  fator:2,    obs:'quase perfeita' },
  { nome:'PSA 8',  fator:1.3,  obs:'muito boa' },
  { nome:'PSA 7',  fator:1,    obs:'boa' },
  { nome:'PSA 6',  fator:0.75, obs:'dá pra ver o uso' },
];
const CUSTO_PSA = 25;   // dólares, mais ou menos, pra mandar uma carta avaliar

/* ---------- preços ---------- */
const VARIANTES = {
  normal:'Normal', holofoil:'Holo', reverseHolofoil:'Reverse Holo',
  '1stEditionHolofoil':'1ª edição holo', '1stEditionNormal':'1ª edição normal',
  unlimitedHolofoil:'Ilimitada holo', unlimited:'Ilimitada'
};
/* Carta de Pokémon não é só bicho: tem Treinador (Pokébola, Professor,
   objeto) e Energia. Elas sempre vieram na busca, mas ficavam misturadas
   e ninguém achava. Estes são os nomes que as duas APIs usam. */
function chavesPreco(c){ return Object.keys((c.tcgplayer && c.tcgplayer.prices) || {}); }
function temPrimeiraEdicao(c){ return chavesPreco(c).some(k => k.indexOf('1stEdition') === 0); }
function temHolo(c){
  return chavesPreco(c).some(k => /holofoil/i.test(k) && !/reverse/i.test(k)) ||
         /holo/i.test(c.rarity || '');
}
function temReverse(c){ return chavesPreco(c).some(k => /reverse/i.test(k)); }
function ehPromo(c){
  return /promo/i.test(c.rarity || '') ||
         /promo|black star/i.test((c.set && c.set.name) || '');
}
/* Jumbo é a carta gigante. Nenhuma das duas APIs tem um campo pra isso,
   então procuro nos subtipos e no nome. O botão só aparece se a lista
   realmente tiver alguma: melhor não ter o botão do que ter um que mente. */
function ehJumbo(c){
  return (c.subtypes || []).some(x => /jumbo|oversize/i.test(x)) ||
         /jumbo|oversize/i.test(c.name || '');
}

const FILTROS = [
  { id:'todos',    nome:'Todas',        testa:function(){ return true; } },
  { id:'Pokémon',  nome:'⚡ Pokémon',   testa:c => c.supertype === 'Pokémon' },
  { id:'Trainer',  nome:'🎒 Treinador', testa:c => c.supertype === 'Trainer' },
  { id:'Energy',   nome:'🔋 Energia',   testa:c => c.supertype === 'Energy' },
  { id:'primeira', nome:'✨ 1ª edição', testa:temPrimeiraEdicao },
  { id:'promo',    nome:'🌟 Promo',     testa:ehPromo },
  { id:'holo',     nome:'💫 Holo',      testa:temHolo },
  { id:'reverse',  nome:'🔄 Reverse',   testa:temReverse },
  { id:'jumbo',    nome:'📏 Jumbo',     testa:ehJumbo },
];
const NOME_TIPO = { 'Pokémon':'Pokémon', 'Trainer':'Treinador', 'Energy':'Energia' };

const EXPLICA = {
  normal:'sem brilho nenhum', holofoil:'o desenho brilha',
  reverseHolofoil:'o fundo brilha, o desenho não',
  '1stEditionHolofoil':'tem o selo de 1ª edição', '1stEditionNormal':'selo de 1ª edição, sem brilho',
};
// Ordem de importância: a versão mais valiosa é a que a pessoa quer ver primeiro.
const ORDEM = ['1stEditionHolofoil','holofoil','1stEditionNormal','unlimitedHolofoil','normal','reverseHolofoil','unlimited'];

function precoPrincipal(carta){
  const p = carta.tcgplayer && carta.tcgplayer.prices;
  if(p){
    const chaves = Object.keys(p).sort((a,b) => {
      const ia = ORDEM.indexOf(a), ib = ORDEM.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    for(const k of chaves){
      const v = p[k] && (p[k].market ?? p[k].mid ?? p[k].low);
      if(typeof v === 'number' && v > 0)
        return { valor:v, moeda:'USD', qual:VARIANTES[k] || k, onde:'TCGplayer' };
    }
  }
  const cm = carta.cardmarket && carta.cardmarket.prices;
  if(cm){
    const v = cm.trendPrice ?? cm.averageSellPrice ?? cm.avg30 ?? cm.lowPrice;
    if(typeof v === 'number' && v > 0)
      return { valor:v, moeda:'EUR', qual:'preço médio', onde:'Cardmarket' };
  }
  return null;
}

function dinheiro(v, moeda){
  if(typeof v !== 'number') return '—';
  // Com separador de milhar: $11,500.00 se lê, $11500.00 não.
  return v.toLocaleString('en-US', { style:'currency', currency: moeda || 'USD' });
}
function soReais(v, moeda){
  const cotacao = parseFloat(inpCota.value);
  if(!(cotacao > 0) || typeof v !== 'number') return '';
  // O campo é a cotação do dólar; pro euro uso uma folguinha de 8%.
  const taxa = moeda === 'EUR' ? cotacao * 1.08 : cotacao;
  return (v * taxa).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}
function emReais(v, moeda){
  const r = soReais(v, moeda);
  return r ? 'mais ou menos ' + r : '';
}

/* O preço de carta perfeita (Near Mint) de uma versão específica. É daqui
   que saem todas as contas de estado e de nota da PSA. */
function precoNM(carta, chave){
  const v = carta.tcgplayer && carta.tcgplayer.prices && carta.tcgplayer.prices[chave];
  if(!v) return null;
  const n = [v.market, v.mid, v.low].find(x => typeof x === 'number' && x > 0);
  return n == null ? null : n;
}
function versoesComPreco(carta){
  const p = (carta.tcgplayer && carta.tcgplayer.prices) || {};
  return Object.keys(p).filter(k => precoNM(carta, k) != null).sort((a, b) => {
    const ia = ORDEM.indexOf(a), ib = ORDEM.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
}

function tabelaTCG(carta){
  const p = carta.tcgplayer && carta.tcgplayer.prices;
  if(!p || Object.keys(p).length === 0) return '';
  let linhas = '';
  for(const [k, v] of Object.entries(p)){
    if(!v) continue;
    linhas += '<tr><td>' + escapar(VARIANTES[k] || k) + '</td>' +
      '<td>' + dinheiro(v.market, 'USD') + '</td>' +
      '<td>' + dinheiro(v.low, 'USD') + '</td>' +
      '<td>' + dinheiro(v.high, 'USD') + '</td></tr>';
  }
  if(!linhas) return '';
  return '<h3 class="titulinho">Por versão da carta (TCGplayer, em dólar)</h3>' +
    '<table><thead><tr><th>Versão</th><th>Mercado</th><th>Mais barata</th><th>Mais cara</th></tr></thead>' +
    '<tbody>' + linhas + '</tbody></table>';
}

function blocoCardmarket(carta){
  const cm = carta.cardmarket && carta.cardmarket.prices;
  if(!cm) return '';
  const v = cm.trendPrice ?? cm.averageSellPrice;
  if(typeof v !== 'number') return '';
  return '<h3 class="titulinho">Na Europa (Cardmarket, em euro)</h3>' +
    '<table><tbody>' +
      '<tr><td>Tendência</td><td>' + dinheiro(cm.trendPrice, 'EUR') + '</td></tr>' +
      '<tr><td>Média de venda</td><td>' + dinheiro(cm.averageSellPrice, 'EUR') + '</td></tr>' +
      '<tr><td>Mais barata</td><td>' + dinheiro(cm.lowPrice, 'EUR') + '</td></tr>' +
    '</tbody></table>';
}

/* ---------- de onde a carta é ----------
   Nenhum dos dois bancos tem campo de país, então isto é dedução, e a tela
   diz de onde ela saiu em vez de fingir que é dado oficial:

   - o banco principal É o catálogo das cartas em inglês. Estar nele quer
     dizer que a carta saiu em inglês. Isso é certeza, não palpite.
   - achar a carta só no reserva quer dizer que ela não está no catálogo em
     inglês. O caso mais comum disso é promo japonesa.
   - quando o nome da coleção já diz "Japanese", aí não precisa deduzir. */
function origemDaCarta(c){
  const set = (c.set && c.set.name) || '';
  if(/japan|japanese|\bjp\b/i.test(set))
    return { etiqueta:'🇯🇵 Japão',
             conta:'O nome da coleção já diz que ela é japonesa.' };
  if(/world championship/i.test(set))
    return { etiqueta:'🏆 Mundial',
             conta:'Carta de campeonato mundial, entregue no evento — não vendida em loja.' };
  if(c.__lang && c.__lang !== 'en')
    return { etiqueta:nomeIdioma(c.__lang),
             conta:'Você está procurando as cartas em ' +
                   nomeIdioma(c.__lang).replace(/^\S+\s/, '') +
                   ', então esta é a versão nesse idioma. Se ela tiver preço, ele costuma ser ' +
                   'o do mercado onde essa versão é vendida.' };
  if(c.__daReserva)
    return { etiqueta:'🗾 Fora do inglês',
             conta:'Ela não está no catálogo das cartas em inglês; achei só no outro banco, ' +
                   'que guarda carta que nunca saiu em inglês. Quase sempre isso quer dizer Japão.' };
  return { etiqueta:'🌎 Em inglês',
           conta:'Ela está no catálogo das cartas em inglês (Estados Unidos e Europa). ' +
                 'Quase toda carta também existe em japonês, mas o preço aqui é o da versão em inglês.' };
}

/* ---------- a carta na tela ---------- */
function mostrarCarta(carta){
  // Favorita guarda só a identidade: o preço de hoje vem agora.
  if(carta.__soIdentidade) return abrirFavorito(carta);
  // Carta que veio do site reserva chega sem preço: busco o dela agora.
  if(carta.__faltaPreco) return abrirDoReserva(carta);
  cartaAberta = carta;
  versaoEscolhida = versoesComPreco(carta)[0] || null;   // começa pela mais valiosa
  estadoEscolhido = 'perfeita';
  desenharCarta();
  palco.scrollIntoView({ behavior:'smooth', block:'start' });
}

/* Redesenha a carta inteira com a versão e o estado escolhidos. É de
   propósito que redesenha tudo: são poucos elementos, e assim não tem
   como a tela e a escolha ficarem contando histórias diferentes. */
function desenharCarta(){
  const carta = cartaAberta;
  if(!carta) return;
  const img = (carta.images && (carta.images.large || carta.images.small)) || '';
  const set = carta.set || {};
  const versoes = versoesComPreco(carta);

  // preço de carta perfeita, da versão escolhida
  const base = versaoEscolhida
    ? { valor: precoNM(carta, versaoEscolhida), moeda:'USD',
        qual: VARIANTES[versaoEscolhida] || versaoEscolhida, onde:'TCGplayer' }
    : precoPrincipal(carta);

  const est = ESTADOS.find(e => e.id === estadoEscolhido) || ESTADOS[0];
  const vale = base && typeof base.valor === 'number' ? base.valor * est.fator : null;

  const escolherVersao = versoes.length > 1
    ? '<div class="escolha"><h3>1. Qual versão é a tua?</h3>' +
        chips('chips-versao', versoes.map(v => ({
          v: v, rotulo: VARIANTES[v] || v, sub: EXPLICA[v] || '' })), versaoEscolhida) +
      '</div>'
    : '';

  const escolherEstado = base
    ? '<div class="escolha"><h3>' + (versoes.length > 1 ? '2. ' : '') + 'Como ela está?</h3>' +
        chips('chips-estado', ESTADOS.map(e => ({
          v: e.id, rotulo: e.nome, sub: e.dica })), estadoEscolhido) +
      '</div>'
    : '';

  const caixaPreco = vale != null
    ? '<div class="destaque">' +
        '<div class="rotulo">' + escapar(est.nome.replace(/^\S+\s/, '')) + ', vale mais ou menos</div>' +
        '<div class="preco">' + dinheiro(vale, base.moeda) + '</div>' +
        '<div class="reais">' + escapar(emReais(vale, base.moeda)) + '</div>' +
        // O preço puro, do jeito que a API deu, sem o desconto do estado.
        (est.fator !== 1
          ? '<div class="crua">Sem contar o estado, o preço de tabela é <b>' +
              dinheiro(base.valor, base.moeda) + '</b>' +
              (soReais(base.valor, base.moeda) ? ' · ' + escapar(soReais(base.valor, base.moeda)) : '') +
            '</div>'
          : '') +
        '<div class="qual">' + escapar(base.qual) +
          (est.fator !== 1 ? ' · ' + Math.round(est.fator * 100) + '% do preço de carta perfeita' : '') +
          ' · fonte: ' + escapar(base.onde) + '</div>' +
      '</div>'
    : '<div class="destaque"><div class="rotulo">Preço</div>' +
      '<div class="preco" style="font-size:1.4rem">Ninguém anunciou essa ainda</div>' +
      '<div class="qual">Sem preço registrado pra essa carta.</div></div>';

  const de = origemDaCarta(carta);
  const link = (carta.tcgplayer && carta.tcgplayer.url) || (carta.cardmarket && carta.cardmarket.url);

  palco.innerHTML =
    '<article class="carta">' +
      '<img class="foto" alt="Carta ' + escapar(carta.name) + '" src="' + escapar(img) + '" />' +
      '<div>' +
        '<h2>' + escapar(carta.name) + '</h2>' +
        (avisoBusca && !voltarPraLista
          ? '<p class="nota" style="margin:0 0 12px">🌐 ' + avisoBusca + '</p>' : '') +
        '<div class="etiquetas">' +
          '<span class="etiqueta">nº ' + escapar(carta.number || '?') +
            (set.printedTotal ? '/' + escapar(String(set.printedTotal)) : '') + '</span>' +
          (set.name ? '<span class="etiqueta">' + escapar(set.name) + '</span>' : '') +
          (especiaisDe(carta).map(x =>
            '<span class="etiqueta forte">' + escapar(rotuloEspecial(x)) + '</span>').join('')) +
          ((carta.types || []).map(t =>
            '<span class="etiqueta">' +
              escapar((ENERGIAS.find(e => e.id === t) || { nome:t }).nome) + '</span>').join('')) +
          (carta.supertype ? '<span class="etiqueta">' +
            escapar(NOME_TIPO[carta.supertype] || carta.supertype) + '</span>' : '') +
          (carta.rarity ? '<span class="etiqueta">' + escapar(nomeRaridade(carta.rarity)) + '</span>' : '') +
          (set.releaseDate ? '<span class="etiqueta">' + escapar(set.releaseDate.slice(0,4)) + '</span>' : '') +
          '<span class="etiqueta pais">' + escapar(de.etiqueta) + '</span>' +
        '</div>' +
        '<p class="de-onde">' + escapar(de.conta) +
          ' <b>Isso é dedução minha</b> — os bancos de carta não guardam o país.</p>' +
        escolherVersao + escolherEstado + caixaPreco +
        tabelaPSA(base) +
        tabelaTCG(carta) +
        blocoCardmarket(carta) +
        (link ? '<p class="fonte">Ver anúncios de verdade: <a href="' + escapar(link) +
                '" target="_blank" rel="noopener">abrir a loja</a></p>' : '') +
        '<p class="fonte" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">' +
          '<button class="btn secundario" type="button" id="fav" ' +
            'style="padding:10px 18px;font-size:.95rem">' +
            (ehFavorita(carta.id) ? '⭐ Está nos favoritos' : '☆ Guardar nos favoritos') +
          '</button>' +
          (voltarPraLista
            ? '<button class="btn secundario" type="button" id="voltar" ' +
              'style="padding:10px 18px;font-size:.95rem">↩ Voltar pra lista</button>'
            : '') +
        '</p>' +
      '</div>' +
    '</article>';

  ligarChips('chips-versao', v => { versaoEscolhida = v; });
  ligarChips('chips-estado', v => { estadoEscolhido = v; });
  const voltar = document.getElementById('voltar');
  if(voltar) voltar.onclick = () => voltarPraLista && voltarPraLista();
  const fav = document.getElementById('fav');
  if(fav) fav.onclick = () => {
    const virou = virarFavorita(carta);
    fav.textContent = virou ? '⭐ Está nos favoritos' : '☆ Guardar nos favoritos';
  };
}

function chips(id, itens, ativo){
  return '<div class="chips" id="' + id + '">' + itens.map(i =>
    '<button type="button" class="chip" data-v="' + escapar(i.v) + '" ' +
      'aria-pressed="' + (i.v === ativo) + '">' + escapar(i.rotulo) +
      (i.sub ? '<small>' + escapar(i.sub) + '</small>' : '') +
    '</button>').join('') + '</div>';
}
function ligarChips(id, aoEscolher, redesenhar){
  const caixa = document.getElementById(id);
  if(!caixa) return;
  caixa.querySelectorAll('.chip').forEach(b => {
    b.onclick = () => { aoEscolher(b.dataset.v); (redesenhar || desenharCarta)(); };
  });
}

/* ---------- se ela for avaliada ----------
   Carta avaliada pela PSA vem num case lacrado com uma nota de 1 a 10, e
   vale bem mais que a mesma carta solta. Preço de carta avaliada não sai
   de API de graça, então aqui é conta em cima do preço solto — por isso o
   aviso embaixo da tabela, que não é enfeite. */
function tabelaPSA(base){
  if(!base || !(base.valor > 0)) return '';
  const linhas = NOTAS_PSA.map(n =>
    '<tr><td><b>' + n.nome + '</b><span class="sub">' + escapar(n.obs) + '</span></td>' +
    '<td>' + dinheiro(base.valor * n.fator, base.moeda) + '</td>' +
    '<td>' + escapar(soReais(base.valor * n.fator, base.moeda) || '—') + '</td></tr>').join('');

  const naoCompensa = base.moeda === 'USD' && base.valor * 5 < CUSTO_PSA;
  return '<h3 class="titulinho">Se ela for avaliada (PSA)</h3>' +
    '<table><thead><tr><th>Nota</th><th>Valeria</th><th>Em reais</th></tr></thead>' +
    '<tbody>' + linhas + '</tbody></table>' +
    '<p class="nota"><b>Isso aqui é conta minha, não é preço de tabela.</b> ' +
    'Ninguém dá preço de carta avaliada de graça, então eu multiplico o preço da carta solta. ' +
    'Carta avaliada varia muito: serve pra ter noção, não pra vender.' +
    (naoCompensa
      ? '<br><br>Nessa carta nem vale a pena pensar nisso: mandar avaliar custa uns $' + CUSTO_PSA +
        ', mais do que ela valeria com PSA 10.'
      : '') + '</p>';
}

async function abrirDoReserva(carta){
  palco.innerHTML = '<div class="aviso"><div class="girando"></div>Pegando o preço…</div>';
  let cheia = carta;
  try{
    cheia = deTcgdex(await pedirReserva('/cards/' + encodeURIComponent(carta.id), carta.__lang));
  }catch(e){ /* sem detalhe, mostro o que já tenho — sem preço é melhor que nada */ }
  cheia.__faltaPreco = false;
  const i = achadas.findIndex(c => c.id === carta.id);   // não buscar de novo
  if(i >= 0) achadas[i] = cheia;
  mostrarCarta(cheia);
}

function escapar(t){
  return String(t ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

const selIdioma = document.getElementById('sel-idioma');
selIdioma.innerHTML = IDIOMAS.map(i =>
  '<option value="' + i.id + '">' + i.nome + '</option>').join('');
try{
  const salvo = localStorage.getItem('butterpoke:idioma');
  if(salvo && IDIOMAS.some(i => i.id === salvo)) idioma = salvo;
}catch(e){}
selIdioma.value = idioma;
selIdioma.onchange = () => {
  idioma = selIdioma.value;
  try{ localStorage.setItem('butterpoke:idioma', idioma); }catch(e){}
  // O que está na tela é do idioma antigo, então some com ele.
  cartaAberta = null; voltarPraLista = null; achadas = [];
  palco.innerHTML = '<div class="aviso"><strong>Idioma trocado pra ' +
    escapar(nomeIdioma(idioma)) + '</strong>' +
    (idioma === 'en'
      ? 'Procura de novo, que agora vem o catálogo em inglês, que é o maior de todos.'
      : 'Procura de novo. Fora do inglês tem bem <b>menos carta cadastrada</b> e preço ' +
        'quase nunca vem junto — mas fica tranquilo: se eu não achar em ' +
        escapar(soNome(idioma)) + ', eu procuro em inglês sozinho e te aviso.') + '</div>';
  campo.focus();
};

document.getElementById('btn-colecoes').onclick = mostrarColecoes;
document.getElementById('btn-favoritos').onclick = mostrarFavoritos;
contarFavoritos();

campo.focus();
if('serviceWorker' in navigator)
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
