<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ButterPoke">
  <rect width="512" height="512" rx="110" fill="#faf7ff"/>

  <g stroke="#4a3168" stroke-width="13" stroke-linejoin="round">
    <!-- asas de cima -->
    <ellipse cx="146" cy="206" rx="106" ry="73" fill="#ffffff" transform="rotate(-26 146 206)"/>
    <ellipse cx="366" cy="206" rx="106" ry="73" fill="#ffffff" transform="rotate(26 366 206)"/>
    <!-- asas de baixo -->
    <ellipse cx="176" cy="340" rx="78" ry="55" fill="#f0e4ff" transform="rotate(20 176 340)"/>
    <ellipse cx="336" cy="340" rx="78" ry="55" fill="#f0e4ff" transform="rotate(-20 336 340)"/>
    <!-- as pontinhas escuras da asa da Butterfree -->
    <path d="M72 158c-22 18-30 44-22 66" fill="none" stroke-linecap="round"/>
    <path d="M440 158c22 18 30 44 22 66" fill="none" stroke-linecap="round"/>
  </g>

  <!-- anteninhas -->
  <g stroke="#4a3168" stroke-width="12" fill="none" stroke-linecap="round">
    <path d="M228 150c-14-26-34-40-56-44"/>
    <path d="M284 150c14-26 34-40 56-44"/>
  </g>
  <circle cx="168" cy="102" r="14" fill="#4a3168"/>
  <circle cx="344" cy="102" r="14" fill="#4a3168"/>

  <!-- corpo -->
  <ellipse cx="256" cy="316" rx="46" ry="82" fill="#8e5fc0" stroke="#4a3168" stroke-width="13"/>
  <!-- cabeça -->
  <circle cx="256" cy="200" r="66" fill="#a97fd6" stroke="#4a3168" stroke-width="13"/>
  <!-- olhões vermelhos -->
  <circle cx="222" cy="200" r="31" fill="#e3350d" stroke="#4a3168" stroke-width="11"/>
  <circle cx="290" cy="200" r="31" fill="#e3350d" stroke="#4a3168" stroke-width="11"/>
  <circle cx="214" cy="190" r="9" fill="#ffffff"/>
  <circle cx="282" cy="190" r="9" fill="#ffffff"/>
</svg>
