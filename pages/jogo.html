<!DOCTYPE html>
<html lang="pt-BR" data-root="../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo — Jogos do JoJo</title>
  <meta name="description" content="Detalhes do jogo: história, como jogar, controles, curiosidades, ranking e mais." />
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Aplicativo instalável (Android e iPhone) -->
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jogos do JoJo" />
  <link rel="apple-touch-icon" href="../assets/icons/app/jojo-180.png" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="jogos">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <header id="site-header" class="site-header"></header>

  <main>
    <div class="container">
      <!-- Todo o conteúdo é montado pelo js/game.js a partir do games.json -->
      <div id="conteudo-jogo"></div>
    </div>
  </main>

  <!-- Lightbox para ampliar imagens da galeria -->
  <div id="lightbox" class="lightbox" role="dialog" aria-label="Imagem ampliada">
    <img src="" alt="Imagem ampliada da galeria" />
  </div>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="../js/utils.js"></script>
  <script src="../components/header.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../js/background.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/game.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
