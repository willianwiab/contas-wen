<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jornal do Jojo</title>
<meta name="description" content="Um jornal de notícias inventadas e engraçadas: escreva, curta, imprima e mande pros amigos." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
/* Jornal do Jojo: notícias inventadas que a gente escreve. Tudo fica neste navegador (localStorage);
   uma notícia pode ir pra um amigo por link (#JJ1-...). */
:root{--papel:#f7f3ea;--tinta:#1a1a1a;--fraco:#6b6359;--linha:#1a1a1a;--vermelho:#b3261e;--cartao:#fffdf8}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e3d5;color:var(--tinta);font:17px/1.55 'Source Serif 4',Georgia,serif}
.jornal{max-width:1000px;margin:18px auto;background:var(--papel);padding:22px 26px 40px;box-shadow:0 6px 30px rgba(0,0,0,.18)}
.cabeca{text-align:center;border-bottom:4px double var(--linha);padding-bottom:8px}
.cabeca .data{display:flex;justify-content:space-between;font:600 13px 'Source Serif 4',serif;text-transform:uppercase;letter-spacing:1px;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);padding:4px 2px;margin-top:6px}
.cabeca h1{margin:4px 0 0;font:900 clamp(40px,10vw,92px)/1 'Playfair Display',Georgia,serif;letter-spacing:-1px}
.cabeca h1 span{color:var(--vermelho)}
.cabeca p{margin:4px 0 0;font-style:italic;color:var(--fraco)}
.barra{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.barra button,.btn{font:600 15px 'Source Serif 4',serif;background:var(--tinta);color:var(--papel);border:0;border-radius:4px;padding:8px 14px;cursor:pointer}
.barra button.claro,.btn.claro{background:transparent;color:var(--tinta);border:2px solid var(--tinta)}
.secoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.secoes button{font:600 13px 'Source Serif 4',serif;background:transparent;border:1px solid var(--linha);border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--tinta)}
.secoes button.on{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e0a100;outline-offset:2px}
/* manchete + colunas */
.manchete{border-bottom:2px solid var(--linha);padding:10px 0 16px;margin-bottom:14px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.manchete .fig{font-size:clamp(70px,14vw,130px);line-height:1}
.manchete h2{margin:0;font:900 clamp(28px,5.4vw,52px)/1.05 'Playfair Display',Georgia,serif}
.colunas{column-count:3;column-gap:26px;column-rule:1px solid #c9bfae}
.noticia{break-inside:avoid;margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid #c9bfae}
.noticia .fig{font-size:42px;line-height:1}
.noticia h3{margin:4px 0 4px;font:700 22px/1.15 'Playfair Display',Georgia,serif}
.secao{display:inline-block;font:600 11px 'Source Serif 4',serif;text-transform:uppercase;letter-spacing:1.5px;color:var(--vermelho)}
.texto{margin:6px 0;white-space:pre-wrap;word-wrap:break-word}
.manchete .texto{font-size:19px}
.assina{font-style:italic;color:var(--fraco);font-size:14px}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.acoes button{font:600 13px 'Source Serif 4',serif;background:transparent;border:1px solid #a89c88;border-radius:4px;padding:3px 8px;cursor:pointer;color:var(--tinta)}
.acoes button.curtido{background:#fde2e1;border-color:var(--vermelho)}
.vazio{text-align:center;color:var(--fraco);font-style:italic;padding:30px 0}
/* editor */
.editor{display:none;background:var(--cartao);border:2px solid var(--linha);padding:16px;margin:12px 0}
.editor.on{display:block}
.editor h2{margin:0 0 8px;font:900 26px 'Playfair Display',serif}
.editor label{display:block;font-weight:600;margin:10px 0 4px}
.editor input,.editor textarea,.editor select{width:100%;font:inherit;background:#fff;border:1px solid #a89c88;border-radius:4px;padding:8px 10px;color:var(--tinta)}
.editor textarea{min-height:130px;resize:vertical}
.figuras{display:flex;flex-wrap:wrap;gap:4px}
.figuras button{font-size:26px;background:#fff;border:1px solid #c9bfae;border-radius:6px;width:44px;height:44px;cursor:pointer;padding:0}
.figuras button.on{border:3px solid var(--vermelho)}
.aviso{font-size:14px;background:#fff6d6;border:1px solid #e0a100;border-radius:6px;padding:8px 10px;margin-top:10px}
.msg{min-height:1.3em;font-weight:600;color:var(--vermelho)}
.lida{display:none;background:var(--cartao);border:3px double var(--linha);padding:16px;margin:12px 0}
.lida.on{display:block}
@media (max-width:820px){ .colunas{column-count:2} }
@media (max-width:540px){ .jornal{padding:14px 14px 30px;margin:0} .colunas{column-count:1} .manchete{grid-template-columns:1fr;text-align:center} .cabeca .data{font-size:11px} }
@media print{ body{background:#fff} .jornal{box-shadow:none;margin:0;max-width:none} .barra,.secoes,.acoes,.editor,.lida{display:none !important} }
</style>
</head>
<body>
<div class="jornal">
  <header class="cabeca">
    <div class="data"><span id="hoje"></span><span>Edição nº <b id="edicao">1</b></span><span>Preço: 1 sorriso 😄</span></div>
    <h1>Jornal do <span>Jojo</span></h1>
    <p>As notícias mais malucas que você vai ler hoje (e todas inventadas!)</p>
  </header>

  <div class="barra">
    <button type="button" id="nova">✍️ Escrever notícia</button>
    <button type="button" id="maluca" class="claro">🎲 Manchete maluca</button>
    <button type="button" id="imprimir" class="claro">🖨️ Imprimir</button>
  </div>
  <div class="secoes" id="secoes"></div>

  <!-- notícia que chegou por link -->
  <section class="lida" id="lida" aria-live="polite"></section>

  <!-- editor -->
  <section class="editor" id="editor">
    <h2 id="editor-titulo">✍️ Nova notícia</h2>
    <label for="f-titulo">Manchete (título)</label>
    <input id="f-titulo" maxlength="90" placeholder="ex: Pikachu é preso por roubar ketchup!" />
    <label for="f-secao">Seção</label>
    <select id="f-secao"></select>
    <label>Figura</label>
    <div class="figuras" id="figuras"></div>
    <label for="f-texto">Notícia</label>
    <textarea id="f-texto" maxlength="900" placeholder="Conte o que aconteceu…"></textarea>
    <label for="f-autor">Repórter (apelido)</label>
    <input id="f-autor" maxlength="24" placeholder="ex: Repórter Pintinho" />
    <p class="aviso">🛡️ Use um <b>apelido</b> e invente as notícias! Não escreva nome de verdade, endereço, escola ou telefone, e não fale mal de pessoas de verdade.</p>
    <p class="msg" id="msg"></p>
    <div class="barra" style="justify-content:flex-start">
      <button type="button" id="publicar">📰 Publicar</button>
      <button type="button" id="cancelar" class="claro">Cancelar</button>
    </div>
  </section>

  <section id="capa"></section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const SECOES = [['tudo', '📰 Tudo'], ['bizarro', '🤪 Bizarro'], ['games', '🎮 Games'], ['pokemon', '⚡ Pokémon'], ['esportes', '⚽ Esportes'], ['escola', '🏫 Escola'], ['bichos', '🐔 Bichos'], ['ciencia', '🔬 Ciência'], ['clima', '🌦️ Tempo']];
  const FIGURAS = ['📰', '😱', '🤣', '🐔', '⚡', '🎮', '⚽', '🏫', '🦖', '👽', '🍕', '🚀', '🌪️', '🏆', '🔪', '💰', '🐱', '🤖', '🌋', '🧟', '🍦', '🎉', '🚓', '👑'];
  const hojeTxt = () => new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  $('hoje').textContent = hojeTxt();

  /* Guardar */
  const ler = (k, p) => { try{ return JSON.parse(localStorage.getItem('jornal-jojo:' + k)) ?? p; }catch(e){ return p; } };
  const gravar = (k, v) => { try{ localStorage.setItem('jornal-jojo:' + k, JSON.stringify(v)); }catch(e){} };
  const EXEMPLOS = [
    { titulo:'Pintinho gigante é visto correndo pelo Roblox', secao:'games', fig:'🐔', texto:'Testemunhas dizem que um pintinho do tamanho de um prédio passou correndo pelo mapa Mansion 2 gritando "eu sempre volto!". Até agora ninguém conseguiu pegar ele.', autor:'Repórter Pena' },
    { titulo:'Snorlax dorme em cima da pista e cancela a corrida', secao:'pokemon', fig:'😴', texto:'A grande corrida de hoje foi adiada porque um Snorlax resolveu tirar uma soneca bem no meio da pista. Os organizadores tentaram acordar ele com uma flauta, mas ele só roncou mais alto.', autor:'Repórter Zzz' },
    { titulo:'Chove pizza na cidade e escolas fecham pra todo mundo comer', secao:'clima', fig:'🍕', texto:'A previsão era de chuva, mas ninguém esperava que fosse de pizza! Os meteorologistas avisam: amanhã pode cair sorvete. Leve uma colher.', autor:'Repórter Calabresa' }
  ];
  let noticias = ler('noticias', null);
  if(!noticias){ noticias = EXEMPLOS.map((n, i) => ({ ...n, id:'ex' + i, quando:Date.now() - (i + 1) * 3600e3, curtidas:Math.floor(Math.random() * 20) + 3, curti:false })); gravar('noticias', noticias); }
  let filtro = 'tudo', editando = null, figura = '📰';

  /* Seções e figuras */
  $('secoes').innerHTML = SECOES.map(([k, n]) => `<button type="button" data-secao="${k}" class="${k === 'tudo' ? 'on' : ''}">${n}</button>`).join('');
  $('f-secao').innerHTML = SECOES.slice(1).map(([k, n]) => `<option value="${k}">${n}</option>`).join('');
  $('figuras').innerHTML = FIGURAS.map(f => `<button type="button" data-fig="${f}">${f}</button>`).join('');
  const marcarFigura = () => document.querySelectorAll('#figuras button').forEach(b => b.classList.toggle('on', b.dataset.fig === figura));
  $('figuras').addEventListener('click', ev => { const b = ev.target.closest('[data-fig]'); if(b){ figura = b.dataset.fig; marcarFigura(); } });
  $('secoes').addEventListener('click', ev => {
    const b = ev.target.closest('[data-secao]'); if(!b) return; filtro = b.dataset.secao;
    document.querySelectorAll('#secoes button').forEach(x => x.classList.toggle('on', x === b)); desenhar();
  });

  const nomeSecao = k => (SECOES.find(s => s[0] === k) || SECOES[1])[1];
  const quandoTxt = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'agora mesmo' : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.round(m / 60)} h` : new Date(t).toLocaleDateString('pt-BR'); };
  function noticiaHTML(n, grande){
    return `${grande ? `<div class="fig">${esc(n.fig)}</div><div>` : `<div class="fig">${esc(n.fig)}</div>`}
      <span class="secao">${esc(nomeSecao(n.secao))}</span>
      ${grande ? `<h2>${esc(n.titulo)}</h2>` : `<h3>${esc(n.titulo)}</h3>`}
      <p class="texto">${esc(n.texto)}</p>
      <p class="assina">Por ${esc(n.autor || 'Repórter misterioso')} · ${quandoTxt(n.quando)}</p>
      <div class="acoes"><button type="button" data-curtir="${n.id}" class="${n.curti ? 'curtido' : ''}">❤️ ${n.curtidas || 0}</button>
        <button type="button" data-mandar="${n.id}">📤 Mandar</button><button type="button" data-editar="${n.id}">✏️ Editar</button><button type="button" data-apagar="${n.id}">🗑️</button></div>
      ${grande ? '</div>' : ''}`;
  }
  function desenhar(){
    $('edicao').textContent = noticias.length;
    const lista = noticias.filter(n => filtro === 'tudo' || n.secao === filtro).sort((a, b) => b.quando - a.quando);
    if(!lista.length){ $('capa').innerHTML = '<p class="vazio">Nenhuma notícia nesta seção ainda. Que tal escrever a primeira? ✍️</p>'; return; }
    /* A manchete é a mais curtida; o resto vai nas colunas. */
    const topo = lista.slice().sort((a, b) => (b.curtidas || 0) - (a.curtidas || 0) || b.quando - a.quando)[0];
    $('capa').innerHTML = `<article class="manchete">${noticiaHTML(topo, true)}</article>
      <div class="colunas">${lista.filter(n => n !== topo).map(n => `<article class="noticia">${noticiaHTML(n)}</article>`).join('')}</div>`;
  }

  /* Editor */
  function abrirEditor(n){
    editando = n ? n.id : null; figura = n ? n.fig : '📰';
    $('editor-titulo').textContent = n ? '✏️ Editar notícia' : '✍️ Nova notícia';
    $('f-titulo').value = n ? n.titulo : ''; $('f-texto').value = n ? n.texto : ''; $('f-secao').value = n ? n.secao : 'bizarro';
    $('f-autor').value = n ? n.autor : ler('autor', ''); $('msg').textContent = '';
    marcarFigura(); $('editor').classList.add('on'); $('editor').scrollIntoView({ behavior:'smooth', block:'start' }); $('f-titulo').focus();
  }
  $('nova').addEventListener('click', () => abrirEditor(null));
  $('cancelar').addEventListener('click', () => $('editor').classList.remove('on'));
  $('publicar').addEventListener('click', () => {
    const titulo = $('f-titulo').value.trim(), texto = $('f-texto').value.trim(), autor = $('f-autor').value.trim().slice(0, 24);
    if(titulo.length < 4){ $('msg').textContent = 'Escreva uma manchete (pelo menos 4 letras).'; return; }
    if(texto.length < 10){ $('msg').textContent = 'Conte um pouquinho mais da notícia!'; return; }
    gravar('autor', autor);
    if(editando){ const n = noticias.find(x => x.id === editando); Object.assign(n, { titulo, texto, autor, secao:$('f-secao').value, fig:figura }); }
    else noticias.push({ id:Date.now().toString(36), titulo, texto, autor, secao:$('f-secao').value, fig:figura, quando:Date.now(), curtidas:0, curti:false });
    noticias = noticias.slice(-80); gravar('noticias', noticias);
    $('editor').classList.remove('on'); desenhar(); window.scrollTo({ top:0, behavior:'smooth' });
  });

  /* 🎲 Manchete maluca */
  const QUEM = ['Pikachu', 'Um pintinho gigante', 'O diretor da escola', 'Um Snorlax', 'Um dinossauro de patins', 'O Gengar', 'Um robô cozinheiro', 'Uma vaca astronauta', 'O Psyduck', 'Um ET de chinelo', 'Uma girafa cantora', 'O Charizard'];
  const FEZ = ['é preso por roubar', 'ganha campeonato de', 'é visto dançando com', 'abre uma loja de', 'tropeça em', 'escreve um livro sobre', 'descobre uma montanha de', 'troca a escola inteira por', 'é eleito rei de', 'faz greve por mais'];
  const COISA = ['ketchup', 'meias perdidas', 'sorvete de brócolis', 'pizza voadora', 'Pokébolas', 'cocô de unicórnio', 'travesseiros', 'videogames', 'chiclete gigante', 'bananas', 'ovos de dragão', 'lição de casa'];
  const sorte = a => a[Math.floor(Math.random() * a.length)];
  $('maluca').addEventListener('click', () => {
    abrirEditor(null);
    $('f-titulo').value = `${sorte(QUEM)} ${sorte(FEZ)} ${sorte(COISA)}!`;
    figura = sorte(FIGURAS); marcarFigura(); $('f-secao').value = 'bizarro'; $('f-texto').focus();
  });

  /* Curtir, editar, apagar, mandar */
  const LINK = location.origin + location.pathname;
  const b64 = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const deB64 = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
  const soma = s => { let h = 7; for(const c of s) h = (h * 31 + c.charCodeAt(0)) % 1679616; return h.toString(36).toUpperCase().padStart(4, '0'); };
  $('capa').addEventListener('click', async ev => {
    const b = ev.target.closest('button'); if(!b) return;
    const achar = id => noticias.find(n => n.id === id);
    if(b.dataset.curtir){ const n = achar(b.dataset.curtir); n.curti = !n.curti; n.curtidas = Math.max(0, (n.curtidas || 0) + (n.curti ? 1 : -1)); gravar('noticias', noticias); desenhar(); }
    if(b.dataset.editar) abrirEditor(achar(b.dataset.editar));
    if(b.dataset.apagar){ if(confirm('Apagar essa notícia?')){ noticias = noticias.filter(n => n.id !== b.dataset.apagar); gravar('noticias', noticias); desenhar(); } }
    if(b.dataset.mandar){
      const n = achar(b.dataset.mandar), d = b64(JSON.stringify({ t:n.titulo, x:n.texto, a:n.autor, s:n.secao, f:n.fig }));
      const url = `${LINK}#JJ1-${d}-${soma(d)}`;
      try{ if(navigator.share){ await navigator.share({ title:'Jornal do Jojo', text:`📰 ${n.titulo}`, url }); return; } }catch(e){ if(e.name === 'AbortError') return; }
      try{ await navigator.clipboard.writeText(url); b.textContent = '✅ Link copiado!'; }catch(e){ prompt('Copie o link:', url); }
      setTimeout(() => desenhar(), 1800);
    }
  });

  /* 📥 Notícia que chegou por link */
  function abrirLink(){
    const m = /^#JJ1-([A-Za-z0-9_-]+)-([0-9A-Z]{4})$/.exec(location.hash); if(!m) return;
    history.replaceState(null, '', location.pathname);
    if(soma(m[1]) !== m[2]){ $('lida').innerHTML = '<p>❌ Esse link de notícia está quebrado.</p>'; $('lida').classList.add('on'); return; }
    let o; try{ o = JSON.parse(deB64(m[1])); }catch(e){ return; }
    const n = { id:'lida', titulo:String(o.t || '').slice(0, 90), texto:String(o.x || '').slice(0, 900), autor:String(o.a || '').slice(0, 24), secao:SECOES.some(s => s[0] === o.s) ? o.s : 'bizarro', fig:FIGURAS.includes(o.f) ? o.f : '📰', quando:Date.now() };
    if(n.titulo.length < 4) return;
    $('lida').innerHTML = `<p class="secao">📬 Um amigo te mandou esta notícia</p><div class="fig" style="font-size:60px">${esc(n.fig)}</div><span class="secao">${esc(nomeSecao(n.secao))}</span><h2 style="font:900 32px/1.1 'Playfair Display',serif;margin:4px 0">${esc(n.titulo)}</h2><p class="texto">${esc(n.texto)}</p><p class="assina">Por ${esc(n.autor || 'Repórter misterioso')}</p>
      <div class="barra" style="justify-content:flex-start"><button type="button" id="guardar">📰 Colocar no meu jornal</button><button type="button" class="claro" id="fechar-lida">Fechar</button></div>`;
    $('lida').classList.add('on');
    $('guardar').addEventListener('click', () => { noticias.push({ ...n, id:Date.now().toString(36), curtidas:0, curti:false }); gravar('noticias', noticias); $('lida').classList.remove('on'); desenhar(); });
    $('fechar-lida').addEventListener('click', () => $('lida').classList.remove('on'));
  }
  addEventListener('hashchange', abrirLink);
  $('imprimir').addEventListener('click', () => print());
  desenhar(); abrirLink();
})();
</script>
</body>
</html>
