<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a0b2e">
<title>🎃 Hellow Click</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<style>
:root{
  --abobora:#ff7518; --abobora2:#ffb347; --roxo:#2b1055; --roxo2:#1a0b2e; --roxo3:#3d1a6d;
  --verde:#7fff6a; --texto:#f3e8ff; --texto2:#a78bca; --ouro:#ffd700; --sangue:#e63946;
  --borda:#4c2a85;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--texto);
  background:var(--roxo2);min-height:100dvh;overflow-x:hidden;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(255,117,24,.16),transparent 55%),
                   radial-gradient(circle at 85% 80%,rgba(127,255,106,.07),transparent 45%);
  padding-bottom:env(safe-area-inset-bottom)
}
.titulo-fonte{font-family:'Creepster',system-ui,cursive;letter-spacing:2px;font-weight:400}

/* ---------- morcegos de fundo ---------- */
.morcego-fundo{position:fixed;font-size:1.3rem;opacity:.13;pointer-events:none;z-index:0;
  animation:voa linear infinite}
@keyframes voa{
  0%{transform:translate(-12vw,0) scale(1)}
  50%{transform:translate(50vw,-40px) scale(1.15)}
  100%{transform:translate(112vw,0) scale(1)}
}

.envolve{max-width:520px;margin:0 auto;padding:14px 14px 30px;position:relative;z-index:1}

/* ---------- placar ---------- */
.placar{text-align:center;margin-bottom:6px}
.placar h1{font-size:2rem;color:var(--abobora);text-shadow:0 0 18px rgba(255,117,24,.55)}
.doces{font-size:2.3rem;font-weight:900;line-height:1.1;margin-top:6px}
.doces small{font-size:1rem;color:var(--texto2);font-weight:700}
.porseg{font-size:.85rem;color:var(--verde);font-weight:800;margin-top:1px;height:1.2em}

/* ---------- a abóbora ---------- */
.palco{position:relative;display:flex;justify-content:center;margin:10px 0 16px;height:190px}
#abobora{
  font-size:8.5rem;line-height:1;cursor:pointer;
  filter:drop-shadow(0 0 26px rgba(255,117,24,.65));transition:transform .06s
}
#abobora:active{transform:scale(.9)}
#abobora.tremendo{animation:treme .35s}
@keyframes treme{
  0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) scale(1.06)}
  75%{transform:rotate(7deg) scale(1.06)}
}
.subindo{
  position:absolute;font-weight:900;font-size:1.2rem;color:var(--abobora2);pointer-events:none;
  text-shadow:0 2px 6px rgba(0,0,0,.7);animation:sobe 1s ease-out forwards;z-index:3
}
@keyframes sobe{
  0%{opacity:1;transform:translateY(0) scale(.7)}
  30%{transform:translateY(-22px) scale(1.15)}
  100%{opacity:0;transform:translateY(-78px) scale(1)}
}

/* ---------- abóbora dourada ---------- */
#dourada{
  position:fixed;font-size:3rem;cursor:pointer;z-index:40;display:none;
  filter:drop-shadow(0 0 22px var(--ouro));animation:pulsa .9s ease-in-out infinite
}
#dourada.on{display:block}
@keyframes pulsa{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.18) rotate(6deg)}}

.faixa-bonus{
  background:linear-gradient(90deg,var(--ouro),var(--abobora2));color:#2b1055;font-weight:900;
  text-align:center;padding:7px;border-radius:12px;margin-bottom:10px;font-size:.9rem;display:none
}
.faixa-bonus.on{display:block;animation:brilha 1s ease-in-out infinite}
@keyframes brilha{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}

/* ---------- abas ---------- */
.abas{display:flex;gap:6px;margin-bottom:12px}
.abas button{
  flex:1;padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.05);
  border:2px solid transparent;font-size:.78rem;font-weight:800;color:var(--texto2)
}
.abas button.on{border-color:var(--abobora);color:var(--abobora);background:rgba(255,117,24,.14)}
.painel{display:none}.painel.on{display:block}

/* ---------- itens da loja ---------- */
.item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px;
  border-radius:14px;background:rgba(255,255,255,.05);border:2px solid var(--borda);
  margin-bottom:8px;transition:transform .08s
}
.item:active{transform:scale(.985)}
.item.pode{border-color:var(--verde);background:rgba(127,255,106,.09)}
.item.caro{opacity:.5}
/* span é inline por natureza: sem display:block o nome e a descrição
   sairiam grudados na mesma linha */
.item .ic{display:block;font-size:1.9rem;flex-shrink:0;width:42px;text-align:center}
.item .meio{display:block;flex:1;min-width:0}
.item .nome{display:block;font-weight:800;font-size:.92rem}
.item .desc{display:block;font-size:.7rem;color:var(--texto2);margin-top:1px;line-height:1.35}
.item .dir{display:block;text-align:right;flex-shrink:0}
.item .preco{display:block;font-weight:900;font-size:.85rem;color:var(--ouro)}
.item .preco.caro{color:var(--sangue)}
.item .qtd{display:block;font-size:.68rem;color:var(--texto2);font-weight:800;margin-top:1px}

/* ---------- conquistas ---------- */
.grade-conq{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.conq{
  background:rgba(255,255,255,.05);border:2px solid var(--borda);border-radius:12px;
  padding:9px 5px;text-align:center
}
.conq.tem{border-color:var(--ouro);background:rgba(255,215,0,.12)}
.conq .e{font-size:1.5rem}
.conq.falta .e{filter:grayscale(1) brightness(.5)}
.conq .n{font-size:.6rem;font-weight:800;margin-top:2px;line-height:1.25}
.conq.falta .n{color:var(--texto2)}
.conq .d{font-size:.55rem;color:var(--texto2);margin-top:2px;line-height:1.2}

/* ---------- avisos ---------- */
.aviso{
  position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;
  background:var(--roxo3);border:2px solid var(--ouro);color:var(--ouro);font-weight:800;
  padding:10px 18px;border-radius:99px;font-size:.85rem;box-shadow:0 6px 24px rgba(0,0,0,.5);
  animation:apareceAviso 3.4s ease forwards;max-width:92vw;text-align:center
}
@keyframes apareceAviso{
  0%{opacity:0;transform:translate(-50%,16px)}
  12%,80%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-10px)}
}

/* ---------- caixa de "enquanto cê tava fora" ---------- */
.fundo-modal{position:fixed;inset:0;background:rgba(15,6,26,.86);display:none;
  align-items:center;justify-content:center;z-index:70;padding:20px}
.fundo-modal.on{display:flex}
.modal{background:var(--roxo);border:2px solid var(--abobora);border-radius:20px;
  padding:24px 20px;text-align:center;max-width:340px}
.modal h2{font-size:1.3rem;color:var(--abobora);margin-bottom:8px}
.modal p{font-size:.88rem;color:var(--texto2);line-height:1.55}
.modal b{color:var(--verde);font-size:1.15rem}
.modal .btn{background:var(--abobora);color:#2b1055;font-weight:900;padding:11px 26px;
  border-radius:99px;margin-top:16px}

/* ---------- rodapé ---------- */
.rodape{margin-top:20px;text-align:center;font-size:.72rem;color:var(--texto2);line-height:1.7}
.rodape .linha{display:flex;gap:8px;justify-content:center;margin-top:9px;flex-wrap:wrap}
.rodape button{border:2px solid var(--borda);border-radius:99px;padding:7px 15px;
  font-size:.74rem;font-weight:800;color:var(--texto2)}
.rodape button.perigo{border-color:var(--sangue);color:var(--sangue)}
</style>
</head>
<body>

<div class="envolve">

  <div class="placar">
    <h1 class="titulo-fonte">Hellow Click</h1>
    <div class="doces"><span id="doces">0</span> <small>doces 🍬</small></div>
    <div class="porseg" id="porSeg"></div>
  </div>

  <div class="faixa-bonus" id="faixaBonus"></div>

  <div class="palco">
    <div id="abobora">🎃</div>
  </div>

  <div class="abas">
    <button class="on" data-aba="cliques" onclick="trocarAba('cliques')">🖱️ Clique</button>
    <button data-aba="bichos" onclick="trocarAba('bichos')">👹 Ajudantes</button>
    <button data-aba="conquistas" onclick="trocarAba('conquistas')">🏆 Troféus</button>
  </div>

  <div class="painel on" id="painel-cliques"><div id="listaCliques"></div></div>
  <div class="painel" id="painel-bichos"><div id="listaBichos"></div></div>
  <div class="painel" id="painel-conquistas">
    <div class="grade-conq" id="listaConquistas"></div>
  </div>

  <div class="rodape">
    <span id="rodapeInfo"></span>
    <div class="linha">
      <button onclick="salvarAgora()">💾 Salvar</button>
      <button onclick="virarSom()" id="btnSom">🔊 Som</button>
      <button class="perigo" onclick="apagarTudo()">💀 Recomeçar</button>
    </div>
  </div>
</div>

<div id="dourada">🎃</div>

<div class="fundo-modal" id="modalFora">
  <div class="modal">
    <h2>🌙 Enquanto cê dormia...</h2>
    <p>Teus monstrinhos não pararam de trabalhar.<br>Eles juntaram <b id="foraQuanto">0</b> doces!</p>
    <button class="btn" onclick="fecharFora()">Valeu, galera 🍬</button>
  </div>
</div>

<script src="jogo.js?v=1"></script>
</body>
</html>
