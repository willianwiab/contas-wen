<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>🔧 Consertar o Fala, Turma</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f4f2fb;color:#1e1b33;
  min-height:100dvh;display:grid;place-items:center;padding:22px}
.caixa{background:#fff;border-radius:24px;box-shadow:0 8px 30px rgba(60,40,120,.14);
  padding:26px 22px;max-width:420px;width:100%;text-align:center}
.emojao{font-size:3.6rem;display:block;margin-bottom:8px}
h1{font-size:1.25rem;margin-bottom:8px}
p{font-size:.92rem;line-height:1.6;color:#6b6885;margin-bottom:14px}
#passos{text-align:left;background:#f1eefb;border-radius:16px;padding:13px 15px;
  font-size:.86rem;line-height:1.9;margin-bottom:14px}
.bt{display:block;width:100%;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;
  border:0;border-radius:16px;padding:16px;font-size:1rem;font-weight:800;cursor:pointer;
  font-family:inherit;text-decoration:none}
.bt:active{transform:scale(.96)}
b{color:#1e1b33}
.versao{font-size:.8rem;color:#6b6885;margin-top:14px}
code{background:#f1eefb;border-radius:6px;padding:2px 7px;font-weight:700}
</style>
</head>
<body>
<div class="caixa">
  <span class="emojao">🔧</span>
  <h1>Consertando o Fala, Turma</h1>
  <p>Teu aparelho guardou uma versão velha do app. Esta página joga fora tudo que estava
  guardado e abre a versão nova.</p>
  <div id="passos">Começando...</div>
  <a class="bt" id="btIr" href="./">🎒 Abrir o Fala, Turma</a>
  <p class="versao" id="versao"></p>
</div>

<script>
const passos = document.getElementById('passos');
const linhas = [];
function diz(txt){ linhas.push(txt); passos.innerHTML = linhas.join('<br>'); }

(async () => {
  /* 1. joga fora o que o app guardou pra abrir sem internet */
  try{
    if(window.caches){
      const nomes = await caches.keys();
      for(const n of nomes) await caches.delete(n);
      diz(nomes.length ? `✅ Joguei fora ${nomes.length} pacote(s) guardado(s)` : '✅ Não tinha nada guardado');
    }else diz('✅ Este navegador não guarda nada');
  }catch(e){ diz('⚠️ Não consegui limpar o guardado'); }

  /* 2. desliga o ajudante de offline, que é quem servia o velho */
  try{
    if(navigator.serviceWorker){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const r of regs) await r.unregister();
      diz(regs.length ? `✅ Desliguei ${regs.length} ajudante(s) de offline` : '✅ Nenhum ajudante ligado');
    }
  }catch(e){ diz('⚠️ Não consegui desligar o ajudante'); }

  /* 3. o que tu escreveu no mural NÃO é apagado — fica no aparelho */
  diz('💜 Teus recados e a tua turma continuam salvos');

  /* 4. mostra qual versão está no ar agora */
  try{
    const r = await fetch('./versao.json?' + Date.now(), { cache:'no-store' });
    const v = (await r.json()).v;
    document.getElementById('versao').innerHTML = 'Versão no ar agora: <code>v' + v + '</code>';
    document.getElementById('btIr').href = './?nova=' + Date.now();
    diz('✅ Pronto! Pode apertar o botão 👇');
  }catch(e){
    diz('⚠️ Não consegui falar com o site — tu está sem internet?');
  }
})();
</script>
</body>
</html>
